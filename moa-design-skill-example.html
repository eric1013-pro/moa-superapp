                  <div class="w-11 h-7 rounded-[7px] bg-gradient-to-br ${activeCard.gradient} ${activeCard.locked ? 'grayscale opacity-60' : ''} flex items-end justify-between p-1.5 shadow-sm shrink-0">
                    <span class="w-2 h-1.5 rounded-[1.5px] bg-amber-200/90"></span>
                    <span class="text-[6px] font-extrabold text-white/90">MOA</span>
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <p class="text-[12.5px] font-medium text-ink-muted truncate">${escapeHtml(activeCard.name)}</p>
                      ${activeCard.locked ? '<span class="px-1.5 py-0.5 rounded-md bg-danger-soft text-danger text-[9px] font-extrabold">잠금</span>' : ''}
                    </div>
                    <p class="${large ? 'text-[19px]' : 'text-[17px]'} font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">${displayMoney(activeCard.monthlySpent)}</p>
                  </div>
                </div>
                <span class="px-3.5 py-2 rounded-[10px] ${tossPillCls()} text-[12px] font-bold shrink-0">관리</span>
              </button>
            </div>

            <!-- 내 신용점수 -->
            <div class="pt-3 border-t ${t('border-slate-100', 'border-white/[0.06]')}">
              <button type="button" onclick="openCreditScoreSheet()" class="w-full flex items-center justify-between gap-3 text-left tap-row cursor-pointer">
                <div class="flex items-center gap-3.5 min-w-0">
                  <div class="w-11 h-11 rounded-full bg-purple-500/15 text-purple-400 flex items-center justify-center shrink-0">${ICONS.gauge}</div>
                  <div class="min-w-0">
                    <p class="text-[12.5px] font-medium text-ink-muted">내 신용점수</p>
                    <div class="flex items-baseline gap-1.5">
                      <p class="${large ? 'text-[19px]' : 'text-[17px]'} font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">${state.creditScore}점</p>
                      <span class="text-[11.5px] font-bold text-emerald-400">상위 ${state.creditScore >= 945 ? '3%' : '4%'}</span>
                    </div>
                  </div>
                </div>
                <span class="px-3 py-2 rounded-[10px] ${tossPillCls()} text-[12px] font-bold shrink-0">올리기</span>
              </button>
            </div>
          </section>

          <!-- 3) 모으기 목표 저금통 상세 카드 -->
          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3" ${cardMotionAttr(3)}>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <h2 class="text-[16px] font-extrabold tracking-[-0.025em] ${textPrimary}">모으기 저금통</h2>
                ${xrayPin('home-goals', '원탭 저축')}
              </div>
              <button type="button" onclick="openNewGoalSheet()" class="text-[12.5px] font-bold text-brand cursor-pointer">+ 추가</button>
            </div>
            <div class="space-y-2.5">${goalsHtml}</div>
          </section>

          <!-- 4) 1/N 더치페이 정산기 -->
          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3" ${cardMotionAttr(4)}>
            <div class="flex items-center justify-between">
              <h2 class="text-[16px] font-extrabold tracking-[-0.025em] ${textPrimary}">1/N 더치페이</h2>
              <button type="button" onclick="openSplitAmountSheet()" class="text-[12.5px] font-bold text-brand hover:underline cursor-pointer [font-variant-numeric:tabular-nums]">총 ${formatWon(state.split.totalAmount)} 수정</button>
            </div>

            <div class="p-3.5 rounded-2xl ${subSurface()} flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button type="button" onclick="adjustSplitPeople(-1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold text-sm tap-btn cursor-pointer">-</button>
                <span class="text-[13.5px] font-extrabold ${textPrimary} px-1.5 [font-variant-numeric:tabular-nums]">${state.split.people}명</span>
                <button type="button" onclick="adjustSplitPeople(1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold text-sm tap-btn cursor-pointer">+</button>
              </div>
              <div class="text-right">
                <p class="text-[15.5px] font-extrabold text-brand [font-variant-numeric:tabular-nums]">1인당 ${formatWon(perPerson)}</p>
                <p class="text-[11px] text-ink-muted [font-variant-numeric:tabular-nums]">${remainder > 0 ? `자투리 ${formatWon(remainder)}은 모임장이 부담` : '10원 단위까지 딱 떨어져요'}</p>
              </div>
            </div>

            <button type="button" onclick="copySplitResult()" class="w-full py-3 rounded-xl ${tossPillCls()} text-[12.5px] font-bold tap-btn cursor-pointer">계좌번호 포함 정산 메시지 복사</button>
          </section>

          <!-- 5) 최근 거래 내역 -->
          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-1.5" ${cardMotionAttr(5)}>
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-[16px] font-extrabold tracking-[-0.025em] ${textPrimary}">최근 내역</h2>
              <button type="button" onclick="switchTab('spending')" class="text-[12px] font-semibold text-ink-muted hover:text-brand cursor-pointer">전체보기</button>
            </div>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">${recentTxHtml}</div>
          </section>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 7. 화면 2: 소비·분석 (`spending`)
     * ============================================================================
     */
    function setSpendingCategory(cat) {
      state.spendingFilter.category = cat;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function setSpendingQuery(val) {
      state.spendingFilter.query = val;
      state.motion.enterType = 'none';
      renderAppContent();
      const input = document.getElementById('spendingSearchInput');
      if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
    }

    function resetSpendingFilter() {
      state.spendingFilter.query = '';
      state.spendingFilter.category = '전체';
      state.motion.enterType = 'none';
      renderAppContent();
      showToast('필터를 초기화했어요.', 'brand');
    }

    function openBudgetSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      openSheet(`
        <div class="space-y-5">
          <div>
            <h3 class="text-[18px] font-extrabold ${textPrimary}">한 달 목표 예산 설정</h3>
            <p class="text-xs text-ink-muted mt-1">예산의 80%에 도달하면 미리 알림을 보내드려요.</p>
          </div>
          <div class="text-center py-2">
            <p id="budgetPreviewText" class="text-3xl font-extrabold text-brand [font-variant-numeric:tabular-nums]">${formatWon(state.monthlyBudget)}</p>
            <p class="text-xs text-ink-muted mt-1 [font-variant-numeric:tabular-nums]">현재 11월 지출: ${formatWon(getMonthlySpent())}</p>
          </div>
          <input id="budgetRangeSlider" type="range" min="200000" max="2000000" step="50000" value="${state.monthlyBudget}" oninput="updateBudgetPreview(this.value)" class="w-full accent-brand cursor-pointer" />
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setBudgetPreset(400000)" class="py-2.5 rounded-xl ${subSurface()} text-xs font-bold tap-btn cursor-pointer">40만</button>
            <button type="button" onclick="setBudgetPreset(600000)" class="py-2.5 rounded-xl ${subSurface()} text-xs font-bold tap-btn cursor-pointer">60만</button>
            <button type="button" onclick="setBudgetPreset(800000)" class="py-2.5 rounded-xl ${subSurface()} text-xs font-bold tap-btn cursor-pointer">80만</button>
            <button type="button" onclick="setBudgetPreset(1200000)" class="py-2.5 rounded-xl ${subSurface()} text-xs font-bold tap-btn cursor-pointer">120만</button>
          </div>
          <button type="button" onclick="saveMonthlyBudget()" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">목표 예산 저장하기</button>
        </div>
      `);
    }

    function updateBudgetPreview(val) {
      const el = document.getElementById('budgetPreviewText');
      if (el) el.textContent = formatWon(parseInt(val, 10) || 500000);
    }

    function setBudgetPreset(val) {
      const slider = document.getElementById('budgetRangeSlider');
      if (slider) slider.value = val;
      updateBudgetPreview(val);
    }

    function saveMonthlyBudget() {
      state.monthlyBudget = parseInt(document.getElementById('budgetRangeSlider')?.value || state.monthlyBudget, 10);
      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      showToast(`목표 예산을 ${formatWon(state.monthlyBudget)}으로 바꿨어요.`, 'brand');
      checkBudgetAlertThreshold();
    }

    function openAddExpenseSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const inputCls = t('bg-canvas border-slate-200 text-ink-primary', 'bg-[#25252B] border-white/10 text-white');
      openSheet(`
        <div class="space-y-4">
          <h3 class="text-[18px] font-extrabold ${textPrimary}">새로운 지출 기록하기</h3>
          <div class="space-y-3">
            <input id="newExpTitle" type="text" placeholder="사용처 (예: 모아 베이커리 성수)" class="w-full px-3.5 py-2.5 rounded-2xl border text-sm ${inputCls}" />
            <div class="grid grid-cols-2 gap-2">
              <select id="newExpCat" class="w-full px-3 py-2.5 rounded-2xl border text-sm ${inputCls}">
                <option value="식비">식비</option><option value="카페">카페</option><option value="쇼핑">쇼핑</option><option value="교통">교통</option><option value="생활">생활</option>
              </select>
              <input id="newExpAmount" type="number" value="15000" step="1000" class="w-full px-3.5 py-2.5 rounded-2xl border text-sm font-bold [font-variant-numeric:tabular-nums] ${inputCls}" />
            </div>
          </div>
          <button type="button" onclick="saveNewExpense()" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">지출 추가하기</button>
        </div>
      `);
    }

    function saveNewExpense() {
      const title = (document.getElementById('newExpTitle')?.value || '').trim() || '모아 베이커리';
      const category = document.getElementById('newExpCat')?.value || '식비';
      const amount = Math.max(500, parseInt(document.getElementById('newExpAmount')?.value || '15000', 10));
      const iconMap = { 식비: 'leaf', 카페: 'coffee', 쇼핑: 'bag', 교통: 'train', 생활: 'wallet' };
      const toneMap = { 식비: 'bg-emerald-500/15 text-emerald-400', 카페: 'bg-amber-500/15 text-amber-400', 쇼핑: 'bg-purple-500/15 text-purple-400', 교통: 'bg-sky-500/15 text-sky-400', 생활: 'bg-rose-500/15 text-rose-400' };

      state.balance = Math.max(0, state.balance - amount);
      state.transactions.unshift({
        id: Date.now(), title, category, amount: -amount, time: '방금 전',
        iconKey: iconMap[category] || 'wallet', tone: toneMap[category] || 'bg-brand-soft text-brand', memo: '직접 기록한 지출',
      });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      showToast(`${title} ${formatWon(amount)} 지출을 기록했어요.`);
      checkBudgetAlertThreshold();
    }

    function renderSpendingScreen() {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#9EA6B2]');
      const cAnim = cardMotionCls();

      const expenseTxs = state.transactions.filter((tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체');
      const totalSpent = getMonthlySpent();
      const remainBudget = Math.max(0, state.monthlyBudget - totalSpent);
      const dailyGuide = Math.round(remainBudget / 8);

      const catSums = {};
      expenseTxs.forEach((tx) => { catSums[tx.category] = (catSums[tx.category] || 0) + Math.abs(tx.amount); });
      const sortedCats = Object.entries(catSums).sort((a, b) => b[1] - a[1]);
      const topCat = sortedCats[0] || null;
      const catColors = { 생활: 'bg-brand', 식비: 'bg-emerald-500', 쇼핑: 'bg-purple-500', 교통: 'bg-amber-500', 구독: 'bg-rose-500', 카페: 'bg-sky-400' };

      const stackedBarHtml = sortedCats.map(([cat, amt]) => `<div class="h-full ${catColors[cat] || 'bg-slate-400'} transition-all duration-500 ease-toss" style="width: ${totalSpent > 0 ? Math.max(6, Math.round((amt / totalSpent) * 100)) : 0}%"></div>`).join('');
      const legendHtml = sortedCats.map(([cat, amt]) => `
        <div class="flex items-center justify-between py-1.5 text-[13px]">
          <div class="flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full ${catColors[cat] || 'bg-slate-400'}"></span>
            <span class="font-bold ${textPrimary}">${escapeHtml(cat)}</span>
            <span class="text-xs text-ink-muted">${Math.round((amt / totalSpent) * 100)}%</span>
          </div>
          <span class="font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">${displayMoney(amt)}</span>
        </div>
      `).join('');

      const categories = ['전체', '식비', '카페', '생활', '교통', '쇼핑', '구독'];
      const q = state.spendingFilter.query.trim().toLowerCase();
      const filteredTxs = state.transactions.filter((tx) => (state.spendingFilter.category === '전체' || tx.category === state.spendingFilter.category) && (!q || tx.title.toLowerCase().includes(q) || tx.category.toLowerCase().includes(q) || (tx.memo && tx.memo.toLowerCase().includes(q))));

      const txListHtml =
        filteredTxs.length > 0
          ? filteredTxs
              .map(
                (tx) => `
                  <button type="button" onclick="openTxReceiptSheet(${tx.id})" class="w-full py-3.5 px-2 -mx-2 rounded-2xl flex items-center justify-between gap-3 text-left ${t('hover:bg-slate-50', 'hover:bg-white/[0.03]')} tap-row cursor-pointer">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 rounded-full ${tx.tone || 'bg-brand-soft text-brand'} flex items-center justify-center shrink-0">${getIcon(tx.iconKey, 'wallet')}</div>
                      <div class="min-w-0">
                        <p class="text-[14px] font-semibold ${textPrimary} truncate">${escapeHtml(tx.title)}</p>
                        <p class="text-[11px] text-ink-muted truncate">${escapeHtml(tx.category)} · ${escapeHtml(tx.time)}${tx.memo ? ` · ${escapeHtml(tx.memo)}` : ''}</p>
                      </div>
                    </div>
                    <span class="text-[14px] font-bold ${tx.amount > 0 ? 'text-brand' : textPrimary} [font-variant-numeric:tabular-nums] shrink-0">${displayMoney(tx.amount, true)}</span>
                  </button>
                `
              )
              .join('')
          : `
            <div class="py-12 text-center space-y-3">
              <div class="w-11 h-11 rounded-2xl ${subSurface()} mx-auto flex items-center justify-center text-ink-muted">${ICONS.search}</div>
              <div>
                <p class="text-sm font-bold ${textPrimary}">찾으시는 내역이 없어요</p>
                <p class="text-xs text-ink-muted mt-0.5">필터를 초기화하고 전체 내역을 확인해 볼까요?</p>
              </div>
              <button type="button" onclick="resetSpendingFilter()" class="px-4 py-2 rounded-xl bg-brand-soft text-brand text-xs font-extrabold tap-btn cursor-pointer">필터 초기화하고 전체 보기</button>
            </div>
          `;

      return `
        <div class="px-4 pb-6 space-y-3.5 ${screenMotionCls()}">
          ${renderSubScreenTopHeader('소비 · 분석', `<button type="button" onclick="openAddExpenseSheet()" class="px-3 py-1.5 rounded-[10px] bg-brand-soft text-brand text-xs font-extrabold tap-btn cursor-pointer">+ 기록</button>`)}

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5" ${cardMotionAttr(0)}>
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-ink-muted">11월 총 지출</span>
              <div class="flex items-center gap-1.5">
                ${xrayPin('spending-budget', '예산 가이드')}
                <button type="button" onclick="openBudgetSheet()" class="px-2.5 py-1 rounded-[10px] ${tossPillCls()} text-[11px] font-bold tap-btn cursor-pointer">예산 수정</button>
              </div>
            </div>
            <p class="${large ? 'text-[28px]' : 'text-[25px]'} font-extrabold tracking-[-0.03em] ${textPrimary} mt-1 [font-variant-numeric:tabular-nums]">${displayMoney(totalSpent)}</p>
            <p class="text-[12.5px] ${textSecondary} mt-1.5 leading-relaxed">
              ${topCat ? `이번 달엔 <strong class="font-bold ${textPrimary}">${escapeHtml(topCat[0])}</strong>에 가장 많이 썼어요. 남은 8일간 하루 <strong class="font-bold text-brand [font-variant-numeric:tabular-nums]">${formatWon(dailyGuide)}</strong>씩 쓰면 예산에 딱 맞아요.` : '아직 이번 달 지출 내역이 없어요.'}
            </p>
            <div class="w-full h-3 rounded-full overflow-hidden flex gap-0.5 mt-4 ${subSurface()}">${stackedBarHtml}</div>
            <div class="mt-4 space-y-0.5">${legendHtml || '<p class="text-xs text-ink-muted py-2">기록된 지출이 없어요.</p>'}</div>
          </section>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3.5" ${cardMotionAttr(1)}>
            <div class="flex items-center justify-between">
              <h2 class="text-[15.5px] font-extrabold ${textPrimary}">내역 찾아보기</h2>
              ${xrayPin('spending-empty', '빈 화면 UX')}
            </div>
            <div class="relative">
              <input id="spendingSearchInput" type="text" value="${escapeHtml(state.spendingFilter.query)}" oninput="setSpendingQuery(this.value)" placeholder="가맹점, 카테고리, 메모 검색" class="w-full pl-9 pr-8 py-2.5 rounded-2xl text-[13px] font-medium focus:outline-none focus:ring-2 focus:ring-brand/45 ${t('bg-canvas text-ink-primary', 'bg-[#24242B] text-white placeholder:text-ink-muted')}" />
              <span class="text-ink-muted absolute left-3 top-2.5">${ICONS.search}</span>
              ${state.spendingFilter.query ? `<button type="button" onclick="setSpendingQuery('')" class="absolute right-3 top-2.5 text-xs text-ink-muted cursor-pointer">✕</button>` : ''}
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${categories.map((cat) => `<button type="button" onclick="setSpendingCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-[11.5px] font-bold shrink-0 tap-btn cursor-pointer ${state.spendingFilter.category === cat ? 'bg-brand text-white' : `${subSurface()} ${textSecondary}`}">${cat}</button>`).join('')}
            </div>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">${txListHtml}</div>
          </section>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 8. 화면 3: 증권 (`invest`) — 기간별 실곡선 · 플로팅 크로스헤어 툴팁 · % 빠른 수량 주문
     * ============================================================================
     */
    function getInvestSummary() {
      let totalValue = 0;
      let totalCost = 0;
      state.invest.stocks.forEach((s) => {
        if (s.shares > 0) {
          totalValue += s.price * s.shares;
          totalCost += s.avgPrice * s.shares;
        }
      });
      const profit = totalValue - totalCost;
      const profitRate = totalCost > 0 ? (profit / totalCost) * 100 : 0;
      return { totalValue, totalCost, profit, profitRate };
    }

    function setInvestSegment(seg) {
      state.invest.segment = seg;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function selectStockDetail(stockId) {
      state.invest.selectedStockId = stockId;
      state.motion.enterType = 'forward';
      renderAll();
    }

    function closeStockDetail() {
      state.invest.selectedStockId = null;
      state.motion.enterType = 'back';
      renderAll();
    }

    function setStockTimeframe(tf) {
      state.invest.timeframe = tf;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function toggleStockWatch(stockId, e) {
      if (e) e.stopPropagation();
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      stock.watched = !stock.watched;
      state.motion.enterType = 'none';
      renderAppContent();
      showToast(stock.watched ? `${stock.name}을 관심 종목에 담았어요.` : `${stock.name}을 관심 종목에서 뺐어요.`, 'brand');
    }

    function getStockActiveSeries(stock) {
      const series = (stock.timeframes && stock.timeframes[state.invest.timeframe]) || stock.history;
      const copy = [...series];
      copy[copy.length - 1] = stock.price;
      return copy;
    }

    function handleChartScrub(event, stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const series = getStockActiveSeries(stock);
      const svg = event.currentTarget;
      const rect = svg.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const idx = Math.min(series.length - 1, Math.round(ratio * (series.length - 1)));
      const priceVal = series[idx];

      const min = Math.min(...series);
      const max = Math.max(...series);
      const range = Math.max(1, max - min);
      const x = (idx / (series.length - 1)) * 300 + 10;
      const y = 128 - ((priceVal - min) / range) * 96;

      const line = document.getElementById('scrubCrosshairLine');
      const dot = document.getElementById('scrubCrosshairDot');
      const halo = document.getElementById('scrubCrosshairHalo');
      const tip = document.getElementById('scrubFloatingTip');
      if (line) { line.setAttribute('x1', x); line.setAttribute('x2', x); line.style.opacity = '1'; }
      if (dot) { dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.style.opacity = '1'; }
      if (halo) { halo.setAttribute('cx', x); halo.setAttribute('cy', y); halo.style.opacity = '0.28'; }
      if (tip) {
        const clampedPct = Math.min(82, Math.max(18, (x / 320) * 100));
        tip.style.left = `${clampedPct}%`;
        tip.style.opacity = '1';
        tip.textContent = `${state.invest.timeframe} #${idx + 1} · ${formatWon(priceVal)}`;
      }
      const priceEl = document.getElementById('stockDetailLivePrice');
      if (priceEl) priceEl.textContent = formatWon(priceVal);
    }

    function clearChartScrub(stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      ['scrubCrosshairLine', 'scrubCrosshairDot', 'scrubCrosshairHalo', 'scrubFloatingTip'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0';
      });
      const priceEl = document.getElementById('stockDetailLivePrice');
      if (priceEl) priceEl.textContent = formatWon(stock.price);
    }

    let orderQtyState = 1;
    function openStockOrderSheet(stockId, side = 'buy') {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = 1;
      const isBuy = side === 'buy';
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const maxQty = isBuy ? Math.max(1, Math.floor(state.balance / stock.price)) : Math.max(1, stock.shares);

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded-full ${isBuy ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand'} text-[10.5px] font-bold mb-1">${isBuy ? '빠른 구매 주문' : '빠른 판매 주문'}</span>
              <h3 class="text-[18px] font-extrabold ${textPrimary}">${escapeHtml(stock.name)} ${isBuy ? '구매' : '판매'}</h3>
            </div>
            <span class="text-sm font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">1주 ${formatWon(stock.price)}</span>
          </div>

          <div class="p-4 rounded-2xl ${subSurface()} flex items-center justify-between">
            <span class="text-xs font-semibold text-ink-muted">주문 수량</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="adjustOrderQty('${stock.id}', -1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold tap-btn cursor-pointer">-</button>
              <span id="orderQtyText" class="text-base font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">1주</span>
              <button type="button" onclick="adjustOrderQty('${stock.id}', 1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold tap-btn cursor-pointer">+</button>
            </div>
          </div>

          <!-- 토스 증권 스타일 빠른 비율(%) 버튼 -->
          <div class="grid grid-cols-4 gap-1.5">
            ${[
              { label: '10%', q: Math.max(1, Math.floor(maxQty * 0.1)) },
              { label: '25%', q: Math.max(1, Math.floor(maxQty * 0.25)) },
              { label: '50%', q: Math.max(1, Math.floor(maxQty * 0.5)) },
              { label: '최대', q: maxQty },
            ]
              .map((p) => `<button type="button" onclick="setOrderQtyExact('${stock.id}', ${p.q})" class="py-2 rounded-xl ${tossPillCls()} text-xs font-bold tap-btn cursor-pointer">${p.label}</button>`)
              .join('')}
          </div>

          <div class="flex items-center justify-between text-xs px-1">
            <span class="text-ink-muted">${isBuy ? '주문 가능 모아 통장 잔액' : '현재 보유 수량'}</span>
            <strong class="${textPrimary} [font-variant-numeric:tabular-nums]">${isBuy ? formatWon(state.balance) : `${stock.shares}주`}</strong>
          </div>

          <button id="orderSubmitBtn" type="button" onclick="executeStockOrder('${stock.id}', '${side}')" class="w-full py-3.5 rounded-2xl ${isBuy ? 'bg-danger hover:bg-rose-600' : 'bg-brand hover:bg-brand-hover'} text-white text-sm font-extrabold tap-btn cursor-pointer [font-variant-numeric:tabular-nums]">
            총 ${formatWon(stock.price)} ${isBuy ? '구매하기' : '판매하기'}
          </button>
        </div>
      `);
    }

    function setOrderQtyExact(stockId, qty) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = Math.max(1, Math.min(99, qty));
      const qtyEl = document.getElementById('orderQtyText');
      const btnEl = document.getElementById('orderSubmitBtn');
      if (qtyEl) qtyEl.textContent = `${orderQtyState}주`;
      if (btnEl) {
        const isBuy = btnEl.textContent.includes('구매');
        btnEl.textContent = `총 ${formatWon(stock.price * orderQtyState)} ${isBuy ? '구매하기' : '판매하기'}`;
      }
    }

    function adjustOrderQty(stockId, delta) {
      setOrderQtyExact(stockId, orderQtyState + delta);
    }

    function executeStockOrder(stockId, side) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const qty = orderQtyState;
      const total = stock.price * qty;
      const isBuy = side === 'buy';

      if (isBuy) {
        if (state.balance < total) { showToast('모아 통장 잔액이 부족해요.', 'danger'); return; }
        const prevCost = stock.avgPrice * stock.shares;
        stock.shares += qty;
        stock.avgPrice = Math.round((prevCost + total) / stock.shares);
        state.balance -= total;
      } else {
        if (stock.shares < qty) { showToast('보유 수량보다 많이 팔 수 없어요.', 'danger'); return; }
        stock.shares -= qty;
        if (stock.shares === 0) stock.avgPrice = 0;
        state.balance += total;
      }

      state.transactions.unshift({
        id: Date.now(), title: `모아 증권 (${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'})`, category: '투자',
        amount: isBuy ? -total : total, time: '방금 전', iconKey: 'chart',
        tone: isBuy ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand', memo: `1주당 ${formatWon(stock.price)} 체결`,
      });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      spawnFloatingReward(`${stock.name} ${qty}주 체결!`, isBuy ? 'brand' : 'success');
      pushNotification({
        category: '주식·송금', iconKey: 'chart', tone: isBuy ? 'danger' : 'brand',
        title: `${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'} 체결`,
        body: `총 ${formatWon(total)}에 체결되었어요.`, actionTab: 'invest', settingKey: 'stockAlert',
      });
    }

    function renderSparklineSvg(history, isUp, width = 54, height = 22) {
      const min = Math.min(...history);
      const max = Math.max(...history);
      const range = Math.max(1, max - min);
      const pts = history.map((v, i) => `${((i / (history.length - 1)) * (width - 4) + 2).toFixed(1)},${(height - 3 - ((v - min) / range) * (height - 6)).toFixed(1)}`).join(' ');
      return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="overflow-visible shrink-0"><polyline fill="none" stroke="${isUp ? '#F04452' : '#3182F6'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
    }

    function renderInvestScreen() {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const dividerCls = t('divide-slate-100', 'divide-white/[0.05]');
      const cAnim = cardMotionCls();

      if (state.invest.selectedStockId) {
        const stock = state.invest.stocks.find((s) => s.id === state.invest.selectedStockId) || state.invest.stocks[0];
        const series = getStockActiveSeries(stock);
        const startVal = series[0];
        const diff = stock.price - startVal;
        const rate = (diff / startVal) * 100;
        const isUp = diff >= 0;
        const strokeColor = isUp ? '#F04452' : '#3182F6';

        const min = Math.min(...series);
        const max = Math.max(...series);
        const range = Math.max(1, max - min);
        const ptsArr = series.map((v, i) => `${((i / (series.length - 1)) * 300 + 10).toFixed(1)},${(128 - ((v - min) / range) * 96).toFixed(1)}`);
        const areaPath = `M 10,142 L ${ptsArr.join(' L ')} L 310,142 Z`;

        return `
          <div class="px-4 pb-6 space-y-3.5 ${screenMotionCls()}">
            <header class="sticky top-0 z-20 -mx-4 px-4 py-3 ${stickyHeaderCls()} flex items-center justify-between">
              <button type="button" onclick="closeStockDetail()" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-full ${cardSurface()} text-xs font-bold ${textPrimary} tap-btn cursor-pointer">
                ${ICONS.chevronLeft}<span>증권</span>
              </button>
              <button type="button" onclick="toggleStockWatch('${stock.id}', event)" class="px-3.5 py-1.5 rounded-full ${stock.watched ? 'bg-danger-soft text-danger' : `${cardSurface()} text-ink-muted`} text-xs font-bold tap-btn cursor-pointer">
                ${stock.watched ? '♥ 관심 중' : '♡ 관심'}
              </button>
            </header>

            <div class="${cardSurface()} rounded-[26px] p-5 space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full ${stock.badgeTone} flex items-center justify-center font-black text-xs">${escapeHtml(stock.badge)}</div>
                  <div>
                    <p class="text-[11px] font-semibold text-ink-muted">${escapeHtml(stock.code)} · ${escapeHtml(stock.sector)}</p>
                    <h2 class="text-[18px] font-extrabold tracking-[-0.02em] ${textPrimary}">${escapeHtml(stock.name)}</h2>
                  </div>
                </div>
                ${xrayPin('invest-scrub', '크로스헤어')}
              </div>

              <div>
                <p id="stockDetailLivePrice" class="text-[29px] font-extrabold tracking-[-0.03em] ${textPrimary} [font-variant-numeric:tabular-nums]">${formatWon(stock.price)}</p>
                <p class="text-[12.5px] font-bold ${isUp ? 'text-danger' : 'text-brand'} [font-variant-numeric:tabular-nums]">
                  ${state.invest.timeframe} 전보다 ${isUp ? '+' : ''}${formatWon(diff)} (${isUp ? '+' : ''}${rate.toFixed(2)}%)
                </p>
              </div>

              <!-- 플로팅 툴팁 + 크로스헤어 SVG 영역 차트 -->
              <div class="relative pt-6">
                <div id="scrubFloatingTip" style="opacity: 0; left: 50%; transition: opacity 0.12s;" class="pointer-events-none absolute top-0 -translate-x-1/2 px-2.5 py-1 rounded-full bg-[#282832] border border-white/15 text-[10.5px] font-extrabold text-white whitespace-nowrap shadow-lg [font-variant-numeric:tabular-nums]"></div>
                <svg
                  viewBox="0 0 320 148"
                  class="w-full h-40 overflow-visible cursor-crosshair select-none touch-none"
                  onmousemove="handleChartScrub(event, '${stock.id}')"
                  ontouchmove="handleChartScrub(event, '${stock.id}')"
                  onmouseleave="clearChartScrub('${stock.id}')"
                  ontouchend="clearChartScrub('${stock.id}')"
                >
                  <defs>
                    <linearGradient id="stockAreaGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.24" />
                      <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0" />
                    </linearGradient>
                  </defs>
                  <line x1="10" y1="32" x2="310" y2="32" stroke="currentColor" class="text-white/[0.06]" stroke-dasharray="3 3" />
                  <line x1="10" y1="84" x2="310" y2="84" stroke="currentColor" class="text-white/[0.06]" stroke-dasharray="3 3" />
                  <path d="${areaPath}" fill="url(#stockAreaGrad)" />
                  <polyline fill="none" stroke="${strokeColor}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" points="${ptsArr.join(' ')}" class="animate-draw-line" style="stroke-dasharray: 560;" />
                  <line id="scrubCrosshairLine" x1="10" y1="16" x2="10" y2="142" stroke="${strokeColor}" stroke-width="1.4" stroke-dasharray="3 3" style="opacity: 0; transition: opacity 0.12s;" />
                  <circle id="scrubCrosshairHalo" cx="10" cy="80" r="10" fill="${strokeColor}" style="opacity: 0; transition: opacity 0.12s;" />
                  <circle id="scrubCrosshairDot" cx="10" cy="80" r="4.5" fill="${strokeColor}" stroke="#FFFFFF" stroke-width="2" style="opacity: 0; transition: opacity 0.12s;" />
                </svg>
              </div>

              <div class="grid grid-cols-4 gap-1 p-1 rounded-2xl ${subSurface()}">
                ${['1일', '1주', '1달', '1년'].map((tf) => `<button type="button" onclick="setStockTimeframe('${tf}')" class="py-1.5 rounded-xl text-xs font-extrabold transition-all cursor-pointer ${state.invest.timeframe === tf ? `${cardSurface()} ${textPrimary}` : 'text-ink-muted'}">${tf}</button>`).join('')}
              </div>

              <div class="p-4 rounded-2xl ${subSurface()} flex items-center justify-between text-xs">
                <div>
                  <span class="text-ink-muted">내 보유 수량</span>
                  <p class="text-sm font-extrabold ${textPrimary} mt-0.5 [font-variant-numeric:tabular-nums]">${stock.shares}주 ${stock.shares > 0 ? `(평단 ${formatWon(stock.avgPrice)})` : ''}</p>
                </div>
                <div class="text-right">
                  <span class="text-ink-muted">평가 금액</span>
                  <p class="text-sm font-extrabold ${textPrimary} mt-0.5 [font-variant-numeric:tabular-nums]">${formatWon(stock.price * stock.shares)}</p>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2.5">
                <button type="button" onclick="openStockOrderSheet('${stock.id}', 'sell')" class="py-3.5 rounded-2xl bg-brand-soft text-brand font-extrabold text-[14px] tap-btn cursor-pointer">판매하기</button>
                <button type="button" onclick="openStockOrderSheet('${stock.id}', 'buy')" class="py-3.5 rounded-2xl bg-danger hover:bg-rose-600 text-white font-extrabold text-[14px] tap-btn cursor-pointer shadow-lg shadow-danger/25">구매하기</button>
              </div>
            </div>
          </div>
        `;
      }

      const summary = getInvestSummary();
      const segIndex = state.invest.segment === 'my' ? 0 : state.invest.segment === 'popular' ? 1 : 2;
      const visibleStocks = state.invest.stocks.filter((s) => (state.invest.segment === 'my' ? s.shares > 0 : state.invest.segment === 'watch' ? s.watched : true));

      const stockRowsHtml =
        visibleStocks.length > 0
          ? visibleStocks
              .map((s, idx) => {
                const diff = s.price - s.prevClose;
                const rate = (diff / s.prevClose) * 100;
                const isUp = diff >= 0;
                return `
                  <div onclick="selectStockDetail('${s.id}')" role="button" tabindex="0" class="py-3.5 px-2 -mx-2 rounded-2xl flex items-center justify-between gap-2 cursor-pointer tap-row ${s.lastFlash}">
                    <div class="flex items-center gap-3 min-w-0">
                      ${state.invest.segment === 'popular' ? `<span class="w-4 text-center text-[13px] font-extrabold ${idx < 3 ? 'text-brand' : 'text-ink-muted'} [font-variant-numeric:tabular-nums]">${idx + 1}</span>` : ''}
                      <div class="w-10 h-10 rounded-full ${s.badgeTone} flex items-center justify-center font-black text-xs shrink-0">${escapeHtml(s.badge)}</div>
                      <div class="min-w-0">
                        <p class="${large ? 'text-[15.5px]' : 'text-[14.5px]'} font-bold ${textPrimary} truncate">${escapeHtml(s.name)}</p>
                        <p class="text-[11.5px] text-ink-muted truncate">${s.shares > 0 ? `${s.shares}주 보유` : escapeHtml(s.sector)}</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                      ${renderSparklineSvg(s.history, isUp)}
                      <div class="text-right min-w-[78px]">
                        <p class="${large ? 'text-[15px]' : 'text-[14px]'} font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">${formatWon(s.price)}</p>
                        <span class="inline-block text-[11.5px] font-bold ${isUp ? 'text-danger' : 'text-brand'} [font-variant-numeric:tabular-nums]">${isUp ? '+' : ''}${rate.toFixed(2)}%</span>
                      </div>
                    </div>
                  </div>
                `;
              })
              .join('')
          : `<div class="py-12 text-center text-xs text-ink-muted">목록에 표시할 종목이 없어요.</div>`;

      return `
        <div class="px-4 pb-6 space-y-3.5 ${screenMotionCls()}">
          <header class="sticky top-0 z-20 -mx-4 px-5 py-3 ${stickyHeaderCls()} flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h1 class="text-[20px] font-extrabold tracking-[-0.03em] ${textPrimary}">모아 증권</h1>
              ${xrayPin('invest-realtime', '실시간 틱')}
            </div>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full ${cardSurface()} text-[11px] font-bold text-ink-muted">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>정규장 실시간
            </span>
          </header>

          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar ${cAnim}" ${cardMotionAttr(0)}>
            <div class="${cardSurface()} rounded-2xl px-3.5 py-2.5 shrink-0 flex items-center gap-2 text-xs"><span class="font-bold text-ink-muted">모아종합</span><span class="font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">2,648.2</span><span class="font-bold text-danger">+0.8%</span></div>
            <div class="${cardSurface()} rounded-2xl px-3.5 py-2.5 shrink-0 flex items-center gap-2 text-xs"><span class="font-bold text-ink-muted">테크100</span><span class="font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">1,192.4</span><span class="font-bold text-danger">+1.4%</span></div>
            <div class="${cardSurface()} rounded-2xl px-3.5 py-2.5 shrink-0 flex items-center gap-2 text-xs"><span class="font-bold text-ink-muted">달러/원</span><span class="font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">1,342.5</span><span class="font-bold text-brand">-0.2%</span></div>
          </div>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-1.5" ${cardMotionAttr(1)}>
            <span class="text-xs font-semibold text-ink-muted">내 주식 총 평가금액</span>
            <div class="flex items-baseline justify-between gap-2">
              <p id="investTotalValueEl" class="${large ? 'text-[27px]' : 'text-[25px]'} font-extrabold tracking-[-0.03em] ${textPrimary} [font-variant-numeric:tabular-nums]">${displayMoney(summary.totalValue)}</p>
              <span class="px-2 py-0.5 rounded-lg ${summary.profit >= 0 ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand'} text-xs font-extrabold [font-variant-numeric:tabular-nums]">${summary.profit >= 0 ? '+' : ''}${summary.profitRate.toFixed(1)}%</span>
            </div>
            <p class="text-[12px] ${summary.profit >= 0 ? 'text-danger' : 'text-brand'} font-semibold [font-variant-numeric:tabular-nums]">평가 수익 ${summary.profit >= 0 ? '+' : ''}${formatWon(summary.profit)}</p>
          </section>

          <div class="relative p-1 rounded-2xl ${cardSurface()} grid grid-cols-3">
            <div class="absolute top-1 bottom-1 left-1 w-[calc((100%-8px)/3)] rounded-xl ${t('bg-canvas', 'bg-[#2B2B34]')} transition-transform duration-300 ease-toss pointer-events-none" style="transform: translate3d(${segIndex * 100}%, 0, 0)"></div>
            <button type="button" onclick="setInvestSegment('my')" class="relative z-10 py-2 text-[12.5px] font-extrabold cursor-pointer ${state.invest.segment === 'my' ? textPrimary : 'text-ink-muted'}">내 주식</button>
            <button type="button" onclick="setInvestSegment('popular')" class="relative z-10 py-2 text-[12.5px] font-extrabold cursor-pointer ${state.invest.segment === 'popular' ? textPrimary : 'text-ink-muted'}">인기 차트</button>
            <button type="button" onclick="setInvestSegment('watch')" class="relative z-10 py-2 text-[12.5px] font-extrabold cursor-pointer ${state.invest.segment === 'watch' ? textPrimary : 'text-ink-muted'}">관심 종목</button>
          </div>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] px-5 py-2" ${cardMotionAttr(2)}>
            <div class="divide-y ${dividerCls}">${stockRowsHtml}</div>
          </section>
        </div>
      `;
    }

    function startRealtimeStockTicker() {
      setInterval(() => {
        if (!state || !state.invest || !state.invest.stocks) return;
        const idx = Math.floor(Math.random() * state.invest.stocks.length);
        const target = state.invest.stocks[idx];
        const deltaPct = (Math.random() - 0.46) * 0.016;
        const rawDelta = Math.round((target.price * deltaPct) / 100) * 100;
        const delta = rawDelta === 0 ? (Math.random() > 0.5 ? 200 : -200) : rawDelta;

        target.price = Math.max(5000, target.price + delta);
        target.history.push(target.price);
        if (target.history.length > 14) target.history.shift();
        state.invest.stocks.forEach((s) => { s.lastFlash = ''; });
        target.lastFlash = delta > 0 ? 'animate-flash-up' : 'animate-flash-down';

        if (state.activeTab === 'invest' && !state.invest.selectedStockId) {
          state.motion.enterType = 'none';
          renderAppContent();
        }
      }, 2800);
    }

    /**
     * ============================================================================
     * 9. 화면 4: 내 카드 (`cards`)
     * ============================================================================
     */
    function getActiveCard() {
      return state.cards.list.find((c) => c.id === state.cards.activeCardId) || state.cards.list[0];
    }

    function selectCard(cardId) {
      state.cards.activeCardId = cardId;
      state.cards.revealed = false;
      state.motion.enterType = 'none';
      renderAll();
    }

    function toggleCardReveal() {
      state.cards.revealed = !state.cards.revealed;
      state.motion.enterType = 'none';
      renderAppContent();

    function executeCardTestPay(merchant, category, amount, iconKey, isOverseas, isOnline) {
      const card = getActiveCard();
      closeSheet();

      if (card.locked) { triggerCardShake(); pushNotification({ category: '보안·예산', iconKey: 'lock', tone: 'danger', title: '잠긴 카드 결제를 안전하게 막았어요', body: `${merchant} (${formatWon(amount)}) 차단됨`, actionTab: 'cards', settingKey: 'cardAlert' }); showToast('카드가 잠겨 있어 차단했어요.', 'danger'); return; }
      if (isOverseas && card.overseasBlocked) { triggerCardShake(); pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '해외 결제가 차단되었어요', body: `${merchant} (${formatWon(amount)})`, actionTab: 'cards', settingKey: 'cardAlert' }); showToast('해외 결제 차단으로 막았어요.', 'danger'); return; }
      if (isOnline && !card.onlineAllowed) { triggerCardShake(); pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '온라인 결제가 차단되었어요', body: `${merchant} (${formatWon(amount)})`, actionTab: 'cards', settingKey: 'cardAlert' }); showToast('온라인 결제가 꺼져 있어 막았어요.', 'danger'); return; }
      if (card.monthlySpent + amount > card.monthlyLimit) { triggerCardShake(); pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '월 이용 한도를 초과해 차단되었어요', body: `${merchant} (${formatWon(amount)})`, actionTab: 'cards', settingKey: 'cardAlert' }); showToast('설정한 월 한도를 초과했어요.', 'danger'); return; }
      if (card.type === '체크' && state.balance < amount) { showToast('연결된 모아 통장 잔액이 부족해요.', 'danger'); return; }

      if (card.type === '체크') state.balance -= amount;
      card.monthlySpent += amount;
      const cashback = category === '카페' ? Math.round(amount * 0.05) : Math.round(amount * 0.01);
      card.cashbackEarned += cashback;

      state.transactions.unshift({ id: Date.now(), title: merchant, category, amount: -amount, time: '방금 전', iconKey, tone: 'bg-brand-soft text-brand', memo: `${card.name} 결제` });
      state.motion.enterType = 'none';
      renderAll();
      pushNotification({ category: '카드·결제', iconKey, tone: 'brand', title: `${card.name} 승인 (${formatWon(amount)})`, body: `${merchant} 결제 완료 · 캐시백 +${formatWon(cashback)}`, actionTab: 'cards', settingKey: 'cardAlert' });
      checkBudgetAlertThreshold();
    }

    function triggerCardShake() {
      const cardEl = document.getElementById('activeCardVisual');
      if (!cardEl) return;
      cardEl.classList.remove('animate-shake');
      void cardEl.offsetWidth;
      cardEl.classList.add('animate-shake');
    }

    function checkBudgetAlertThreshold() {
      const spent = getMonthlySpent();
      const pct = Math.round((spent / state.monthlyBudget) * 100);
      if (pct >= 80 && state.settings.budgetAlert) {
        setTimeout(() => {
          pushNotification({ category: '보안·예산', iconKey: 'chart', tone: pct >= 100 ? 'danger' : 'brand', title: pct >= 100 ? '이번 달 예산을 넘겼어요' : `이번 달 예산의 ${pct}%를 썼어요`, body: `현재 지출 ${formatWon(spent)} / 예산 ${formatWon(state.monthlyBudget)}`, actionTab: 'spending', settingKey: 'budgetAlert' });
        }, 700);
      }
    }

      const name = (document.getElementById('newRecipName')?.value || '').trim() || '최도윤';
      const newContact = { id: 'c_' + Date.now(), name, bank, account, bg: 'bg-purple-500/18 text-purple-400' };
      state.contacts.unshift(newContact);
      closeSheet();
      selectTransferRecipient(newContact.id);
    }

    function triggerTransferDigitRender() {
      state.motion.enterType = 'none';
      state.motion.digitPop = true;
      renderAppContent();
      state.motion.digitPop = false;
    }

    function appendTransferDigit(digitStr) {
      const currentStr = state.transfer.amount === 0 ? '' : String(state.transfer.amount);
      state.transfer.amount = parseInt((currentStr + digitStr).slice(0, 9) || '0', 10);
      triggerTransferDigitRender();
    }

    function backspaceTransferAmount() {
      state.transfer.amount = parseInt(String(state.transfer.amount || '').slice(0, -1) || '0', 10);
      triggerTransferDigitRender();
    }

    function addTransferPresetAmount(addVal) {
      state.transfer.amount = Math.min(99900000, (state.transfer.amount || 0) + addVal);
      triggerTransferDigitRender();
    }

    function fillMaxTransferAmount() {
      state.transfer.amount = state.balance;
      triggerTransferDigitRender();
      showToast(`보낼 수 있는 전액(${formatWon(state.balance)})을 입력했어요.`, 'brand');
    }

    function proceedTransferToConfirm() {
      if (state.transfer.amount <= 0 || state.transfer.amount > state.balance) return;
      state.transfer.step = 3;
      state.motion.enterType = 'forward';
      renderAll();
    }

    function backTransferStep(step) {
      state.transfer.step = step;
      state.motion.enterType = 'back';
      renderAll();
    }

    function updateTransferMemo(val) {
      state.transfer.memo = val;
    }

    function executeTransferComplete() {
      const recipient = state.transfer.recipient || state.contacts[0];
      const amount = state.transfer.amount;
      if (amount <= 0 || amount > state.balance) return;

      state.balance -= amount;
      state.transactions.unshift({
        id: Date.now(), title: `${recipient.name}님께 송금`, category: '이체', amount: -amount,
        time: '방금 전', iconKey: 'send', tone: 'bg-brand-soft text-brand', memo: state.transfer.memo || `${recipient.bank} 수수료 무료 송금`,
      });

      state.transfer.step = 4;
      state.motion.enterType = 'forward';
      renderAll();
      pushNotification({ category: '주식·송금', iconKey: 'send', tone: 'brand', title: `${recipient.name}님께 ${formatWon(amount)} 송금 완료`, body: `수수료 없이 보냈어요. 남은 잔액: ${formatWon(state.balance)}`, actionTab: 'home', settingKey: 'txAlert' });
    }

    function resetTransferFunnel(goHome = false) {
      state.transfer = { step: 1, recipient: null, amount: 0, memo: '' };
      if (goHome) switchTab('home');
      else { state.motion.enterType = 'screen'; renderAll(); }
    }

                <div class="flex items-center gap-3.5">

      if (step === 3) {

              <span class="absolute w-2 h-2 rounded-full bg-emerald-400 animate-confetti" style="--tx: 46px; --ty: -30px;"></span>

    /**
     * ============================================================================
     * 11. 화면 7: 혜택 (`benefits`) — 미션 진행률 바 · 골드 시머 복권 · 레이더 · 1원 현금 출금
     * ============================================================================
     */
    function addMoaPoints(amount, reasonTitle) {
      const prev = state.points;
      state.points += amount;
      state.pointHistory.unshift({ id: 'ph_' + Date.now(), title: reasonTitle, amount, time: '방금 전' });
      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('benefitsPointCapsuleVal', prev, state.points, (n) => `${n.toLocaleString('ko-KR')}원`, 420);
      spawnFloatingReward(`+${formatWon(amount)} 적립`, 'brand');
    }

    function toggleBenefitBannerMute(e) {
      if (e) e.stopPropagation();
      state.benefits.bannerMuted = !state.benefits.bannerMuted;
      state.motion.enterType = 'none';
      renderAppContent();
      showToast(state.benefits.bannerMuted ? '배너 사운드를 음소거했어요.' : '배너 사운드를 켰어요.', 'brand');
    }

    function openBenefitPromoSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      openSheet(`
        <div class="space-y-4">
          <div class="p-5 rounded-3xl bg-gradient-to-br from-[#1B64DA] via-[#3182F6] to-indigo-600 text-white space-y-2">
            <span class="px-2.5 py-0.5 rounded-full bg-white/20 text-[10px] font-extrabold">MOA LUCKY WEEK</span>
            <h3 class="text-[18px] font-extrabold leading-snug">매일 미션 참여하고<br />포인트 1원부터 현금 출금해요</h3>
            <p class="text-xs text-white/85 leading-relaxed">적립한 모아 포인트는 최소 한도 없이 모아 입출금 통장으로 즉시 현금 전환하거나 쇼핑 결제 시 바로 차감할 수 있어요.</p>

        </div>
      `);
    }

    function openPointsCashoutSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');

              <span class="font-extrabold ${item.amount >= 0 ? 'text-brand' : textPrimary} [font-variant-numeric:tabular-nums]">${item.amount >= 0 ? '+' : ''}${formatWon(item.amount)}</span>
            </div>
          `
        )
        .join('');

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded-full bg-brand-soft text-brand text-[10px] font-bold mb-1">1P = 1원 즉시 출금</span>
              <h3 class="text-[18px] font-extrabold ${textPrimary}">내 모아 포인트</h3>
            </div>
            <p class="text-[24px] font-black text-brand [font-variant-numeric:tabular-nums]">${formatWon(state.points)}</p>
          </div>
          <div class="p-3.5 rounded-2xl ${subSurface()} text-xs space-y-0.5">

            <p class="text-ink-muted">최소 출금 조건 없이 보유 전액을 1원 단위까지 전환할 수 있어요.</p>
          </div>
          <div class="max-h-44 overflow-y-auto no-scrollbar divide-y ${t('divide-slate-100', 'divide-white/[0.06]')} px-1">${historyHtml}</div>
          <button type="button" onclick="executePointsCashout()" ${state.points <= 0 ? 'disabled' : ''} class="w-full py-3.5 rounded-2xl text-sm font-extrabold transition-all cursor-pointer ${state.points > 0 ? 'bg-brand hover:bg-brand-hover text-white tap-btn' : `${subSurface()} text-ink-muted cursor-not-allowed`}">
            ${state.points > 0 ? `${formatWon(state.points)} 모아 통장으로 출금하기` : '출금 가능한 포인트가 없어요'}
          </button>
        </div>
      `);
    }

    function executePointsCashout() {
      if (state.points <= 0) return;
      const cashAmount = state.points;
      state.points = 0;
      state.balance += cashAmount;

      state.pointHistory.unshift({ id: 'ph_' + Date.now(), title: '모아 입출금 통장으로 출금', amount: -cashAmount, time: '방금 전' });
      state.transactions.unshift({ id: Date.now(), title: '모아 포인트 현금 출금', category: '이체', amount: cashAmount, time: '방금 전', iconKey: 'coin', tone: 'bg-success-soft text-success', memo: '포인트 1:1 통장 입금' });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      spawnFloatingReward(`+${formatWon(cashAmount)} 통장 입금!`, 'success');
      pushNotification({ category: '주식·송금', iconKey: 'coin', tone: 'success', title: `포인트 ${formatWon(cashAmount)} 통장 입금 완료`, body: `수수료 없이 입금되었어요. 잔액: ${formatWon(state.balance)}`, actionTab: 'home', settingKey: 'txAlert' });
      showToast(`포인트 ${formatWon(cashAmount)}을 모아 통장으로 출금했어요.`);
    }

    function handleMissionClick(missionId) {
      const m = state.benefits.missions.find((item) => item.id === missionId);
      if (!m) return;
      if (m.done) { showToast('오늘 이미 포인트를 받은 미션이에요.', 'brand'); return; }
      if (m.type === 'lottery') openLotteryMissionSheet(m.id);
      else if (m.type === 'tap') { m.done = true; addMoaPoints(m.reward || 20, '버튼 누르기 미션'); showToast('버튼 누르기 완료! +20원이 적립되었어요.'); }
      else if (m.type === 'pedometer') openPedometerMissionSheet(m.id);
      else if (m.type === 'together') openTogetherMissionSheet(m.id);
    }

    function openLotteryMissionSheet(missionId) {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      openSheet(`
        <div class="space-y-4 text-center">
          <div>
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/18 text-amber-400 text-[10.5px] font-extrabold mb-1.5">꽝 없는 100% 당첨</span>

            <p class="text-xs text-ink-muted mt-0.5">누르는 즉시 랜덤 모아 포인트가 적립돼요.</p>
          </div>
          <div class="grid grid-cols-3 gap-2.5 py-2">
            ${[1, 2, 3]
              .map(
                (idx) => `
                  <button type="button" onclick="claimLotteryReward('${missionId}')" class="relative overflow-hidden p-4 rounded-2xl ${subSurface()} border border-amber-400/35 flex flex-col items-center gap-2.5 tap-card cursor-pointer group">
                    <div class="pointer-events-none absolute inset-y-0 w-10 bg-gradient-to-r from-transparent via-amber-300/15 to-transparent animate-shimmer"></div>
                    <div class="w-11 h-11 rounded-2xl bg-amber-500/18 text-amber-400 flex items-center justify-center group-hover:scale-110 transition-transform">${ICONS.ticket}</div>
                    <span class="text-xs font-extrabold text-amber-400">복권 #${idx}</span>
                    <span class="text-[10px] text-ink-muted">눌러서 열기</span>
                  </button>
                `
              )
              .join('')}
          </div>
        </div>
      `);
    }

    function claimLotteryReward(missionId) {
      const m = state.benefits.missions.find((item) => item.id === missionId);
      if (!m || m.done) return;
      const candidates = [50, 80, 100, 120, 150];
      const won = candidates[Math.floor(Math.random() * candidates.length)];
      m.done = true;
      m.subtitle = `오늘 행운복권 +${won}원 당첨 완료`;
      closeSheet();
      addMoaPoints(won, '오늘의 행운복권 당첨');
      showToast(`행운복권에서 ${formatWon(won)}에 당첨되었어요!`);
    }

    function openPedometerMissionSheet(missionId) {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const steps = state.benefits.steps;
      const goal = state.benefits.stepGoal;
      const pct = Math.min(100, Math.round((steps / goal) * 100));
      const reached = steps >= goal;

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded-full bg-emerald-500/18 text-emerald-400 text-[10.5px] font-bold mb-1">모아 만보기</span>
              <h3 class="text-[18px] font-extrabold ${textPrimary}">오늘 ${steps.toLocaleString('ko-KR')}걸음 걸었어요</h3>
            </div>
            <div class="w-11 h-11 rounded-2xl bg-emerald-500/18 text-emerald-400 flex items-center justify-center">${ICONS.steps}</div>
          </div>
          <div class="p-4 rounded-2xl ${subSurface()} space-y-2">
            <div class="flex items-center justify-between text-xs"><span class="text-ink-muted">목표 ${goal.toLocaleString('ko-KR')}걸음</span><strong class="text-emerald-400 [font-variant-numeric:tabular-nums]">${pct}% 달성</strong></div>
            <div class="w-full h-2.5 rounded-full ${t('bg-slate-200', 'bg-white/[0.08]')} overflow-hidden"><div class="h-full rounded-full bg-emerald-500 transition-all duration-350 ease-toss" style="width: ${pct}%"></div></div>

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="simulateWalkSteps('${missionId}')" class="py-3.5 rounded-2xl ${subSurface()} ${textPrimary} text-xs font-extrabold tap-btn cursor-pointer">+1,000보 걷기</button>
            <button type="button" onclick="claimPedometerReward('${missionId}')" ${!reached ? 'disabled' : ''} class="py-3.5 rounded-2xl text-xs font-extrabold transition-all cursor-pointer ${reached ? 'bg-emerald-500 text-white tap-btn' : `${subSurface()} text-ink-muted cursor-not-allowed`}">
              ${reached ? '50원 받기' : `${(goal - steps).toLocaleString('ko-KR')}보 남음`}
            </button>
          </div>
        </div>
      `);
    }

    function simulateWalkSteps(missionId) {
      state.benefits.steps = Math.min(15000, state.benefits.steps + 1000);
      const m = state.benefits.missions.find((item) => item.id === missionId);
      if (m) {
        const remain = Math.max(0, state.benefits.stepGoal - state.benefits.steps);
        m.subtitle = remain === 0 ? '10,000걸음 목표 달성! 포인트를 받아가세요' : `오늘 ${state.benefits.steps.toLocaleString('ko-KR')}걸음 · ${remain.toLocaleString('ko-KR')}걸음 남았어요`;
      }
      openPedometerMissionSheet(missionId);
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function claimPedometerReward(missionId) {
      const m = state.benefits.missions.find((item) => item.id === missionId);
      if (!m || m.done || state.benefits.steps < state.benefits.stepGoal) return;
      m.done = true;
      m.subtitle = '오늘 10,000걸음 보상 수령 완료';
      closeSheet();
      addMoaPoints(50, '만보기 10,000걸음 달성 보상');
      showToast('만보기 10,000걸음 달성! +50원이 적립되었어요.');
    }

      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');

            <button type="button" onclick="claimTogetherReward('${missionId}')" class="absolute z-20 bottom-3 left-0 px-2.5 py-1 rounded-full bg-emerald-500 text-white text-[10.5px] font-extrabold shadow-lg animate-float-slow tap-btn cursor-pointer" style="animation-delay: 0.9s;">서준님</button>
          </div>
          <button type="button" onclick="claimTogetherReward('${missionId}')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">보너스 +100원 바로 받기</button>
        </div>
      `);

    function claimTogetherReward(missionId) {
      const m = state.benefits.missions.find((item) => item.id === missionId);
      if (!m || m.done) return;
      m.done = true;
      closeSheet();
      addMoaPoints(100, '함께 모아 레이더 보너스');
      showToast('함께 모아 보너스 +100원이 적립되었어요.');
    }

    function claimPartnerReward(partnerId) {
      const p = state.benefits.partners.find((item) => item.id === partnerId);
      if (!p) return;
      if (p.done) { showToast('이미 적립 완료한 파트너 혜택이에요.', 'brand'); return; }
      p.done = true;
      addMoaPoints(p.reward, p.title);
      showToast(`"${p.title}" 확인 완료! +${formatWon(p.reward)} 적립!`);
