<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>모아(Moa)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F2F4F6',
            'ink-primary': '#191F28',
            'ink-secondary': '#4E5968',
            'ink-muted': '#8B95A1',
            brand: '#3182F6',
            'brand-hover': '#1B64DA',
            'brand-soft': 'rgba(49, 130, 246, 0.14)',
            danger: '#F04452',
            'danger-soft': 'rgba(240, 68, 82, 0.14)',
            success: '#00C471',
            'success-soft': 'rgba(0, 196, 113, 0.14)',
            warning: '#FF9F0A',
          },
          boxShadow: {
            card: '0 2px 12px rgba(0, 0, 0, 0.04)',
            capsule: '0 12px 32px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.28)',
            'capsule-light': '0 10px 28px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06)',
          },
          transitionTimingFunction: {
            toss: 'cubic-bezier(0.22, 1, 0.36, 1)',
            spring: 'cubic-bezier(0.32, 1.38, 0.52, 1)',
            sheet: 'cubic-bezier(0.18, 0.98, 0.32, 1)',
          },
          keyframes: {
            screenIn: {
              '0%': { opacity: '0', transform: 'translate3d(0, 10px, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translate3d(24px, 0, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translate3d(-24px, 0, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            cardIn: {
              '0%': { opacity: '0', transform: 'translate3d(0, 14px, 0) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.76)' },
              '65%': { opacity: '1', transform: 'scale(1.06)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            navBounce: {
              '0%': { transform: 'scale(0.84)' },
              '55%': { transform: 'scale(1.12)' },
              '100%': { transform: 'scale(1)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translate3d(0, 0px, 0)' },
              '50%': { transform: 'translate3d(0, -5px, 0)' },
            },
            drawLine: {
              '0%': { strokeDashoffset: '520' },
              '100%': { strokeDashoffset: '0' },
            },
            drawCheck: {
              '0%': { strokeDashoffset: '80' },
              '100%': { strokeDashoffset: '0' },
            },
            flashUp: {
              '0%': { backgroundColor: 'rgba(240, 68, 82, 0.18)' },
              '100%': { backgroundColor: 'transparent' },
            },
            flashDown: {
              '0%': { backgroundColor: 'rgba(49, 130, 246, 0.18)' },
              '100%': { backgroundColor: 'transparent' },
            },
            confettiBurst: {
              '0%': { opacity: '1', transform: 'translate(0, 0) scale(1)' },
              '100%': { opacity: '0', transform: 'translate(var(--tx), var(--ty)) scale(0.3) rotate(160deg)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '18%': { transform: 'translateX(-6px)' },
              '36%': { transform: 'translateX(6px)' },
              '54%': { transform: 'translateX(-4px)' },
              '72%': { transform: 'translateX(4px)' },
            },
            sonarRing: {
              '0%': { transform: 'scale(0.45)', opacity: '0.85' },
              '100%': { transform: 'scale(1.45)', opacity: '0' },
            },
            shimmerSweep: {
              '0%': { transform: 'translateX(-120%) skewX(-18deg)' },
              '100%': { transform: 'translateX(220%) skewX(-18deg)' },
            },
            carouselInNext: {
              '0%': { opacity: '0.45', transform: 'translate3d(18px, 0, 0) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
            carouselInPrev: {
              '0%': { opacity: '0.45', transform: 'translate3d(-18px, 0, 0) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
          },
          animation: {
            'screen-in': 'screenIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-right': 'slideInRight 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-left': 'slideInLeft 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
            'card-in': 'cardIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) both',
            'pop-in': 'popIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) both',
            'nav-bounce': 'navBounce 0.36s cubic-bezier(0.32, 1.38, 0.52, 1)',
            'float-slow': 'floatSlow 3.4s ease-in-out infinite',
            'draw-line': 'drawLine 0.78s cubic-bezier(0.22, 1, 0.36, 1) both',
            'draw-check': 'drawCheck 0.42s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both',
            'flash-up': 'flashUp 0.75s ease-out',
            'flash-down': 'flashDown 0.75s ease-out',
            'confetti': 'confettiBurst 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both',
            'shake': 'shake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both',
            'sonar': 'sonarRing 1.9s cubic-bezier(0.22, 1, 0.36, 1) infinite',
            'shimmer': 'shimmerSweep 2.8s ease-in-out infinite',
            'carousel-next': 'carouselInNext 0.34s cubic-bezier(0.22, 1, 0.36, 1) both',
            'carousel-prev': 'carouselInPrev 0.34s cubic-bezier(0.22, 1, 0.36, 1) both',
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #appContent {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    #appContent::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
    /* 실제 모바일 네이티브와 유사한 촉각 누름 모션 */
    .tap-card {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease, opacity 0.18s ease;
    }
    .tap-card:active {
      transform: scale(0.975);
    }
    .tap-btn {
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, opacity 0.15s ease;
    }
    .tap-btn:active {
      transform: scale(0.94);
    }
    .tap-row {
      transition: background-color 0.15s ease, transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tap-row:active {
      transform: scale(0.985);
    }
    /* 다크모드 서피스 미세 상단 하이라이트 */
    .dark-surface {
      background-color: #18181C;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }
    .dark-subsurface {
      background-color: #232329;
    }
    /* 배너 닫기 부드러운 접힘 애니메이션 */
    .banner-collapsing {
      opacity: 0 !important;
      transform: scale(0.94) translateY(-6px) !important;
      max-height: 0 !important;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      overflow: hidden !important;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
    /* 플로팅 캡슐 하단 페이드 마스크 */
    .bottom-fade-dark {
      background: linear-gradient(to top, #101012 22%, rgba(16, 16, 18, 0.85) 62%, rgba(16, 16, 18, 0) 100%);
    }
    .bottom-fade-light {
      background: linear-gradient(to top, #F2F4F6 22%, rgba(242, 244, 246, 0.85) 62%, rgba(242, 244, 246, 0) 100%);
    }
    /* 유리 캡슐 바 질감 */
    .glass-pill-dark {
      background: rgba(28, 28, 34, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
    }
    .glass-pill-light {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
    }
  </style>
</head>
<body id="pageBody" class="bg-[#09090B] text-[#F2F4F6] font-sans antialiased selection:bg-brand selection:text-white">
  <!-- 스마트폰 베젤·다이나믹 바·통신 상태표시를 완전히 제거한 순수 앱 뷰포트 -->
  <div
    id="appViewport"
    class="relative w-full max-w-[440px] mx-auto h-[100dvh] flex flex-col overflow-hidden bg-[#101012] sm:border-x sm:border-white/[0.06] transition-colors duration-300"
  >
    <!-- X-Ray 모드가 켜졌을 때만 상단에 부드럽게 표시되는 슬림 가이드 바 -->
    <div id="xrayMiniBar" class="hidden shrink-0 px-4 py-2 bg-amber-400/12 border-b border-amber-400/25 flex items-center justify-between gap-2 z-20 animate-screen-in">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
        <span class="text-[11px] font-bold text-amber-300 truncate">원칙 X-Ray 켜짐 · 화면 배지를 눌러 설계 해설 보기</span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="openXraySheet()" class="px-2.5 py-1 rounded-full bg-amber-400 text-[#101012] text-[10px] font-extrabold tap-btn cursor-pointer">해설 보기</button>
        <button type="button" onclick="toggleXrayMode()" class="px-2 py-1 rounded-full bg-white/10 text-slate-300 text-[10px] font-bold tap-btn cursor-pointer">끄기</button>
      </div>
    </div>

    <!-- 스크롤 가능한 메인 앱 컨텐츠 -->
    <main id="appContent" class="flex-1 overflow-y-auto overflow-x-hidden pb-28"></main>

    <!-- 플로팅 캡슐 하단 페이드 그라데이션 (스크롤 컨텐츠가 자연스럽게 사라지는 효과) -->
    <div id="bottomFadeMask" class="pointer-events-none absolute bottom-0 left-0 right-0 h-28 z-20 bottom-fade-dark transition-opacity duration-300"></div>

    <!-- 플로팅 캡슐(Glassmorphic Pill) 하단 내비게이션 바 + GPU 슬라이딩 활성 인디케이터 -->
    <nav
      id="floatingBottomNav"
      aria-label="하단 메인 내비게이션"
      class="absolute bottom-4 left-4 right-4 z-30 rounded-full p-1.5 glass-pill-dark shadow-capsule transition-all duration-300 ease-toss"
    >
      <div class="relative grid grid-cols-5 items-center">
        <!-- GPU 가속 슬라이딩 하이라이트 캡슐 -->
        <div
          id="navActivePill"
          class="pointer-events-none absolute top-0 bottom-0 left-0 w-1/5 rounded-full bg-white/[0.12] transition-all duration-300 ease-toss"
          style="transform: translate3d(0%, 0, 0);"
        ></div>

        <!-- 1. 홈 -->
        <button
          id="nav-home"
          type="button"
          onclick="switchTab('home')"
          class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer"
        >
          <span id="navIcon-home" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">홈</span>
        </button>

        <!-- 2. 혜택 -->
        <button
          id="nav-benefits"
          type="button"
          onclick="switchTab('benefits')"
          class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer"
        >
          <span id="navIcon-benefits" class="flex items-center justify-center relative"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">혜택</span>
        </button>

        <!-- 3. 쇼핑 -->
        <button
          id="nav-shopping"
          type="button"
          onclick="switchTab('shopping')"
          class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer"
        >
          <span id="navIcon-shopping" class="flex items-center justify-center relative"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">쇼핑</span>
        </button>

        <!-- 4. 증권 -->
        <button
          id="nav-invest"
          type="button"
          onclick="switchTab('invest')"
          class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer"
        >
          <span id="navIcon-invest" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">증권</span>
        </button>

        <!-- 5. 전체 -->
        <button
          id="nav-all"
          type="button"
          onclick="switchTab('all')"
          class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer"
        >
          <span id="navIcon-all" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">전체</span>
        </button>
      </div>
    </nav>

    <!-- 비침투형 스프링 토스트 -->
    <div
      id="appToast"
      role="status"
      aria-live="polite"
      class="pointer-events-none absolute left-5 right-5 bottom-24 z-40 flex justify-center opacity-0 translate-y-4 scale-95 transition-all duration-300 ease-spring"
    >
      <div id="appToastBox" class="bg-[#27272F]/95 border border-white/10 text-white text-[13px] font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 max-w-full backdrop-blur-xl">
        <span id="appToastIcon" class="w-2 h-2 rounded-full bg-success shrink-0"></span>
        <span id="appToastText" class="truncate">알림 메시지</span>
      </div>
    </div>

    <!-- 실시간 상단 푸시 알림 배너 (스프링 드롭다운) -->
    <button
      id="pushBanner"
      type="button"
      onclick="openNotifCenter()"
      aria-live="polite"
      class="absolute left-4 right-4 top-3.5 z-50 text-left rounded-[22px] p-3.5 shadow-2xl border opacity-0 -translate-y-7 pointer-events-none transition-all duration-350 ease-spring cursor-pointer bg-[#23232A]/95 border-white/12 backdrop-blur-xl"
    >
      <div class="flex items-start gap-3">
        <div id="pushBannerIcon" class="w-10 h-10 rounded-2xl bg-brand-soft text-brand flex items-center justify-center shrink-0"></div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <p id="pushBannerTitle" class="text-[13px] font-bold text-white truncate">모아 알림</p>
            <span class="text-[10px] font-semibold text-ink-muted shrink-0">방금 전</span>
          </div>
          <p id="pushBannerBody" class="text-[12px] text-slate-300 mt-0.5 line-clamp-2 leading-snug">알림 내용</p>
        </div>
      </div>
    </button>

    <!-- 슬라이드 인 알림함 오버레이 -->
    <div
      id="notifOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="알림함"
      class="absolute inset-0 z-50 translate-x-full transition-transform duration-320 ease-toss flex flex-col bg-[#101012] overflow-hidden"
    >
      <div id="notifOverlayContent" class="flex-1 flex flex-col h-full overflow-hidden"></div>
    </div>

    <!-- 바텀시트 오버레이 (부드러운 블러 + 스프링 리프트) -->
    <div
      id="bottomSheetOverlay"
      class="pointer-events-none absolute inset-0 z-50 flex flex-col justify-end bg-black/55 backdrop-blur-[2px] opacity-0 transition-opacity duration-250"
      onclick="handleOverlayBackdropClick(event)"
    >
      <div
        id="bottomSheetPanel"
        role="dialog"
        aria-modal="true"
        class="w-full rounded-t-[28px] bg-[#1C1C21] p-5 pb-8 shadow-2xl translate-y-full transition-transform duration-350 ease-sheet max-h-[86%] overflow-y-auto no-scrollbar"
      >
        <div class="w-9 h-1 rounded-full bg-white/20 mx-auto mb-5"></div>
        <div id="bottomSheetBody"></div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. 정교한 인라인 SVG 아이콘 시스템 (싱크로율 통일 · 이모지 난립 제거)
     * ============================================================================
     */
    const ICONS = {
      // 하단 내비게이션 (Active 채움 / Inactive 선형 구분)
      navHome: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M11.35 3.24a1.1 1.1 0 0 1 1.3 0l8 6.08c.22.17.35.43.35.71V19a2 2 0 0 1-2 2h-4.5a1 1 0 0 1-1-1v-4.25a1.5 1.5 0 0 0-3 0V20a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2v-8.97c0-.28.13-.54.35-.71l8-6.08Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3.5l9 7"/><path d="M5 9.5V19a1.5 1.5 0 0 0 1.5 1.5H10v-5a2 2 0 0 1 4 0v5h3.5A1.5 1.5 0 0 0 19 19V9.5"/></svg>`,
      navBenefits: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25 14.95 8.1l6.45.98-4.65 4.58 1.08 6.44L12 17.08 6.17 20.1l1.08-6.44L2.6 9.08l6.45-.98L12 2.25Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2.8 14.9 8.5 21.2 9.45 16.6 13.9 17.7 20.2 12 17.2 6.3 20.2 7.4 13.9 2.8 9.45 9.1 8.5 12 2.8"/></svg>`,
      navShopping: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V5a5 5 0 0 1 10 0v1h2.2a1.8 1.8 0 0 1 1.79 1.63l1 11A2.5 2.5 0 0 1 19.5 21.5h-15A2.5 2.5 0 0 1 2.01 18.63l1-11A1.8 1.8 0 0 1 4.8 6H7Zm2 0h6V5a3 3 0 0 0-6 0v1Zm1 4.5a1 1 0 1 0-2 0 4 4 0 0 0 8 0 1 1 0 1 0-2 0 2 2 0 0 1-4 0Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2A2 2 0 0 1 17.21 21H6.79a2 2 0 0 1-1.99-1.8L6 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>`,
      navInvest: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 9.2 11.8l4 4L20.5 8.5"/><path d="M15.5 8.5h5v5"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 9.2 11.8l4 4L20.5 8.5"/><path d="M15.5 8.5h5v5"/></svg>`,
      navAll: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4.5" y1="7" x2="19.5" y2="7"/><line x1="4.5" y1="12" x2="19.5" y2="12"/><line x1="4.5" y1="17" x2="19.5" y2="17"/></svg>`

    /**
     * ============================================================================
     * 4. 공통 유틸리티 · 바텀시트 · X-Ray 시트 · 모션 헬퍼
     * ============================================================================
     */
    function t(lightCls, darkCls) {
      return state.settings.darkMode ? darkCls : lightCls;
    }

    function cardSurface() {
      return state.settings.darkMode ? 'dark-surface' : 'bg-white shadow-card';
    }

    function subSurface() {
      return state.settings.darkMode ? 'dark-subsurface' : 'bg-canvas';
    }

    function formatWon(num) {
      const n = Math.round(Number(num) || 0);
      return `${n.toLocaleString('ko-KR')}원`;
    }

    function displayMoney(num, withSign = false) {
      if (state.privacyMode) return '••••••원';
      const n = Math.round(Number(num) || 0);
      if (withSign) {
        if (n > 0) return `+${n.toLocaleString('ko-KR')}원`;
        if (n < 0) return `-${Math.abs(n).toLocaleString('ko-KR')}원`;
      }
      return `${n.toLocaleString('ko-KR')}원`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getIcon(key, fallbackKey = 'spark') {
      return ICONS[key] || ICONS[fallbackKey] || '';
    }

    function getMonthlySpent() {
      return state.transactions
        .filter((tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체')
        .reduce((sum, tx) => sum + Math.abs(tx.amount), 0);
    }

    function formatCountdown(totalSec) {
      const s = Math.max(0, totalSec);
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg || '복사했어요.', 'brand');
      } catch (err) {
        showToast('복사에 실패했어요.', 'danger');
      }
    }

    function copyAccountNumber(account) {
      copyText(account, `계좌번호(${account})를 복사했어요.`);
    }

    let toastTimer = null;
    function showToast(message, tone = 'success') {
      const toast = document.getElementById('appToast');
      const box = document.getElementById('appToastBox');
      const textEl = document.getElementById('appToastText');
      const iconEl = document.getElementById('appToastIcon');
      if (!toast || !textEl || !iconEl || !box) return;

      box.className =
        'text-[13px] font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 max-w-full backdrop-blur-xl border ' +
        t('bg-[#191F28]/92 border-black/10 text-white', 'bg-[#282830]/95 border-white/10 text-white');

      textEl.textContent = message;
      const dotColor = tone === 'danger' ? 'bg-danger' : tone === 'brand' ? 'bg-brand' : 'bg-success';
      iconEl.className = `w-2 h-2 rounded-full ${dotColor} shrink-0`;

      toast.classList.remove('opacity-0', 'translate-y-4', 'scale-95');
      toast.classList.add('opacity-100', 'translate-y-0', 'scale-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'scale-95');
        toast.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
      }, 2400);
    }

    function openSheet(htmlContent) {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      const body = document.getElementById('bottomSheetBody');
      if (!overlay || !panel || !body) return;

      panel.className =
        'w-full rounded-t-[28px] p-5 pb-8 shadow-2xl translate-y-full transition-transform duration-350 ease-sheet max-h-[86%] overflow-y-auto no-scrollbar ' +
        t('bg-white text-ink-primary', 'bg-[#1C1C21] text-[#F2F4F6] border-t border-white/[0.08]');

      body.innerHTML = htmlContent;
      overlay.classList.remove('pointer-events-none', 'opacity-0');
      overlay.classList.add('pointer-events-auto', 'opacity-100');

      requestAnimationFrame(() => {
        panel.classList.remove('translate-y-full');
        panel.classList.add('translate-y-0');
      });
    }

    function closeSheet() {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      if (!overlay || !panel) return;

      panel.classList.add('translate-y-full');
      panel.classList.remove('translate-y-0');
      overlay.classList.add('pointer-events-none', 'opacity-0');
      overlay.classList.remove('pointer-events-auto', 'opacity-100');
    }

    function handleOverlayBackdropClick(e) {
      if (e.target && e.target.id === 'bottomSheetOverlay') {
        closeSheet();
      }
    }

    function screenMotionCls() {
      if (state.motion.enterType === 'forward') return 'animate-slide-right';
      if (state.motion.enterType === 'back') return 'animate-slide-left';
      if (state.motion.enterType === 'screen') return 'animate-screen-in';
      return '';
    }

    function cardMotionCls() {
      return state.motion.enterType === 'screen' ? 'animate-card-in' : '';
    }

    function cardMotionAttr(index) {
      if (state.motion.enterType !== 'screen') return '';
      return `style="animation-delay: ${index * 36}ms"`;
    }

    function animateNumberEl(elId, fromVal, toVal, formatter, duration = 420) {
      const el = document.getElementById(elId);
      if (!el || state.privacyMode) return;
      const start = performance.now();
      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(fromVal + (toVal - fromVal) * eased);
        const targetEl = document.getElementById(elId);
        if (!targetEl) return;
        targetEl.textContent = formatter(current);
        if (progress < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function xrayPin(principleId, label) {
      if (!state.xrayMode) return '';
      return `
        <button
          type="button"
          onclick="event.stopPropagation(); openXraySheet('${principleId}')"
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-400/18 border border-amber-400/45 text-amber-300 text-[10px] font-bold tap-btn cursor-pointer shrink-0"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          <span>${escapeHtml(label)}</span>
        </button>
      `;
    }

    function toggleXrayMode() {
      state.xrayMode = !state.xrayMode;
      state.motion.enterType = 'none';
      renderAll();
      showToast(state.xrayMode ? '원칙 X-Ray 배지를 켰어요.' : '원칙 X-Ray 배지를 껐어요.', 'brand');
    }

    function openXraySheet(highlightId = null) {
      const info = XRAY_PRINCIPLES[state.activeTab] || XRAY_PRINCIPLES.home;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const cardsHtml = info.cards
        .map((c) => {
          const active = highlightId && highlightId === c.id;
          return `
            <div class="p-4 rounded-2xl ${subSurface()} border ${active ? 'border-amber-400 ring-1 ring-amber-400/40' : t('border-slate-200/80', 'border-white/[0.06]')} space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2 py-0.5 rounded-full bg-brand-soft text-brand text-[10px] font-bold">${escapeHtml(c.tag)}</span>
              </div>
              <p class="text-[13px] font-extrabold ${textPrimary}">${escapeHtml(c.heading)}</p>
              <div class="grid grid-cols-2 gap-2 text-[11px]">
                <div class="p-2.5 rounded-xl bg-danger-soft/60">
                  <span class="text-[10px] font-extrabold text-danger block mb-0.5">Before</span>
                  <p class="${t('text-ink-secondary', 'text-slate-300')} leading-snug">${escapeHtml(c.before)}</p>
                </div>
                <div class="p-2.5 rounded-xl bg-success-soft/60">
                  <span class="text-[10px] font-extrabold text-success block mb-0.5">After</span>
                  <p class="${textPrimary} font-medium leading-snug">${escapeHtml(c.after)}</p>
                </div>
              </div>
            </div>
          `;
        })
        .join('');

      openSheet(`
        <div class="space-y-4">
          <div>
            <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-400/15 text-amber-400 text-[10px] font-extrabold mb-1.5">원칙 X-Ray 설계 해설</span>
            <h3 class="text-base font-extrabold ${textPrimary} leading-snug">${escapeHtml(info.title)}</h3>
            <p class="text-xs text-ink-muted mt-1 leading-relaxed">${escapeHtml(info.summary)}</p>
          </div>
          <div class="space-y-2.5">${cardsHtml}</div>
          <button type="button" onclick="closeSheet()" class="w-full py-3.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">닫기</button>
        </div>
      `);
    }

    function renderSubScreenTopHeader(title, rightHtml = '') {
      const targetTab = state.previousMainTab || 'home';
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      return `
        <header class="pt-3 pb-2 flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0">
            <button
              type="button"
              onclick="switchTab('${targetTab}', 'back')"
              aria-label="뒤로가기"
              class="w-9 h-9 -ml-2 rounded-full flex items-center justify-center ${textPrimary} ${t('hover:bg-black/5', 'hover:bg-white/5')} tap-btn cursor-pointer shrink-0"
            >
              ${ICONS.chevronLeft}
            </button>
            <h1 class="text-[19px] font-extrabold tracking-[-0.025em] ${textPrimary} truncate">${escapeHtml(title)}</h1>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">${rightHtml}</div>
        </header>
      `;
    }

    /**
     * ============================================================================
     * 5. 실시간 알림함 & 상단 푸시 배너 시스템
     * ============================================================================
     */
    let pushBannerTimer = null;

    function getUnreadNotifCount() {
      return state.notifications.filter((n) => !n.read).length;
    }

    function pushNotification({ category, iconKey = 'bell', tone = 'brand', title, body, actionTab = 'home', settingKey = null }) {
      const newNotif = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        category,
        iconKey,
        tone,
        title,
        body,
        time: '방금 전',
        read: false,
        actionTab,
      };
      state.notifications.unshift(newNotif);
      updateNotifBadges();

      const shouldShowBanner = !settingKey || state.settings[settingKey];
      if (shouldShowBanner && !state.notifOpen) {
        showPushBanner(newNotif);
      }
      if (state.notifOpen) {
        renderNotifCenter();
      }
    }

    function showPushBanner(notif) {
      const banner = document.getElementById('pushBanner');
      const iconEl = document.getElementById('pushBannerIcon');
      const titleEl = document.getElementById('pushBannerTitle');
      const bodyEl = document.getElementById('pushBannerBody');
      if (!banner || !iconEl || !titleEl || !bodyEl) return;

      const toneCls =
        notif.tone === 'danger'
          ? 'bg-danger-soft text-danger'
          : notif.tone === 'success'
            ? 'bg-success-soft text-success'
            : 'bg-brand-soft text-brand';

      banner.className =
        'absolute left-4 right-4 top-3.5 z-50 text-left rounded-[22px] p-3.5 shadow-2xl border transition-all duration-350 ease-spring cursor-pointer backdrop-blur-xl ' +
        t('bg-white/95 border-slate-200/90', 'bg-[#23232A]/95 border-white/12');

      iconEl.className = `w-10 h-10 rounded-2xl ${toneCls} flex items-center justify-center shrink-0`;
      iconEl.innerHTML = getIcon(notif.iconKey, 'bell');
      titleEl.className = `text-[13px] font-bold truncate ${t('text-ink-primary', 'text-[#F2F4F6]')}`;
      titleEl.textContent = notif.title;
      bodyEl.className = `text-[12px] mt-0.5 line-clamp-2 leading-snug ${t('text-ink-secondary', 'text-[#B0B8C1]')}`;
      bodyEl.textContent = notif.body;

      requestAnimationFrame(() => {
        banner.classList.remove('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
      });

      clearTimeout(pushBannerTimer);
      pushBannerTimer = setTimeout(() => {
        banner.classList.add('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }, 3300);
    }

    function updateNotifBadges() {
      const unread = getUnreadNotifCount();
      document.querySelectorAll('[data-notif-badge]').forEach((el) => {
        if (unread > 0) {
          el.textContent = unread > 9 ? '9+' : String(unread);
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    function openNotifCenter() {
      state.notifOpen = true;
      const overlay = document.getElementById('notifOverlay');
      const banner = document.getElementById('pushBanner');
      if (banner) {
        banner.classList.add('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }
      renderNotifCenter();
      if (overlay) {
        overlay.className =
          'absolute inset-0 z-50 translate-x-full transition-transform duration-320 ease-toss flex flex-col overflow-hidden ' +
          t('bg-canvas', 'bg-[#101012]');
        requestAnimationFrame(() => {

    function addQuickGoalSavings(goalId, amount = 10000) {
      const goal = state.goals.find((g) => g.id === goalId);
      if (!goal) return;
      if (state.balance < amount) {
        showToast('모아 통장 잔액이 부족해요.', 'danger');
        return;
      }
      if (goal.saved >= goal.target) {
        showToast('이미 목표 금액을 100% 달성했어요.', 'brand');
        return;
      }

      const prevBalance = state.balance;
      const actualAdd = Math.min(amount, goal.target - goal.saved);
      state.balance -= actualAdd;
      goal.saved += actualAdd;

      state.transactions.unshift({
        id: Date.now(),
        title: `모으기 (${goal.title})`,
        category: '저축',
        amount: -actualAdd,
        time: '방금 전',
        iconKey: goal.iconKey,
        tone: goal.tone,
        memo: '원탭 저축',
      });

      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('homeBalanceValue', prevBalance, state.balance, formatWon, 420);

      const reached = goal.saved >= goal.target;
      if (reached) {
        pushNotification({
          category: '보안·예산',
          iconKey: 'spark',
          tone: 'success',
          title: `"${goal.title}" 목표를 달성했어요`,
          body: `목표 금액 ${formatWon(goal.target)}을 모두 모았어요.`,
          actionTab: 'home',
          settingKey: 'txAlert',
        });
      }
      showToast(reached ? `"${goal.title}" 목표를 100% 달성했어요!` : `${goal.title}에 ${formatWon(actualAdd)}을 모았어요.`);
    }

    function saveNewExpense() {
      const title = (document.getElementById('newExpTitle')?.value || '').trim() || '모아 베이커리';
      const category = document.getElementById('newExpCat')?.value || '식비';
      const amount = Math.max(500, parseInt(document.getElementById('newExpAmount')?.value || '15000', 10));
      const iconMap = { 식비: 'leaf', 카페: 'coffee', 쇼핑: 'bag', 교통: 'train', 생활: 'wallet' };
      const toneMap = { 식비: 'bg-emerald-500/15 text-emerald-400', 카페: 'bg-amber-500/15 text-amber-400', 쇼핑: 'bg-purple-500/15 text-purple-400', 교통: 'bg-sky-500/15 text-sky-400', 생활: 'bg-rose-500/15 text-rose-400' };

      state.balance = Math.max(0, state.balance - amount);
      state.transactions.unshift({
        id: Date.now(),
        title,
        category,
        amount: -amount,
        time: '방금 전',
        iconKey: iconMap[category] || 'wallet',
        tone: toneMap[category] || 'bg-brand-soft text-brand',
        memo: '직접 기록한 지출',
      });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      showToast(`${title} ${formatWon(amount)} 지출을 기록했어요.`);
      checkBudgetAlertThreshold();
    }

    function renderSpendingScreen() {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#9EA6B2]');
      const cAnim = cardMotionCls();

      const expenseTxs = state.transactions.filter(
        (tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체'
      );
      const totalSpent = getMonthlySpent();
      const remainBudget = Math.max(0, state.monthlyBudget - totalSpent);
      const dailyGuide = Math.round(remainBudget / 8);

      const catSums = {};
      expenseTxs.forEach((tx) => {
        catSums[tx.category] = (catSums[tx.category] || 0) + Math.abs(tx.amount);
      });
      const sortedCats = Object.entries(catSums).sort((a, b) => b[1] - a[1]);
      const topCat = sortedCats[0] || null;
      const catColors = { 생활: 'bg-brand', 식비: 'bg-emerald-500', 쇼핑: 'bg-purple-500', 교통: 'bg-amber-500', 구독: 'bg-rose-500', 카페: 'bg-sky-400' };

      const stackedBarHtml = sortedCats
        .map(([cat, amt]) => {
          const pct = totalSpent > 0 ? Math.max(6, Math.round((amt / totalSpent) * 100)) : 0;
          return `<div class="h-full ${catColors[cat] || 'bg-slate-400'} transition-all duration-500 ease-toss" style="width: ${pct}%"></div>`;
        })
        .join('');

      const legendHtml = sortedCats
        .map(([cat, amt]) => {
          const pct = totalSpent > 0 ? Math.round((amt / totalSpent) * 100) : 0;
          return `
            <div class="flex items-center justify-between py-1.5 text-[13px]">
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full ${catColors[cat] || 'bg-slate-400'}"></span>
                <span class="font-bold ${textPrimary}">${escapeHtml(cat)}</span>
                <span class="text-xs text-ink-muted">${pct}%</span>
              </div>
              <span class="font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">${displayMoney(amt)}</span>
            </div>
          `;
        })
        .join('');

      const categories = ['전체', '식비', '카페', '생활', '교통', '쇼핑', '구독'];
      const q = state.spendingFilter.query.trim().toLowerCase();
      const filteredTxs = state.transactions.filter((tx) => {
        const matchCat = state.spendingFilter.category === '전체' || tx.category === state.spendingFilter.category;
        const matchQuery = !q || tx.title.toLowerCase().includes(q) || tx.category.toLowerCase().includes(q) || (tx.memo && tx.memo.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      const txListHtml =
        filteredTxs.length > 0
          ? filteredTxs
              .map(
                (tx) => `
                  <button
                    type="button"
                    onclick="openTxReceiptSheet(${tx.id})"
                    class="w-full py-3.5 px-2 -mx-2 rounded-2xl flex items-center justify-between gap-3 text-left ${t('hover:bg-slate-50', 'hover:bg-white/[0.03]')} tap-row cursor-pointer"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 rounded-full ${tx.tone || 'bg-brand-soft text-brand'} flex items-center justify-center shrink-0">${getIcon(tx.iconKey, 'wallet')}</div>
                      <div class="min-w-0">
                        <p class="text-[13.5px] font-bold ${textPrimary} truncate">${escapeHtml(tx.title)}</p>
                        <p class="text-[11px] text-ink-muted truncate">${escapeHtml(tx.category)} · ${escapeHtml(tx.time)}${tx.memo ? ` · ${escapeHtml(tx.memo)}` : ''}</p>
                      </div>
                    </div>
                    <span class="text-[13.5px] font-bold ${tx.amount > 0 ? 'text-brand' : textPrimary} [font-variant-numeric:tabular-nums] shrink-0">
                      ${displayMoney(tx.amount, true)}
                    </span>
                  </button>
                `
              )
              .join('')
          : `
            <div class="py-12 text-center space-y-3">
              <div class="w-11 h-11 rounded-2xl ${subSurface()} mx-auto flex items-center justify-center text-ink-muted">${ICONS.search}</div>
              <div>
                <p class="text-sm font-bold ${textPrimary}">찾으시는 내역이 없어요</p>
                <p class="text-xs text-ink-muted mt-0.5">검색어나 카테고리 필터를 초기화해 볼까요?</p>
              </div>
              <button type="button" onclick="resetSpendingFilter()" class="px-4 py-2 rounded-xl bg-brand-soft text-brand text-xs font-extrabold tap-btn cursor-pointer">
                필터 초기화하고 전체 보기
              </button>
            </div>
          `;

      return `
        <div class="px-4 pt-1 pb-6 space-y-3.5 ${screenMotionCls()}">
          ${renderSubScreenTopHeader(
            '소비 · 분석',
            `<button type="button" onclick="openAddExpenseSheet()" class="px-3 py-1.5 rounded-xl bg-brand-soft text-brand text-xs font-extrabold tap-btn cursor-pointer">+ 기록</button>`
          )}

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5" ${cardMotionAttr(0)}>
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-ink-muted">11월 총 지출</span>
              <div class="flex items-center gap-1.5">
                ${xrayPin('spending-budget', '예산 가이드')}
                <button type="button" onclick="openBudgetSheet()" class="px-2.5 py-1 rounded-xl ${subSurface()} ${textSecondary} text-[11px] font-bold tap-btn cursor-pointer">예산 수정</button>
              </div>
            </div>

            <p class="${large ? 'text-[28px]' : 'text-[25px]'} font-extrabold tracking-[-0.03em] ${textPrimary} mt-1 [font-variant-numeric:tabular-nums]">
              ${displayMoney(totalSpent)}
            </p>
            <p class="text-[12.5px] ${textSecondary} mt-1.5 leading-relaxed">
              ${
                topCat
                  ? `이번 달엔 <strong class="font-bold ${textPrimary}">${escapeHtml(topCat[0])}</strong>에 가장 많이 썼어요. 남은 8일간 하루 <strong class="font-bold text-brand [font-variant-numeric:tabular-nums]">${formatWon(dailyGuide)}</strong>씩 쓰면 예산에 딱 맞아요.`
                  : '아직 이번 달 지출 내역이 없어요.'
              }
            </p>

            <div class="w-full h-3 rounded-full overflow-hidden flex gap-0.5 mt-4 ${subSurface()}">${stackedBarHtml}</div>
            <div class="mt-4 space-y-0.5">${legendHtml || '<p class="text-xs text-ink-muted py-2">기록된 지출이 없어요.</p>'}</div>
          </section>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3.5" ${cardMotionAttr(1)}>
            <div class="flex items-center justify-between">
              <h2 class="text-[15px] font-extrabold ${textPrimary}">내역 찾아보기</h2>
              ${xrayPin('spending-empty', '빈 화면 UX')}
            </div>

            <div class="relative">
              <input
                id="spendingSearchInput"
                type="text"
                value="${escapeHtml(state.spendingFilter.query)}"
                oninput="setSpendingQuery(this.value)"
                placeholder="가맹점, 카테고리, 메모 검색"
                class="w-full pl-9 pr-8 py-2.5 rounded-2xl text-[13px] font-medium focus:outline-none focus:ring-2 focus:ring-brand/45 ${t('bg-canvas text-ink-primary', 'bg-[#24242A] text-white placeholder:text-ink-muted')}"
              />
              <span class="text-ink-muted absolute left-3 top-2.5">${ICONS.search}</span>
              ${state.spendingFilter.query ? `<button type="button" onclick="setSpendingQuery('')" class="absolute right-3 top-2.5 text-xs text-ink-muted cursor-pointer">✕</button>` : ''}
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${categories
                .map((cat) => {
                  const active = state.spendingFilter.category === cat;
                  return `
                    <button
                      type="button"
                      onclick="setSpendingCategory('${cat}')"
                      class="px-3.5 py-1.5 rounded-full text-[11.5px] font-bold shrink-0 tap-btn cursor-pointer ${
                        active ? 'bg-brand text-white' : `${subSurface()} ${textSecondary}`
                      }"
                    >
                      ${cat}
                    </button>
                  `;
                })
                .join('')}
            </div>

            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">${txListHtml}</div>
          </section>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 8. 화면 3: 증권 (`invest`) — 지수 티커 · 실시간 플래시 · SVG 크로스헤어 스크러빙 차트
     * ============================================================================
     */
    function getInvestSummary() {
      let totalValue = 0;
      let totalCost = 0;
      state.invest.stocks.forEach((s) => {
        if (s.shares > 0) {
          totalValue += s.price * s.shares;
          totalCost += s.avgPrice * s.shares;
        }
      });
      const profit = totalValue - totalCost;
      const profitRate = totalCost > 0 ? (profit / totalCost) * 100 : 0;
      return { totalValue, totalCost, profit, profitRate };
    }

    function setInvestSegment(seg) {
      state.invest.segment = seg;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function selectStockDetail(stockId) {
      state.invest.selectedStockId = stockId;
      state.motion.enterType = 'forward';
      renderAll();
    }

    function closeStockDetail() {
      state.invest.selectedStockId = null;
      state.motion.enterType = 'back';
      renderAll();
    }

    function setStockTimeframe(tf) {
      state.invest.timeframe = tf;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function toggleStockWatch(stockId, e) {
      if (e) e.stopPropagation();
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      stock.watched = !stock.watched;
      state.motion.enterType = 'none';
      renderAppContent();
      showToast(stock.watched ? `${stock.name}을 관심 종목에 담았어요.` : `${stock.name}을 관심 종목에서 뺐어요.`, 'brand');
    }

    function handleChartScrub(event, stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const svg = event.currentTarget;
      const rect = svg.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const idx = Math.min(stock.history.length - 1, Math.round(ratio * (stock.history.length - 1)));
      const priceVal = stock.history[idx];

      const min = Math.min(...stock.history);
      const max = Math.max(...stock.history);
      const range = Math.max(1, max - min);
      const x = (idx / (stock.history.length - 1)) * 300 + 10;
      const y = 128 - ((priceVal - min) / range) * 100;

      const line = document.getElementById('scrubCrosshairLine');
      const dot = document.getElementById('scrubCrosshairDot');
      const halo = document.getElementById('scrubCrosshairHalo');
      if (line) { line.setAttribute('x1', x); line.setAttribute('x2', x); line.style.opacity = '1'; }
      if (dot) { dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.style.opacity = '1'; }
      if (halo) { halo.setAttribute('cx', x); halo.setAttribute('cy', y); halo.style.opacity = '0.28'; }

      const priceEl = document.getElementById('stockDetailLivePrice');
      const labelEl = document.getElementById('stockScrubBadge');
      if (priceEl) priceEl.textContent = formatWon(priceVal);
      if (labelEl) {
        const diff = priceVal - stock.prevClose;
        labelEl.textContent = `${state.invest.timeframe} 구간 #${idx + 1} · 기준 대비 ${diff >= 0 ? '+' : ''}${formatWon(diff)}`;
        labelEl.classList.remove('hidden');
      }
    }

    function clearChartScrub(stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      ['scrubCrosshairLine', 'scrubCrosshairDot', 'scrubCrosshairHalo'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0';
      });
      const priceEl = document.getElementById('stockDetailLivePrice');
      const labelEl = document.getElementById('stockScrubBadge');
      if (priceEl) priceEl.textContent = formatWon(stock.price);
      if (labelEl) labelEl.classList.add('hidden');
    }

    let orderQtyState = 1;
    function openStockOrderSheet(stockId, side = 'buy') {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = 1;
      const isBuy = side === 'buy';
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded-full ${isBuy ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand'} text-[10.5px] font-bold mb-1">
                ${isBuy ? '빠른 구매 주문' : '빠른 판매 주문'}
              </span>
              <h3 class="text-[18px] font-extrabold ${textPrimary}">${escapeHtml(stock.name)} ${isBuy ? '구매' : '판매'}</h3>
            </div>
            <span class="text-sm font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">1주 ${formatWon(stock.price)}</span>
          </div>

          <div class="p-4 rounded-2xl ${subSurface()} flex items-center justify-between">
            <span class="text-xs font-semibold text-ink-muted">주문 수량</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="adjustOrderQty('${stock.id}', -1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold tap-btn cursor-pointer">-</button>
              <span id="orderQtyText" class="text-base font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">1주</span>
              <button type="button" onclick="adjustOrderQty('${stock.id}', 1)" class="w-8 h-8 rounded-xl ${cardSurface()} font-extrabold tap-btn cursor-pointer">+</button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs px-1">
            <span class="text-ink-muted">${isBuy ? '주문 가능 모아 통장 잔액' : '현재 보유 수량'}</span>
            <strong class="${textPrimary} [font-variant-numeric:tabular-nums]">${isBuy ? formatWon(state.balance) : `${stock.shares}주`}</strong>
          </div>

          <button
            id="orderSubmitBtn"
            type="button"
            onclick="executeStockOrder('${stock.id}', '${side}')"
            class="w-full py-3.5 rounded-2xl ${isBuy ? 'bg-danger hover:bg-rose-600' : 'bg-brand hover:bg-brand-hover'} text-white text-sm font-extrabold tap-btn cursor-pointer [font-variant-numeric:tabular-nums]"
          >
            총 ${formatWon(stock.price)} ${isBuy ? '구매하기' : '판매하기'}
          </button>
        </div>
      `);
    }

    function adjustOrderQty(stockId, delta) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = Math.max(1, Math.min(50, orderQtyState + delta));
      const qtyEl = document.getElementById('orderQtyText');
      const btnEl = document.getElementById('orderSubmitBtn');
      if (qtyEl) qtyEl.textContent = `${orderQtyState}주`;
      if (btnEl) {
        const isBuy = btnEl.textContent.includes('구매');
        btnEl.textContent = `총 ${formatWon(stock.price * orderQtyState)} ${isBuy ? '구매하기' : '판매하기'}`;
      }
    }

    function executeStockOrder(stockId, side) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const qty = orderQtyState;
      const total = stock.price * qty;
      const isBuy = side === 'buy';

      if (isBuy) {
        if (state.balance < total) {
          showToast('모아 통장 잔액이 부족해요.', 'danger');
          return;
        }
        const prevCost = stock.avgPrice * stock.shares;
        stock.shares += qty;
        stock.avgPrice = Math.round((prevCost + total) / stock.shares);
        state.balance -= total;
      } else {
        if (stock.shares < qty) {
          showToast('보유 수량보다 많이 판매할 수 없어요.', 'danger');
          return;
        }
        stock.shares -= qty;
        if (stock.shares === 0) stock.avgPrice = 0;
        state.balance += total;
      }

      state.transactions.unshift({
        id: Date.now(),
        title: `모아 증권 (${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'})`,
        category: '투자',
        amount: isBuy ? -total : total,
        time: '방금 전',
        iconKey: 'chart',
        tone: isBuy ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand',
        memo: `1주당 ${formatWon(stock.price)} 체결`,
      });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      pushNotification({
        category: '주식·송금',
        iconKey: 'chart',
        tone: isBuy ? 'danger' : 'brand',
        title: `${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'} 체결`,
        body: `총 ${formatWon(total)}에 체결되었어요. (1주 ${formatWon(stock.price)})`,
        actionTab: 'invest',
        settingKey: 'stockAlert',
      });
    }

    function renderSparklineSvg(history, isUp, width = 56, height = 24) {
      const min = Math.min(...history);
      const max = Math.max(...history);
      const range = Math.max(1, max - min);
      const pts = history
        .map((v, i) => {
          const x = ((i / (history.length - 1)) * (width - 4) + 2).toFixed(1);
          const y = (height - 3 - ((v - min) / range) * (height - 6)).toFixed(1);
          return `${x},${y}`;
        })
        .join(' ');
      const stroke = isUp ? '#F04452' : '#3182F6';
      return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="overflow-visible shrink-0"><polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
    }

    function renderInvestScreen() {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const dividerCls = t('divide-slate-100', 'divide-white/[0.05]');
      const cAnim = cardMotionCls();

      if (state.invest.selectedStockId) {
        const stock = state.invest.stocks.find((s) => s.id === state.invest.selectedStockId) || state.invest.stocks[0];
        const diff = stock.price - stock.prevClose;
        const rate = (diff / stock.prevClose) * 100;
        const isUp = diff >= 0;
        const strokeColor = isUp ? '#F04452' : '#3182F6';

        const min = Math.min(...stock.history);
        const max = Math.max(...stock.history);
        const range = Math.max(1, max - min);
        const ptsArr = stock.history.map((v, i) => {
          const x = ((i / (stock.history.length - 1)) * 300 + 10).toFixed(1);
          const y = (128 - ((v - min) / range) * 100).toFixed(1);
          return `${x},${y}`;
        });
        const pts = ptsArr.join(' ');
        const areaPath = `M 10,140 L ${ptsArr.join(' L ')} L 310,140 Z`;

        return `
          <div class="px-4 pt-3 pb-6 space-y-3.5 ${screenMotionCls()}">
            <div class="flex items-center justify-between">
              <button type="button" onclick="closeStockDetail()" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full ${cardSurface()} text-xs font-bold ${textPrimary} tap-btn cursor-pointer">
                ${ICONS.chevronLeft}
                <span>증권</span>
              </button>
              <button
                type="button"
                onclick="toggleStockWatch('${stock.id}', event)"
                class="px-3.5 py-1.5 rounded-full ${stock.watched ? 'bg-danger-soft text-danger' : `${cardSurface()} text-ink-muted`} text-xs font-bold tap-btn cursor-pointer"
              >
                ${stock.watched ? '♥ 관심 중' : '♡ 관심'}
              </button>
            </div>

            <div class="${cardSurface()} rounded-[26px] p-5 space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full ${stock.badgeTone} flex items-center justify-center font-black text-xs">${escapeHtml(stock.badge)}</div>
                  <div>
                    <p class="text-[11px] font-semibold text-ink-muted">${escapeHtml(stock.code)} · ${escapeHtml(stock.sector)}</p>
                    <h2 class="text-[18px] font-extrabold tracking-[-0.02em] ${textPrimary}">${escapeHtml(stock.name)}</h2>
                  </div>
                </div>
                ${xrayPin('invest-scrub', '크로스헤어 차트')}
              </div>

              <div>
                <p id="stockDetailLivePrice" class="text-[28px] font-extrabold tracking-[-0.03em] ${textPrimary} [font-variant-numeric:tabular-nums]">
                  ${formatWon(stock.price)}
                </p>
                <p class="text-[12.5px] font-bold ${isUp ? 'text-danger' : 'text-brand'} [font-variant-numeric:tabular-nums]">
                  어제보다 ${isUp ? '+' : ''}${formatWon(diff)} (${isUp ? '+' : ''}${rate.toFixed(2)}%)
                </p>
                <p id="stockScrubBadge" class="hidden mt-1.5 inline-block px-2.5 py-0.5 rounded-full bg-amber-400/15 text-amber-300 text-[11px] font-bold"></p>
              </div>

              <!-- 영역 그라데이션 + 실시간 이동 크로스헤어 SVG 차트 -->
              <div class="pt-1">
                <svg
                  viewBox="0 0 320 148"
                  class="w-full h-40 overflow-visible cursor-crosshair select-none touch-none"
                  onmousemove="handleChartScrub(event, '${stock.id}')"
                  ontouchmove="handleChartScrub(event, '${stock.id}')"
                  onmouseleave="clearChartScrub('${stock.id}')"
                  ontouchend="clearChartScrub('${stock.id}')"
                >
                  <defs>
                    <linearGradient id="stockAreaGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.24" />
                      <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0" />
                    </linearGradient>
                  </defs>
                  <line x1="10" y1="28" x2="310" y2="28" stroke="currentColor" class="text-white/[0.06]" stroke-dasharray="3 3" />
                  <line x1="10" y1="80" x2="310" y2="80" stroke="currentColor" class="text-white/[0.06]" stroke-dasharray="3 3" />
                  <path d="${areaPath}" fill="url(#stockAreaGrad)" />
                  <polyline
                    fill="none"
                    stroke="${strokeColor}"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    points="${pts}"
                    class="animate-draw-line"
                    style="stroke-dasharray: 520;"
                  />
                  <!-- 스크러빙 크로스헤어 -->
                  <line id="scrubCrosshairLine" x1="10" y1="16" x2="10" y2="140" stroke="${strokeColor}" stroke-width="1.4" stroke-dasharray="3 3" style="opacity: 0; transition: opacity 0.12s;" />
                  <circle id="scrubCrosshairHalo" cx="10" cy="80" r="10" fill="${strokeColor}" style="opacity: 0; transition: opacity 0.12s;" />
                  <circle id="scrubCrosshairDot" cx="10" cy="80" r="4.5" fill="${strokeColor}" stroke="#FFFFFF" stroke-width="2" style="opacity: 0; transition: opacity 0.12s;" />
                </svg>
                <p class="text-[11px] text-center text-ink-muted">차트를 좌우로 드래그해 시점별 가격을 탐색해 보세요</p>
              </div>

              <div class="grid grid-cols-4 gap-1 p-1 rounded-2xl ${subSurface()}">
                ${['1일', '1주', '1달', '1년']
                  .map(
                    (tf) => `
                      <button
                        type="button"
                        onclick="setStockTimeframe('${tf}')"
                        class="py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                          state.invest.timeframe === tf ? `${cardSurface()} ${textPrimary}` : 'text-ink-muted'

    function startRealtimeStockTicker() {
      setInterval(() => {
        if (!state || !state.invest || !state.invest.stocks) return;
        const idx = Math.floor(Math.random() * state.invest.stocks.length);
        const target = state.invest.stocks[idx];
        const deltaPct = (Math.random() - 0.46) * 0.016;
        const rawDelta = Math.round((target.price * deltaPct) / 100) * 100;
        const delta = rawDelta === 0 ? (Math.random() > 0.5 ? 200 : -200) : rawDelta;

        target.price = Math.max(5000, target.price + delta);
        target.history.push(target.price);
        if (target.history.length > 14) target.history.shift();
        state.invest.stocks.forEach((s) => { s.lastFlash = ''; });
        target.lastFlash = delta > 0 ? 'animate-flash-up' : 'animate-flash-down';

        if (state.activeTab === 'invest' && !state.invest.selectedStockId) {
          state.motion.enterType = 'none';
          renderAppContent();
        }
      }, 2800);
    }

    function executeCardTestPay(merchant, category, amount, iconKey, isOverseas, isOnline) {
      const card = getActiveCard();
      closeSheet();

      if (card.locked) {
        triggerCardShake();
        pushNotification({ category: '보안·예산', iconKey: 'lock', tone: 'danger', title: '잠긴 카드 결제를 안전하게 막았어요', body: `${merchant} (${formatWon(amount)}) 시도가 차단되었어요.`, actionTab: 'cards', settingKey: 'cardAlert' });
        showToast('카드가 잠겨 있어 결제를 차단했어요.', 'danger');
        return;
      }
      if (isOverseas && card.overseasBlocked) {
        triggerCardShake();
        pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '해외 결제가 자동으로 차단되었어요', body: `${merchant} (${formatWon(amount)}) — 해외 결제 차단 설정이 켜져 있어요.`, actionTab: 'cards', settingKey: 'cardAlert' });
        showToast('해외 결제 차단 설정으로 막았어요.', 'danger');
        return;
      }
      if (isOnline && !card.onlineAllowed) {
        triggerCardShake();
        pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '온라인 결제가 차단되었어요', body: `${merchant} (${formatWon(amount)}) — 온라인 결제 허용이 꺼져 있어요.`, actionTab: 'cards', settingKey: 'cardAlert' });
        showToast('온라인 결제가 꺼져 있어 차단했어요.', 'danger');
        return;
      }
      if (card.monthlySpent + amount > card.monthlyLimit) {
        triggerCardShake();
        pushNotification({ category: '보안·예산', iconKey: 'shield', tone: 'danger', title: '월 이용 한도를 초과해 차단되었어요', body: `${merchant} (${formatWon(amount)}) — 남은 한도 ${formatWon(Math.max(0, card.monthlyLimit - card.monthlySpent))}`, actionTab: 'cards', settingKey: 'cardAlert' });
        showToast('설정한 월 한도를 초과했어요.', 'danger');
        return;
      }
      if (card.type === '체크' && state.balance < amount) {
        showToast('연결된 모아 통장 잔액이 부족해요.', 'danger');
        return;
      }

      if (card.type === '체크') state.balance -= amount;
      card.monthlySpent += amount;
      const cashback = category === '카페' ? Math.round(amount * 0.05) : Math.round(amount * 0.01);
      card.cashbackEarned += cashback;

      state.transactions.unshift({
        id: Date.now(),
        title: merchant,
        category,
        amount: -amount,
        time: '방금 전',
        iconKey,
        tone: 'bg-brand-soft text-brand',
        memo: `${card.name} 결제`,
      });

      state.motion.enterType = 'none';
      renderAll();
      pushNotification({
        category: '카드·결제',
        iconKey,
        tone: 'brand',
        title: `${card.name} 승인 (${formatWon(amount)})`,
        body: `${merchant}에서 결제되었어요. 예상 캐시백 +${formatWon(cashback)}`,
        actionTab: 'cards',
        settingKey: 'cardAlert',
      });
      checkBudgetAlertThreshold();
    }

    function triggerCardShake() {
      const cardEl = document.getElementById('activeCardVisual');
      if (!cardEl) return;
      cardEl.classList.remove('animate-shake');
      void cardEl.offsetWidth;
      cardEl.classList.add('animate-shake');
    }

    function checkBudgetAlertThreshold() {
      const spent = getMonthlySpent();
      const pct = Math.round((spent / state.monthlyBudget) * 100);
      if (pct >= 80 && state.settings.budgetAlert) {
        setTimeout(() => {
          pushNotification({
            category: '보안·예산',
            iconKey: 'chart',
            tone: pct >= 100 ? 'danger' : 'brand',
            title: pct >= 100 ? '이번 달 예산을 넘겼어요' : `이번 달 예산의 ${pct}%를 썼어요`,
            body: `현재 지출 ${formatWon(spent)} / 목표 예산 ${formatWon(state.monthlyBudget)}`,
            actionTab: 'spending',
            settingKey: 'budgetAlert',
          });
        }, 700);
      }
    }

    function renderSwitchRow(checked, title, subtitle, onclickCode, accentDanger = false) {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      return `
