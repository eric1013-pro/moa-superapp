            <div class="relative z-10 mt-4 flex items-center justify-end">
              <button type="button" onclick="openBenefitPromoSheet()" class="px-3.5 py-1.5 rounded-full bg-white/14 hover:bg-white/22 backdrop-blur-md text-white text-[11.5px] font-bold flex items-center gap-1 tap-btn cursor-pointer">
                <span>더 보기</span><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
          </section>

          <!-- 2) 중앙 플로팅 내 모아 포인트 필 배지 -->
          <div class="flex items-center justify-center gap-2 py-0.5 ${cAnim}" ${cardMotionAttr(1)}>
            <button type="button" onclick="openPointsCashoutSheet()" class="px-5 py-2.5 rounded-full ${cardSurface()} border ${t('border-slate-200/80 shadow-md', 'border-white/[0.11] shadow-xl')} flex items-center gap-2.5 tap-btn cursor-pointer group">
              <span class="w-6 h-6 rounded-full bg-brand text-white text-[11px] font-black flex items-center justify-center shadow-sm shadow-brand/40">P</span>
              <span id="benefitsPointCapsuleVal" class="text-[16px] font-extrabold tracking-[-0.02em] ${textPrimary} [font-variant-numeric:tabular-nums]">${formatWon(state.points)}</span>
              <span class="text-ink-muted group-hover:translate-x-0.5 transition-transform">${ICONS.chevronRight}</span>
            </button>
          </div>

          <!-- 3) 오늘의 미션 카드 + 실시간 진행률 바 -->
          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3" ${cardMotionAttr(2)}>
            <div class="space-y-2.5">
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-[11px] font-bold text-brand">오늘의 미션 · ${doneMissions}/${totalMissions} 완료</span>
                  <h2 class="${large ? 'text-[18px]' : 'text-[17px]'} font-extrabold tracking-[-0.025em] ${textPrimary} mt-0.5">
                    ${remainMissions > 0 ? `${remainMissions}개 방문하면 포인트 받아요` : '오늘 미션을 모두 완료했어요'}
                  </h2>
                </div>
                ${xrayPin('benefits-missions', '미션 진행률')}
              </div>
              <div class="w-full h-1.5 rounded-full ${t('bg-canvas', 'bg-white/[0.07]')} overflow-hidden">
                <div class="h-full rounded-full ${remainMissions === 0 ? 'bg-success' : 'bg-brand'} transition-all duration-500 ease-toss" style="width: ${missionPct}%"></div>
              </div>
            </div>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">${missionsHtml}</div>
          </section>

          <!-- 4) 리워드 파트너 추천 카드 -->
          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-2" ${cardMotionAttr(3)}>
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold text-emerald-400">맞춤 리워드 파트너</span>
                <h2 class="${large ? 'text-[18px]' : 'text-[17px]'} font-extrabold tracking-[-0.025em] ${textPrimary} mt-0.5">
                  ${remainPartnerSum > 0 ? `앱 열고 ${formatWon(remainPartnerSum)} 받아요` : '파트너 적립을 모두 완료했어요'}
                </h2>
              </div>
              <span class="px-2.5 py-1 rounded-full ${subSurface()} text-[10.5px] font-bold text-ink-muted">즉시 적립</span>
            </div>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">${partnersHtml}</div>
          </section>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 12. 화면 8: 쇼핑 (`shopping`) — 밑줄 서브탭 · 스와이프 타임특가 · 모아 페이 결제
     * ============================================================================
     */
    function getCartCount() {
      return state.shopping.cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function findProductById(productId) {
      return state.shopping.products.find((p) => p.id === productId) || state.shopping.heroDeals.find((p) => p.id === productId);
    }

    function setShoppingQuery(val) {
      state.shopping.query = val;
      state.motion.enterType = 'none';
      renderAppContent();
      const input = document.getElementById('shoppingSearchInput');
      if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
    }

    function setShoppingSubTab(tabName) {
      state.shopping.subTab = tabName;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function moveShoppingHero(delta) {
      const len = state.shopping.heroDeals.length;
      state.shopping.heroIndex = (state.shopping.heroIndex + delta + len) % len;
      state.motion.enterType = 'none';
      state.motion.heroDir = delta > 0 ? 'next' : 'prev';
      renderAppContent();
      state.motion.heroDir = 'none';
    }

    let heroSwipeStartX = 0;
    function handleHeroTouchStart(e) { heroSwipeStartX = e.touches ? e.touches[0].clientX : e.clientX; }
    function handleHeroTouchEnd(e) {
      const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const diff = heroSwipeStartX - endX;
      if (Math.abs(diff) > 36) moveShoppingHero(diff > 0 ? 1 : -1);
    }

    function addToCart(productId, e) {
      if (e) e.stopPropagation();
      const prod = findProductById(productId);
      if (!prod) return;
      const existing = state.shopping.cart.find((c) => c.productId === productId);
      if (existing) existing.qty += 1;
      else state.shopping.cart.push({ productId, qty: 1 });
      state.motion.enterType = 'none';
      renderAppContent();
      showToast(`"${prod.title}" 상품을 장바구니에 담았어요.`);
    }

    function removeFromCart(productId) {
      state.shopping.cart = state.shopping.cart.filter((c) => c.productId !== productId);
      openShoppingCartSheet();
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function openMyShoppingOrdersSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const ordersHtml =
        state.shopping.orders.length > 0
          ? state.shopping.orders
              .map(
                (o) => `
                  <div class="p-3.5 rounded-2xl ${subSurface()} flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-xl ${cardSurface()} flex items-center justify-center shrink-0 scale-75">${renderProductArtSvg(o.art || 'coffee')}</div>
                      <div class="min-w-0">
                        <p class="text-[13px] font-bold ${textPrimary} truncate">${escapeHtml(o.title)}</p>
                        <p class="text-[11px] text-ink-muted">${escapeHtml(o.date)} · +${formatWon(o.pointsEarned)} 적립</p>
                      </div>
                    </div>
                    <span class="text-xs font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums] shrink-0">${formatWon(o.price)}</span>
                  </div>
                `
              )
              .join('')
          : `<p class="text-xs text-ink-muted text-center py-8">아직 주문한 내역이 없어요.</p>`;

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between"><h3 class="text-[18px] font-extrabold ${textPrimary}">마이 쇼핑 · 주문 내역</h3><span class="text-xs font-bold text-brand">총 ${state.shopping.orders.length}건</span></div>
          <div class="space-y-2 max-h-64 overflow-y-auto no-scrollbar">${ordersHtml}</div>
          <button type="button" onclick="closeSheet()" class="w-full py-3.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">확인</button>
        </div>
      `);
    }

    function openShoppingCartSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      if (state.shopping.cart.length === 0) {
        openSheet(`<div class="py-8 text-center space-y-3"><div class="w-12 h-12 rounded-2xl ${subSurface()} mx-auto flex items-center justify-center text-ink-muted">${ICONS.cart}</div><p class="text-base font-extrabold ${textPrimary}">장바구니가 비어 있어요</p><button type="button" onclick="closeSheet()" class="px-5 py-2.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">상품 둘러보기</button></div>`);
        return;
      }

      let totalPrice = 0;
      let totalReward = 0;
      const itemsHtml = state.shopping.cart
        .map((c) => {
          const prod = findProductById(c.productId);
          if (!prod) return '';
          const itemTotal = prod.price * c.qty;
          totalPrice += itemTotal;
          totalReward += prod.rewardPoints * c.qty;
          return `
            <div class="p-3 rounded-2xl ${subSurface()} flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl ${cardSurface()} flex items-center justify-center shrink-0 scale-75">${renderProductArtSvg(prod.art)}</div>
                <div class="min-w-0"><p class="text-xs font-bold ${textPrimary} truncate">${escapeHtml(prod.title)}</p><p class="text-[11px] text-ink-muted [font-variant-numeric:tabular-nums]">수량 ${c.qty}개 · ${formatWon(itemTotal)}</p></div>
              </div>
              <button type="button" onclick="removeFromCart('${prod.id}')" class="text-xs font-bold text-ink-muted hover:text-danger px-2 cursor-pointer">삭제</button>
            </div>
          `;
        })
        .join('');

      const usablePoints = state.shopping.usePointsInCheckout ? Math.min(state.points, totalPrice) : 0;
      const finalPay = Math.max(0, totalPrice - usablePoints);

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between"><h3 class="text-[18px] font-extrabold ${textPrimary}">장바구니 (${getCartCount()}개)</h3><span class="text-xs font-bold text-brand">+${formatWon(totalReward)} 적립 예정</span></div>
          <div class="space-y-2 max-h-48 overflow-y-auto no-scrollbar">${itemsHtml}</div>
          <div class="p-3.5 rounded-2xl ${subSurface()} space-y-1.5 text-xs">
            <div class="flex items-center justify-between"><span class="text-ink-muted">총 상품 금액</span><strong class="${textPrimary} [font-variant-numeric:tabular-nums]">${formatWon(totalPrice)}</strong></div>
            <div class="flex items-center justify-between"><span class="text-ink-muted">모아 포인트 차감</span><strong class="text-brand [font-variant-numeric:tabular-nums]">-${formatWon(usablePoints)}</strong></div>
            <div class="flex items-center justify-between pt-1.5 border-t ${t('border-slate-200', 'border-white/10')}"><span class="font-bold ${textPrimary}">최종 결제 금액</span><strong class="text-base font-extrabold text-brand [font-variant-numeric:tabular-nums]">${formatWon(finalPay)}</strong></div>
          </div>
          <button type="button" onclick="executeCartCheckout()" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">모아 통장으로 ${formatWon(finalPay)} 결제하기</button>
        </div>
      `);
    }

    function executeCartCheckout() {
      let totalPrice = 0;
      let totalReward = 0;
      const titles = [];
      let firstArt = 'coffee';
      state.shopping.cart.forEach((c, idx) => {
        const prod = findProductById(c.productId);
        if (prod) {
          if (idx === 0) firstArt = prod.art;
          totalPrice += prod.price * c.qty;
          totalReward += prod.rewardPoints * c.qty;
          titles.push(prod.title);
        }
      });
      if (totalPrice <= 0) return;
      const usedPoints = Math.min(state.points, totalPrice);
      const finalPay = totalPrice - usedPoints;
      if (state.balance < finalPay) { showToast('모아 통장 잔액이 부족해요.', 'danger'); return; }

      state.balance -= finalPay;
      state.points = state.points - usedPoints + totalReward;
      if (usedPoints > 0) state.pointHistory.unshift({ id: 'ph_use_' + Date.now(), title: '모아 쇼핑 포인트 사용', amount: -usedPoints, time: '방금 전' });
      state.pointHistory.unshift({ id: 'ph_earn_' + Date.now(), title: '모아 쇼핑 구매 적립', amount: totalReward, time: '방금 전' });

      const orderTitle = titles.length > 1 ? `${titles[0]} 외 ${titles.length - 1}건` : titles[0];
      state.shopping.orders.unshift({ id: 'ord_' + Date.now(), title: orderTitle, price: finalPay, pointsEarned: totalReward, date: '방금 결제완료 · 새벽배송 준비 중', art: firstArt });
      state.transactions.unshift({ id: Date.now(), title: `모아 쇼핑 (${orderTitle})`, category: '쇼핑', amount: -finalPay, time: '방금 전', iconKey: 'bag', tone: 'bg-brand-soft text-brand', memo: usedPoints > 0 ? `포인트 ${formatWon(usedPoints)} 차감 결제` : '모아 페이 결제' });

      state.shopping.cart = [];
      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      spawnFloatingReward(`+${formatWon(totalReward)} 적립!`, 'success');
      pushNotification({ category: '카드·결제', iconKey: 'bag', tone: 'brand', title: `모아 쇼핑 ${formatWon(finalPay)} 결제 완료`, body: `${orderTitle} 주문 완료! +${formatWon(totalReward)} 적립`, actionTab: 'shopping', settingKey: 'txAlert' });
      checkBudgetAlertThreshold();
    }

    function openShoppingQuickAction(type) {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      if (type === 'draw') {
        openSheet(`<div class="space-y-4 text-center"><div class="w-14 h-14 rounded-2xl bg-brand-soft text-brand mx-auto flex items-center justify-center">${ICONS.gift}</div><h3 class="text-[18px] font-extrabold ${textPrimary}">오늘의 쇼핑 뽑기</h3><p class="text-xs text-ink-muted">하루 한 번 쇼핑 지원 포인트를 즉시 뽑을 수 있어요.</p><button type="button" onclick="closeSheet(); addMoaPoints(30, '쇼핑 오늘의 뽑기'); showToast('오늘의 뽑기 성공! +30원 적립되었어요.')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">뽑기 열고 +30원 받기</button></div>`);
      } else if (type === 'feed') {
        openSheet(`<div class="space-y-4"><h3 class="text-[18px] font-extrabold ${textPrimary}">포인트 피드 실시간 인기</h3><button type="button" onclick="closeSheet(); openProductCheckoutSheet('prod_1')" class="w-full p-4 rounded-2xl ${subSurface()} flex items-center justify-between text-left tap-card cursor-pointer"><span class="text-xs font-bold ${textPrimary}">모아 로스터리 스페셜티 드립백 기프트</span><span class="text-xs font-extrabold text-brand">14,900원 →</span></button></div>`);
      } else if (type === 'miniapp') {
        switchTab('all'); setAllMenuChip('미니앱');
      } else if (type === 'pet') {
        setShoppingSubTab('카테고리'); openProductCheckoutSheet('prod_6');
      } else if (type === 'prizedraw') {
        openSheet(`<div class="space-y-4 text-center"><div class="w-14 h-14 rounded-2xl bg-amber-500/18 text-amber-400 mx-auto flex items-center justify-center">${ICONS.spark}</div><h3 class="text-[18px] font-extrabold ${textPrimary}">100% 당첨 상품 뽑기</h3><p class="text-xs text-ink-muted">쇼핑 즉시 사용 가능한 50원 보너스 포인트를 드려요.</p><button type="button" onclick="closeSheet(); addMoaPoints(50, '쇼핑 상품 뽑기'); showToast('상품 뽑기 당첨! +50원이 적립되었어요.')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer">+50원 바로 받기</button></div>`);
      }
    }

    function openProductCheckoutSheet(productId) {
      const prod = findProductById(productId);
      if (!prod) return;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const usablePoints = state.shopping.usePointsInCheckout ? Math.min(state.points, prod.price) : 0;
      const finalPay = Math.max(0, prod.price - usablePoints);

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-start gap-3.5">
            <div class="w-16 h-16 rounded-2xl ${subSurface()} flex items-center justify-center shrink-0">${renderProductArtSvg(prod.art)}</div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded-md bg-danger text-white text-[10px] font-extrabold">${prod.discountRate}% 특가</span>
                <span class="px-1.5 py-0.5 rounded-md ${subSurface()} text-ink-muted text-[10px] font-bold">${escapeHtml(prod.badgeType || 'AI')}</span>
              </div>
              <h3 class="text-[15.5px] font-extrabold ${textPrimary} mt-1 leading-snug">${escapeHtml(prod.title)}</h3>
              <div class="flex items-baseline gap-2 mt-1">
                <span class="text-lg font-black ${textPrimary} [font-variant-numeric:tabular-nums]">${formatWon(prod.price)}</span>
                <span class="text-xs text-ink-muted line-through [font-variant-numeric:tabular-nums]">${formatWon(prod.originalPrice)}</span>
              </div>
            </div>
          </div>

          <div class="p-3.5 rounded-2xl ${subSurface()} space-y-2.5 text-xs">
            <div class="flex items-center justify-between">
              <div><span class="font-bold ${textPrimary}">보유 모아 포인트 사용</span><p class="text-[11px] text-ink-muted [font-variant-numeric:tabular-nums]">보유: ${formatWon(state.points)}</p></div>
              <button type="button" onclick="toggleCheckoutUsePoints('${prod.id}')" class="px-3 py-1.5 rounded-xl font-extrabold tap-btn cursor-pointer ${state.shopping.usePointsInCheckout && state.points > 0 ? 'bg-brand text-white' : `${cardSurface()} text-ink-muted`}">
                ${state.shopping.usePointsInCheckout && state.points > 0 ? `-${formatWon(usablePoints)} 적용` : '전액 사용'}
              </button>
            </div>
            <div class="pt-2 border-t ${t('border-slate-200', 'border-white/10')} space-y-1.5">
              <span class="text-[11px] font-semibold text-ink-muted block">결제 수단</span>
              <div class="grid grid-cols-2 gap-1.5">
                <button type="button" onclick="setShoppingPayMethod('account', '${prod.id}')" class="py-2.5 px-3 rounded-xl text-[11.5px] font-bold text-left border transition-all cursor-pointer ${state.shopping.paymentMethod === 'account' ? 'border-brand bg-brand-soft text-brand' : `${cardSurface()} border-transparent text-ink-muted`}">모아 입출금 통장</button>
                <button type="button" onclick="setShoppingPayMethod('card_check', '${prod.id}')" class="py-2.5 px-3 rounded-xl text-[11.5px] font-bold text-left border transition-all cursor-pointer ${state.shopping.paymentMethod === 'card_check' ? 'border-brand bg-brand-soft text-brand' : `${cardSurface()} border-transparent text-ink-muted`}">모아 데일리 카드</button>
              </div>
            </div>
            <div class="flex items-center justify-between pt-2 border-t ${t('border-slate-200', 'border-white/10')}"><span class="font-bold ${textPrimary}">최종 결제 (+${formatWon(prod.rewardPoints)} 적립)</span><strong class="text-base font-black text-brand [font-variant-numeric:tabular-nums]">${formatWon(finalPay)}</strong></div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="addToCart('${prod.id}'); closeSheet()" class="py-3.5 rounded-2xl ${subSurface()} ${textPrimary} text-xs font-extrabold tap-btn cursor-pointer">장바구니</button>
            <button type="button" onclick="executeSingleProductPurchase('${prod.id}')" class="col-span-2 py-3.5 rounded-2xl bg-brand text-white text-sm font-extrabold tap-btn cursor-pointer shadow-lg shadow-brand/25 [font-variant-numeric:tabular-nums]">${formatWon(finalPay)} 즉시 결제하기</button>
          </div>
        </div>
      `);
    }

    function toggleCheckoutUsePoints(productId) { state.shopping.usePointsInCheckout = !state.shopping.usePointsInCheckout; openProductCheckoutSheet(productId); }
    function setShoppingPayMethod(method, productId) { state.shopping.paymentMethod = method; openProductCheckoutSheet(productId); }

    function executeSingleProductPurchase(productId) {
      const prod = findProductById(productId);
      if (!prod) return;
      const usedPoints = state.shopping.usePointsInCheckout ? Math.min(state.points, prod.price) : 0;
      const finalPay = Math.max(0, prod.price - usedPoints);
      const useCard = state.shopping.paymentMethod === 'card_check';
      const checkCard = state.cards.list[0];

      if (useCard) {
        if (checkCard.locked) { closeSheet(); pushNotification({ category: '보안·예산', iconKey: 'lock', tone: 'danger', title: '잠긴 카드로 쇼핑 결제가 차단되었어요', body: `${prod.title} (${formatWon(finalPay)})`, actionTab: 'cards', settingKey: 'cardAlert' }); showToast('카드가 잠겨 있어 차단되었어요.', 'danger'); return; }
        if (!checkCard.onlineAllowed) { closeSheet(); showToast('카드의 온라인 결제 허용이 꺼져 있어요.', 'danger'); return; }
      }
      if (state.balance < finalPay) { showToast('모아 통장 잔액이 부족해요.', 'danger'); return; }

      state.balance -= finalPay;
      if (useCard) { checkCard.monthlySpent += finalPay; checkCard.cashbackEarned += prod.rewardPoints; }
      state.points = state.points - usedPoints + prod.rewardPoints;
      if (usedPoints > 0) state.pointHistory.unshift({ id: 'ph_u_' + Date.now(), title: `쇼핑 포인트 사용 (${prod.title})`, amount: -usedPoints, time: '방금 전' });
      state.pointHistory.unshift({ id: 'ph_e_' + Date.now(), title: `쇼핑 구매 적립 (${prod.title})`, amount: prod.rewardPoints, time: '방금 전' });

      state.shopping.orders.unshift({ id: 'ord_' + Date.now(), title: prod.title, price: finalPay, pointsEarned: prod.rewardPoints, date: '방금 결제완료 · 새벽배송 예정', art: prod.art });
      state.transactions.unshift({ id: Date.now(), title: prod.title, category: '쇼핑', amount: -finalPay, time: '방금 전', iconKey: 'bag', tone: 'bg-brand-soft text-brand', memo: `${useCard ? '모아 데일리 카드' : '모아 페이 통장'} 결제 (+${formatWon(prod.rewardPoints)} 적립)` });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      spawnFloatingReward(`+${formatWon(prod.rewardPoints)} 적립!`, 'success');
      pushNotification({ category: '카드·결제', iconKey: 'bag', tone: 'brand', title: `모아 쇼핑 결제 완료 (${formatWon(finalPay)})`, body: `${prod.title} 주문 완료! +${formatWon(prod.rewardPoints)} 적립`, actionTab: 'shopping', settingKey: 'txAlert' });

    function dismissAllBanner(bannerId, e) {
      if (e) e.stopPropagation();
      const el = document.getElementById(`all-banner-${bannerId}`);
      if (el) {
        el.style.maxHeight = el.scrollHeight + 'px';
        requestAnimationFrame(() => el.classList.add('banner-collapsing'));
        setTimeout(() => {
          if (!state.allMenu.dismissedBanners.includes(bannerId)) state.allMenu.dismissedBanners.push(bannerId);
          state.motion.enterType = 'none';
          renderAppContent();
        }, 280);
      } else {
        state.allMenu.dismissedBanners.push(bannerId);
        renderAppContent();
      }
    }

    function rerollLuckyNumbers() {
      const picked = new Set();
      while (picked.size < 6) picked.add(Math.floor(Math.random() * 45) + 1);
      state.allMenu.luckyNumbers = Array.from(picked).sort((a, b) => a - b);
      openLuckyNumbersSheet();
    }

    function openServiceQuickSheet(serviceKey) {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      if (serviceKey === 'transit') {
        openSheet(`<div class="space-y-4"><span class="inline-block px-2 py-0.5 rounded-full bg-brand-soft text-brand text-[10px] font-bold">후불 교통 체크카드</span><h3 class="text-[18px] font-extrabold ${textPrimary}">이번 달 대중교통 이용 요금</h3><div class="p-4 rounded-2xl ${subSurface()} flex items-center justify-between"><span class="text-xs text-ink-muted">지하철·버스 18회 (10% 할인 적용)</span><strong class="text-base font-extrabold text-brand [font-variant-numeric:tabular-nums]">24,300원</strong></div><button type="button" onclick="closeSheet(); switchTab('cards')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">내 카드 관리로 이동</button></div>`);
      } else if (serviceKey === 'telecom') {
        openSheet(`<div class="space-y-4"><span class="inline-block px-2 py-0.5 rounded-full bg-emerald-500/18 text-emerald-400 text-[10px] font-bold">모아 모바일 요금제</span><h3 class="text-[18px] font-extrabold ${textPrimary}">데이터 무제한 월 24,900원</h3><p class="text-xs text-ink-muted">약정 없이 언제든 해지 가능하며 매달 모아 포인트 1,000원을 적립해 드려요.</p><button type="button" onclick="closeSheet(); showToast('요금제 혜택을 관심 목록에 저장했어요.', 'brand')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">확인</button></div>`);
      } else if (serviceKey === 'brandcon') {
        openSheet(`<div class="space-y-4"><span class="inline-block px-2 py-0.5 rounded-full bg-purple-500/18 text-purple-400 text-[10px] font-bold">모아 브랜드콘</span><h3 class="text-[18px] font-extrabold ${textPrimary}">모바일 쿠폰도 5% 즉시 적립</h3><p class="text-xs text-ink-muted">모아 로스터리·모아프레시 모바일 교환권을 쇼핑 탭에서 특가로 만나보세요.</p><button type="button" onclick="closeSheet(); switchTab('shopping')" class="w-full py-3.5 rounded-2xl bg-brand text-white text-xs font-extrabold tap-btn cursor-pointer">쇼핑 탭으로 이동</button></div>`);
      }
    }

    function renderAllScreen() {
      const large = state.settings.largeText;
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#9EA6B2]');
      const cAnim = cardMotionCls();

      const chips = ['전체', '모아뱅크', '미니앱', '게임', '신분증·인증'];
      const q = state.allMenu.searchQuery.trim().toLowerCase();
      const activeChip = state.allMenu.activeChip;

      const recentServices = [
        { id: 'srv_transit', label: '교통 체크카드', iconKey: 'train', tone: 'bg-sky-500/15 text-sky-400', group: '모아뱅크', onclick: "openServiceQuickSheet('transit')" },
        { id: 'srv_card', label: '체크카드 관리', iconKey: 'card', tone: 'bg-brand-soft text-brand', group: '모아뱅크', onclick: "switchTab('cards')" },
        { id: 'srv_spending', label: '소비 분석', iconKey: 'chart', tone: 'bg-emerald-500/15 text-emerald-400', group: '모아뱅크', onclick: "switchTab('spending')" },
        { id: 'srv_telecom', label: '통신 요금제', iconKey: 'phone', tone: 'bg-purple-500/15 text-purple-400', group: '미니앱', onclick: "openServiceQuickSheet('telecom')" },
        { id: 'srv_goal', label: '모으기 저금통', iconKey: 'piggy', tone: 'bg-amber-500/15 text-amber-400', group: '모아뱅크', onclick: "switchTab('home')" },
        { id: 'srv_transfer', label: '돈 보내기', iconKey: 'send', tone: 'bg-brand-soft text-brand', group: '모아뱅크', onclick: "switchTab('transfer')" },
        { id: 'srv_brandcon', label: '브랜드콘', iconKey: 'gift', tone: 'bg-rose-500/15 text-rose-400', group: '미니앱', onclick: "openServiceQuickSheet('brandcon')" },
        { id: 'srv_more', label: '더보기', iconKey: 'gridPlus', tone: `${subSurface()} text-ink-muted`, group: '전체', onclick: "switchTab('benefits')" },
      ];

      const investSum = getInvestSummary();
      const activeCard = getActiveCard();
      const financialServices = [
        { iconKey: 'wallet', tone: 'bg-brand-soft text-brand', title: '모아뱅크 입출금 통장', sub: '연 2.4% 이자 · 수수료 무료', rightValue: displayMoney(state.balance), group: '모아뱅크', onclick: "switchTab('home')" },
        { iconKey: 'chart', tone: 'bg-danger-soft text-danger', title: '모아 증권 · 내 주식', sub: `평가수익 ${investSum.profit >= 0 ? '+' : ''}${investSum.profitRate.toFixed(1)}%`, rightValue: displayMoney(investSum.totalValue), group: '모아뱅크', onclick: "switchTab('invest')" },
        { iconKey: 'card', tone: 'bg-sky-500/15 text-sky-400', title: '내 카드 · 안심 보안 설정', sub: `${activeCard.name} (${activeCard.locked ? '잠금 중' : '정상 이용'})`, rightValue: displayMoney(activeCard.monthlySpent), group: '모아뱅크', onclick: "switchTab('cards')" },
        { iconKey: 'gauge', tone: 'bg-purple-500/15 text-purple-400', title: '내 신용점수 리포트', sub: '상위 4% · 점수 올리기 가능', rightValue: `${state.creditScore}점`, group: '모아뱅크', onclick: 'openCreditScoreSheet()' },
        { iconKey: 'coin', tone: 'bg-amber-500/15 text-amber-400', title: '모아 포인트', sub: '1원 단위 통장 즉시 출금', rightValue: `P ${formatWon(state.points)}`, group: '미니앱', onclick: 'openPointsCashoutSheet()' },
        { iconKey: 'idCard', tone: 'bg-emerald-500/15 text-emerald-400', title: '모바일 신분증 · 인증서', sub: 'QR 원탭 본인확인', rightValue: '열기', group: '신분증·인증', onclick: 'openMobileIdCertSheet()' },
      ];

      const filteredRecent = recentServices.filter((s) => (activeChip === '전체' || s.group === activeChip || s.group === '전체') && (!q || s.label.toLowerCase().includes(q)));
      const filteredFinance = financialServices.filter((f) => (activeChip === '전체' || f.group === activeChip) && (!q || f.title.toLowerCase().includes(q) || f.sub.toLowerCase().includes(q)));

      const banners = [
        { id: 'ban_jungle', iconKey: 'puzzle', tone: 'from-[#112A22] to-[#17171C]', iconBg: 'bg-emerald-500/20 text-emerald-400', tag: '추천 미니게임', title: '정글 매치 퍼즐', sub: '타일 3개 맞추고 +60원 받기', btnText: '게임하기', onclick: 'openJungleMatchGameSheet()' },
        { id: 'ban_lucky365', iconKey: 'dice', tone: 'from-[#191F38] to-[#17171C]', iconBg: 'bg-indigo-500/20 text-indigo-400', tag: '오늘의 미니앱', title: '행운 번호 추천 365', sub: '오늘 나의 행운 번호 6개 추첨', btnText: '보기', onclick: 'openLuckyNumbersSheet()' },
      ].filter((b) => !state.allMenu.dismissedBanners.includes(b.id) && (!q || b.title.toLowerCase().includes(q) || b.sub.toLowerCase().includes(q)));

      const bannersHtml =
        banners.length > 0
          ? banners
              .map(
                (b) => `
                  <div id="all-banner-${b.id}" onclick="${b.onclick}" role="button" tabindex="0" class="relative rounded-[22px] p-4 bg-gradient-to-r ${b.tone} text-white border border-white/[0.07] flex items-center justify-between gap-3 cursor-pointer tap-card">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-[16px] ${b.iconBg} flex items-center justify-center shrink-0">${getIcon(b.iconKey, 'spark')}</div>
                      <div class="min-w-0">
                        <span class="text-[10px] font-bold text-white/60">${escapeHtml(b.tag)}</span>
                        <p class="text-[14px] font-extrabold text-white truncate">${escapeHtml(b.title)}</p>
                        <p class="text-[11.5px] text-white/70 truncate">${escapeHtml(b.sub)}</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="px-3 py-1.5 rounded-[10px] bg-brand text-white text-[11.5px] font-extrabold">${escapeHtml(b.btnText)}</span>
                      <button type="button" onclick="dismissAllBanner('${b.id}', event)" aria-label="배너 닫기" class="w-6 h-6 rounded-full bg-black/35 hover:bg-black/60 text-white/70 hover:text-white text-xs flex items-center justify-center tap-btn cursor-pointer">×</button>
                    </div>
                  </div>
                `
              )
              .join('')
          : state.allMenu.dismissedBanners.length > 0
            ? `<div class="flex items-center justify-between px-4 py-2.5 rounded-2xl ${cardSurface()} text-xs"><span class="text-ink-muted">추천 배너를 숨겼어요.</span><button type="button" onclick="restoreAllBanners()" class="text-brand font-extrabold cursor-pointer">다시 보기</button></div>`
            : '';

      return `
        <div class="px-4 pb-6 space-y-3.5 ${screenMotionCls()}">
          <header class="sticky top-0 z-20 -mx-4 px-5 py-3 ${stickyHeaderCls()} flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand to-indigo-500 text-white font-black text-sm flex items-center justify-center shadow-md shadow-brand/20">모</div>
              <div class="flex items-center gap-1.5">
                <h1 class="text-[19px] font-extrabold tracking-[-0.03em] ${textPrimary}">모아님</h1>
                <span class="px-1.5 py-0.5 rounded-md bg-brand-soft text-brand text-[9.5px] font-extrabold">PRIME</span>
              </div>
            </div>
            <div class="flex items-center gap-2 text-[12.5px] font-bold ${textSecondary}">
              <button type="button" onclick="openCustomerSupportSheet()" class="hover:${textPrimary} tap-btn cursor-pointer">고객센터</button>
              <span class="text-ink-muted/35">|</span>
              <button type="button" onclick="switchTab('settings')" class="hover:${textPrimary} tap-btn cursor-pointer">설정</button>
            </div>
          </header>

          <div class="space-y-2.5 ${cAnim}" ${cardMotionAttr(0)}>
            <div class="relative">
              <input id="allMenuSearchInput" type="text" value="${escapeHtml(state.allMenu.searchQuery)}" oninput="setAllMenuSearch(this.value)" placeholder="메뉴 · 금융 서비스 검색" class="w-full pl-9 pr-14 py-2.5 rounded-2xl text-[13px] font-semibold focus:outline-none focus:ring-2 focus:ring-brand/45 ${cardSurface()} ${textPrimary} placeholder:text-ink-muted" />
              <span class="text-ink-muted absolute left-3.5 top-2.5">${ICONS.search}</span>
              <div class="absolute right-2.5 top-2 flex items-center gap-1">
                ${state.allMenu.searchQuery ? `<button type="button" onclick="setAllMenuSearch('')" class="px-1.5 py-0.5 text-xs text-ink-muted cursor-pointer">✕</button>` : ''}
                ${xrayPin('all-search', '통합 검색')}
              </div>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${chips.map((chip) => `<button type="button" onclick="setAllMenuChip('${chip}')" class="px-3.5 py-1.5 rounded-full text-[12px] font-extrabold shrink-0 tap-btn cursor-pointer ${state.allMenu.activeChip === chip ? 'bg-brand text-white' : `${cardSurface()} ${textSecondary}`}">${chip}</button>`).join('')}
            </div>
          </div>

          <div class="space-y-2 ${cAnim}" ${cardMotionAttr(1)}>${bannersHtml}</div>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-3.5" ${cardMotionAttr(2)}>
            <div class="flex items-center justify-between"><h2 class="text-[16px] font-extrabold tracking-[-0.025em] ${textPrimary}">최근 서비스</h2>${xrayPin('all-banners', '허브 딥링크')}</div>
            ${
              filteredRecent.length > 0
                ? `<div class="grid grid-cols-4 gap-y-4 gap-x-2">${filteredRecent.map((srv) => `<button type="button" onclick="${srv.onclick}" class="flex flex-col items-center justify-center gap-1.5 py-1 rounded-2xl tap-btn cursor-pointer"><div class="w-12 h-12 rounded-[16px] ${srv.tone} flex items-center justify-center">${getIcon(srv.iconKey, 'spark')}</div><span class="text-[11px] font-bold ${textSecondary} text-center leading-tight tracking-[-0.02em]">${escapeHtml(srv.label)}</span></button>`).join('')}</div>`
                : `<p class="text-xs text-ink-muted text-center py-4">검색어와 일치하는 서비스가 없어요.</p>`
            }
          </section>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] p-5 space-y-1.5" ${cardMotionAttr(3)}>
            <div class="flex items-center justify-between mb-1"><h2 class="text-[16px] font-extrabold tracking-[-0.025em] ${textPrimary}">내 자산</h2><span class="text-[11px] font-semibold text-ink-muted">실시간 연동</span></div>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">
              ${
                filteredFinance.length > 0
                  ? filteredFinance.map((f) => `<button type="button" onclick="${f.onclick}" class="w-full py-3.5 px-2 -mx-2 rounded-2xl flex items-center justify-between gap-3 text-left tap-row cursor-pointer"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-full ${f.tone} flex items-center justify-center shrink-0">${getIcon(f.iconKey, 'wallet')}</div><div class="min-w-0"><p class="${large ? 'text-[15.5px]' : 'text-[14.5px]'} font-semibold ${textPrimary} truncate">${escapeHtml(f.title)}</p><p class="text-[11.5px] text-ink-muted truncate">${escapeHtml(f.sub)}</p></div></div><div class="flex items-center gap-1 shrink-0"><span class="text-[13px] font-extrabold text-brand [font-variant-numeric:tabular-nums]">${escapeHtml(f.rightValue)}</span>${ICONS.chevronRight}</div></button>`).join('')
                  : `<p class="text-xs text-ink-muted text-center py-6">검색 결과가 없어요.</p>`
              }
            </div>
          </section>

          <section class="${cardSurface()} ${cAnim} rounded-[24px] px-5 py-2" ${cardMotionAttr(4)}>
            <div class="divide-y ${t('divide-slate-100', 'divide-white/[0.05]')}">
              ${renderSwitchRow(state.xrayMode, '원칙 X-Ray 해설 모드', '화면별 Before/After 핀테크 디자인 원칙 해설을 켜고 꺼요.', 'toggleXrayMode()')}
              ${renderSwitchRow(state.settings.darkMode, '다크 모드', '어두운 화면과 밝은 화면을 즉시 전환해요.', "toggleSetting('darkMode', '다크 모드를 켰어요.', '라이트 모드로 전환했어요.')")}
            </div>
          </section>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 14. 전역 내비게이션 · GPU 슬라이딩 캡슐 인디케이터 · 카운트다운 엔진
     * ============================================================================
     */
    const MAIN_TABS = ['home', 'benefits', 'shopping', 'invest', 'all'];

    function switchTab(tabName, customDirection = null) {
      if (MAIN_TABS.includes(state.activeTab)) state.previousMainTab = state.activeTab;
      if (tabName !== 'invest') state.invest.selectedStockId = null;
      state.activeTab = tabName;
      state.motion.enterType = customDirection || 'screen';
      renderAll();

      const contentEl = document.getElementById('appContent');
      if (contentEl) contentEl.scrollTop = 0;

      const navIcon = document.getElementById(`navIcon-${tabName}`);
      if (navIcon) {
        navIcon.classList.remove('animate-nav-bounce');
        void navIcon.offsetWidth;
        navIcon.classList.add('animate-nav-bounce');
      }
    }

    function renderAppContent() {
      const contentEl = document.getElementById('appContent');
      if (!contentEl) return;

      if (state.activeTab === 'home') contentEl.innerHTML = renderHomeScreen();
      else if (state.activeTab === 'benefits') contentEl.innerHTML = renderBenefitsScreen();
      else if (state.activeTab === 'shopping') contentEl.innerHTML = renderShoppingScreen();
      else if (state.activeTab === 'invest') {
        contentEl.innerHTML = renderInvestScreen();
        if (!state.invest.selectedStockId && state.motion.enterType === 'screen') {
          const sum = getInvestSummary();
          animateNumberEl('investTotalValueEl', Math.round(sum.totalValue * 0.94), sum.totalValue, formatWon, 420);
        }
      } else if (state.activeTab === 'all') contentEl.innerHTML = renderAllScreen();
      else if (state.activeTab === 'spending') contentEl.innerHTML = renderSpendingScreen();
      else if (state.activeTab === 'cards') contentEl.innerHTML = renderCardsScreen();
      else if (state.activeTab === 'transfer') contentEl.innerHTML = renderTransferScreen();
      else contentEl.innerHTML = renderSettingsScreen();
    }

    function updateNavigationStyles() {
      const dark = state.settings.darkMode;
      const body = document.getElementById('pageBody');
      const viewport = document.getElementById('appViewport');
      const fadeMask = document.getElementById('bottomFadeMask');
      const floatingNav = document.getElementById('floatingBottomNav');
      const activePill = document.getElementById('navActivePill');
      const xrayBar = document.getElementById('xrayMiniBar');

      if (body) body.className = `font-sans antialiased selection:bg-brand selection:text-white ${dark ? 'bg-[#09090B] text-[#F2F4F6]' : 'bg-[#E5E8EB] text-ink-primary'}`;
      if (viewport) viewport.className = `relative w-full max-w-[440px] mx-auto h-[100dvh] flex flex-col overflow-hidden transition-colors duration-300 ${dark ? 'bg-[#101012] sm:border-x sm:border-white/[0.06]' : 'bg-canvas sm:border-x sm:border-black/[0.06]'}`;
      if (fadeMask) fadeMask.className = `pointer-events-none absolute bottom-0 left-0 right-0 h-28 z-20 transition-opacity duration-300 ${dark ? 'bottom-fade-dark' : 'bottom-fade-light'}`;
      if (floatingNav) floatingNav.className = `absolute bottom-4 left-4 right-4 z-30 rounded-full p-1.5 transition-all duration-300 ease-toss ${dark ? 'glass-pill-dark shadow-capsule' : 'glass-pill-light shadow-capsule-light'}`;
      if (xrayBar) xrayBar.classList.toggle('hidden', !state.xrayMode);

      const activeIndex = MAIN_TABS.indexOf(state.activeTab);
      if (activePill) {
        if (activeIndex >= 0) {
          activePill.style.opacity = '1';
          activePill.style.transform = `translate3d(${activeIndex * 100}%, 0, 0)`;
          activePill.className = `pointer-events-none absolute top-0 bottom-0 left-0 w-1/5 rounded-full transition-all duration-300 ease-toss ${dark ? 'bg-white/[0.13]' : 'bg-ink-primary'}`;
        } else {
          activePill.style.opacity = '0';
        }
      }

      const iconMap = { home: ICONS.navHome, benefits: ICONS.navBenefits, shopping: ICONS.navShopping, invest: ICONS.navInvest, all: ICONS.navAll };
      const unreadMissions = state.benefits.missions.filter((m) => !m.done).length;
      const cartCount = getCartCount();

      MAIN_TABS.forEach((tab) => {
        const isActive = state.activeTab === tab;
        const navBtn = document.getElementById(`nav-${tab}`);
        const navIcon = document.getElementById(`navIcon-${tab}`);

        if (navBtn) {
          navBtn.className = 'relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer transition-colors duration-200 ' + (isActive ? 'text-white' : dark ? 'text-[#7E8691] hover:text-slate-200' : 'text-ink-muted hover:text-ink-primary');
        }
        if (navIcon) {
          let dotHtml = '';
          if (tab === 'benefits' && unreadMissions > 0 && !isActive) dotHtml = '<span class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full bg-brand"></span>';
          else if (tab === 'shopping' && cartCount > 0 && !isActive) dotHtml = '<span class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full bg-danger"></span>';
          navIcon.innerHTML = iconMap[tab](isActive) + dotHtml;
        }
      });
    }

    function startDealCountdown() {
      setInterval(() => {
        if (!state || !state.shopping) return;
        state.shopping.dealSecondsLeft = state.shopping.dealSecondsLeft > 0 ? state.shopping.dealSecondsLeft - 1 : 86400;
        const el = document.getElementById('dealCountdownTimer');
        if (el) el.textContent = `${formatCountdown(state.shopping.dealSecondsLeft)} 남음`;
      }, 1000);
    }

    function renderAll() {
      renderAppContent();
      updateNavigationStyles();
      updateNotifBadges();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      startRealtimeStockTicker();
      startDealCountdown();
    });
  </script>
</body>
</html>
