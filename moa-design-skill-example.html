<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모아(Moa) — 다크모드 핀테크 슈퍼앱 UX/UI 프로토타입</title>
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F2F4F6',
            'ink-primary': '#191F28',
            'ink-secondary': '#4E5968',
            'ink-muted': '#8B95A1',
            brand: '#3182F6',
            'brand-hover': '#1B64DA',
            'brand-soft': 'rgba(49, 130, 246, 0.14)',
            danger: '#F04452',
            'danger-soft': 'rgba(240, 68, 82, 0.14)',
            success: '#00C471',
            'success-soft': 'rgba(0, 196, 113, 0.14)',
            warning: '#FF9F0A',
            'warning-soft': 'rgba(255, 159, 10, 0.15)',
          },
          boxShadow: {
            card: '0 2px 14px rgba(0, 0, 0, 0.04)',
            'dark-card': '0 4px 20px rgba(0, 0, 0, 0.35)',
            capsule: '0 10px 30px rgba(0, 0, 0, 0.45)',
          },
          transitionTimingFunction: {
            toss: 'cubic-bezier(0.22, 1, 0.36, 1)',
            spring: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          },
          keyframes: {
            screenIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translateX(18px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translateX(-18px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            cardIn: {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.84)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            navPop: {
              '0%': { transform: 'scale(0.86)' },
              '60%': { transform: 'scale(1.12)' },
              '100%': { transform: 'scale(1)' },
            },
            drawLine: {
              '0%': { strokeDashoffset: '420' },
              '100%': { strokeDashoffset: '0' },
            },
            drawCheck: {
              '0%': { strokeDashoffset: '80' },
              '100%': { strokeDashoffset: '0' },
            },
            flashUp: {
              '0%': { backgroundColor: 'rgba(240, 68, 82, 0.22)' },
              '100%': { backgroundColor: 'transparent' },
            },
            flashDown: {
              '0%': { backgroundColor: 'rgba(49, 130, 246, 0.22)' },
              '100%': { backgroundColor: 'transparent' },
            },
            confettiBurst: {
              '0%': { opacity: '1', transform: 'translate(0, 0) scale(1)' },
              '100%': { opacity: '0', transform: 'translate(var(--tx), var(--ty)) scale(0.35) rotate(140deg)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%': { transform: 'translateX(-6px)' },
              '40%': { transform: 'translateX(6px)' },
              '60%': { transform: 'translateX(-4px)' },
              '80%': { transform: 'translateX(4px)' },
            },
          },
          animation: {
            'screen-in': 'screenIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-right': 'slideInRight 0.3s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-left': 'slideInLeft 0.3s cubic-bezier(0.22, 1, 0.36, 1) both',
            'card-in': 'cardIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) both',
            'pop-in': 'popIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both',
            'nav-pop': 'navPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1)',
            'draw-line': 'drawLine 0.72s cubic-bezier(0.22, 1, 0.36, 1) both',
            'draw-check': 'drawCheck 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both',
            'flash-up': 'flashUp 0.7s ease-out',
            'flash-down': 'flashDown 0.7s ease-out',
            'confetti': 'confettiBurst 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both',
            'shake': 'shake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both',
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #appContent::-webkit-scrollbar {
      width: 4px;
    }
    #appContent::-webkit-scrollbar-thumb {
      background: rgba(139, 149, 161, 0.25);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#0B0C0E] text-slate-100 font-sans antialiased selection:bg-brand selection:text-white min-h-screen">
  <!-- 상단 워크벤치 헤더 -->
  <header class="sticky top-0 z-30 border-b border-white/10 bg-[#0B0C0E]/90 backdrop-blur-xl">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#3182F6] to-[#1B64DA] flex items-center justify-center shadow-lg shadow-brand/25 font-black text-white text-base">
          M
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white">모아(Moa) 핀테크 슈퍼앱 프로토타입</h1>
            <span class="px-2 py-0.5 rounded-full bg-brand/20 text-[#66A3FF] text-[10px] font-bold border border-brand/30">SuperApp v2.0 · Dark-First</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">플로팅 캡슐 내비게이션 · 홈 · 혜택 · 쇼핑 · 증권 · 전체 + 소비 · 카드 · 송금 · 설정 통합</p>
        </div>
      </div>

      <!-- 상단 빠른 컨트롤 스위치 -->
      <div class="flex items-center gap-2 flex-wrap">
        <button
          id="headerDarkBtn"
          type="button"
          onclick="toggleSetting('darkMode', '다크 모드를 켰어요.', '라이트 모드로 전환했어요.')"
          class="px-3 py-1.5 rounded-xl bg-[#1C1C1F] hover:bg-[#252529] border border-white/10 text-xs font-bold text-slate-200 flex items-center gap-1.5 active:scale-95 transition-all cursor-pointer"
        >
          <span id="headerDarkIcon">🌙</span>
          <span id="headerDarkText">다크 모드 ON</span>
        </button>

        <button
          id="headerLargeBtn"
          type="button"
          onclick="toggleSetting('largeText', '큰 글씨 모드를 켰어요.', '기본 글씨 크기로 돌아왔어요.')"
          class="px-3 py-1.5 rounded-xl bg-[#1C1C1F] hover:bg-[#252529] border border-white/10 text-xs font-bold text-slate-200 flex items-center gap-1.5 active:scale-95 transition-all cursor-pointer"
        >
          <span>🔠</span>
          <span id="headerLargeText">큰 글씨</span>
        </button>

        <button
          id="headerXrayBtn"
          type="button"
          onclick="toggleXrayMode()"
          class="px-3 py-1.5 rounded-xl bg-amber-400/15 hover:bg-amber-400/25 border border-amber-400/40 text-xs font-bold text-amber-300 flex items-center gap-1.5 active:scale-95 transition-all cursor-pointer"
        >
          <span>🔬</span>
          <span id="headerXrayText">원칙 X-Ray ON</span>
        </button>

        <button
          type="button"
          onclick="openResetConfirmSheet()"
          class="px-3 py-1.5 rounded-xl bg-[#1C1C1F] hover:bg-[#252529] border border-white/10 text-xs font-semibold text-slate-400 hover:text-white active:scale-95 transition-all cursor-pointer"
        >
          초기화
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 2단 레이아웃 -->
  <main class="max-w-[1240px] mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
    <!-- [좌측] 실제 동작하는 모바일 슈퍼앱 프레임 -->
    <section class="lg:col-span-5 flex flex-col items-center">
      <!-- 빠른 화면 전환 가이드 칩 (5대 슈퍼앱 메인 탭 + 4대 핵심 금융 서브 화면) -->
      <div class="w-full max-w-[400px] mb-3.5 space-y-1.5 bg-[#16161A] p-2 rounded-[22px] border border-white/10 shadow-lg">
        <div class="flex items-center justify-between px-1">
          <span class="text-[10px] font-bold text-slate-400">슈퍼앱 5대 메인 탭 (플로팅 캡슐 바)</span>
          <span class="text-[10px] font-semibold text-brand">클릭해 즉시 이동</span>
        </div>
        <div class="grid grid-cols-5 gap-1">
          <button id="demoChip-home" type="button" onclick="switchTab('home')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">1. 홈</button>
          <button id="demoChip-benefits" type="button" onclick="switchTab('benefits')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">2. 혜택</button>
          <button id="demoChip-shopping" type="button" onclick="switchTab('shopping')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">3. 쇼핑</button>
          <button id="demoChip-invest" type="button" onclick="switchTab('invest')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">4. 증권</button>
          <button id="demoChip-all" type="button" onclick="switchTab('all')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">5. 전체</button>
        </div>
        <div class="pt-1 border-t border-white/5 flex items-center justify-between px-1">
          <span class="text-[10px] font-semibold text-slate-400">연결된 금융 서브 화면 (홈·전체 탭 연동)</span>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button id="demoChip-spending" type="button" onclick="switchTab('spending')" class="py-1.5 px-1 rounded-xl text-[11px] font-semibold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">소비·분석</button>
          <button id="demoChip-cards" type="button" onclick="switchTab('cards')" class="py-1.5 px-1 rounded-xl text-[11px] font-semibold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">내 카드</button>
          <button id="demoChip-transfer" type="button" onclick="switchTab('transfer')" class="py-1.5 px-1 rounded-xl text-[11px] font-semibold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">송금 퍼널</button>
          <button id="demoChip-settings" type="button" onclick="switchTab('settings')" class="py-1.5 px-1 rounded-xl text-[11px] font-semibold transition-all duration-200 ease-toss active:scale-95 cursor-pointer">설정</button>
        </div>
      </div>

      <!-- 모바일 앱 프레임 -->
      <div
        id="phoneFrame"
        class="relative w-full max-w-[400px] h-[790px] rounded-[46px] border-[8px] border-[#24262B] shadow-2xl overflow-hidden flex flex-col bg-[#101012] transition-colors duration-300"
      >
        <!-- 상단 상태 표시줄 (Status Bar) -->
        <div id="phoneStatusBar" class="px-6 pt-3 pb-1.5 flex items-center justify-between text-[11px] font-bold select-none shrink-0 z-20">
          <span class="[font-variant-numeric:tabular-nums]">9:41</span>
          <div class="w-20 h-4 rounded-full bg-black/80 border border-white/10 flex items-center justify-end px-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400/80 animate-pulse"></span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-extrabold">5G</span>
            <svg class="w-4 h-3" viewBox="0 0 20 12" fill="currentColor" aria-hidden="true">
              <rect x="0.5" y="1" width="16" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <rect x="2.5" y="3" width="12" height="6" rx="1" />
              <rect x="17.5" y="4" width="2" height="4" rx="1" />
            </svg>
          </div>
        </div>

        <!-- 스크롤 가능한 메인 화면 컨테이너 -->
        <div id="appContent" class="flex-1 overflow-y-auto overflow-x-hidden pb-28"></div>

        <!-- 플로팅 캡슐(Glassmorphic Pill) 하단 내비게이션 바 (홈 · 혜택 · 쇼핑 · 증권 · 전체) -->
        <nav
          id="floatingBottomNav"
          aria-label="하단 메인 내비게이션"
          class="absolute bottom-3.5 left-3.5 right-3.5 z-30 rounded-full p-1.5 backdrop-blur-xl shadow-capsule border transition-all duration-300 grid grid-cols-5 gap-1"
        >
          <!-- 1. 홈 -->
          <button
            id="nav-home"
            type="button"
            onclick="switchTab('home')"
            class="flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-full active:scale-90 transition-all duration-200 ease-toss cursor-pointer"
          >
            <svg id="navIcon-home" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10.5L12 3l9 7.5" />
              <path d="M5 9.5V19a1 1 0 0 0 1 1h4.5v-5.5h3V20H18a1 1 0 0 0 1-1V9.5" />
            </svg>
            <span class="text-[10px] font-bold">홈</span>
          </button>

          <!-- 2. 혜택 -->
          <button
            id="nav-benefits"
            type="button"
            onclick="switchTab('benefits')"
            class="flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-full active:scale-90 transition-all duration-200 ease-toss cursor-pointer relative"
          >
            <svg id="navIcon-benefits" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
            <span class="text-[10px] font-bold">혜택</span>
          </button>

          <!-- 3. 쇼핑 -->
          <button
            id="nav-shopping"
            type="button"
            onclick="switchTab('shopping')"
            class="flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-full active:scale-90 transition-all duration-200 ease-toss cursor-pointer relative"
          >
            <svg id="navIcon-shopping" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            <span class="text-[10px] font-bold">쇼핑</span>
          </button>

          <!-- 4. 증권 -->
          <button
            id="nav-invest"
            type="button"
            onclick="switchTab('invest')"
            class="flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-full active:scale-90 transition-all duration-200 ease-toss cursor-pointer"
          >
            <svg id="navIcon-invest" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
              <polyline points="16 7 22 7 22 13" />
            </svg>
            <span class="text-[10px] font-bold">증권</span>
          </button>

          <!-- 5. 전체 -->
          <button
            id="nav-all"
            type="button"
            onclick="switchTab('all')"
            class="flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-full active:scale-90 transition-all duration-200 ease-toss cursor-pointer"
          >
            <svg id="navIcon-all" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
            <span class="text-[10px] font-bold">전체</span>
          </button>
        </nav>

        <!-- 앱 내부 토스트 알림 (스프링 모션 비침투형 피드백) -->
        <div
          id="appToast"
          role="status"
          aria-live="polite"
          class="pointer-events-none absolute left-4 right-4 bottom-24 z-40 flex justify-center opacity-0 translate-y-4 scale-95 transition-all duration-300 ease-spring"
        >
          <div class="bg-[#252529]/95 border border-white/10 text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 max-w-full backdrop-blur-md">
            <span id="appToastIcon" class="w-2 h-2 rounded-full bg-success shrink-0"></span>
            <span id="appToastText" class="truncate">알림 메시지</span>
          </div>
        </div>

        <!-- 실시간 상단 푸시 알림 배너 (카드 결제 · 보안 경고 · 송금 · 체결 · 쇼핑 적립 시 스프링 다운) -->
        <button
          id="pushBanner"
          type="button"
          onclick="openNotifCenter()"
          aria-live="polite"
          class="absolute left-3.5 right-3.5 top-11 z-40 text-left rounded-[22px] p-3.5 shadow-2xl border opacity-0 -translate-y-6 pointer-events-none transition-all duration-300 ease-spring cursor-pointer bg-[#252529]/95 border-[#3A3A40] backdrop-blur-md"
        >
          <div class="flex items-start gap-3">
            <div id="pushBannerIcon" class="w-9 h-9 rounded-2xl bg-brand-soft text-brand flex items-center justify-center text-base shrink-0">🔔</div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <p id="pushBannerTitle" class="text-xs font-bold text-white truncate">모아 알림</p>
                <span class="text-[10px] font-semibold text-ink-muted shrink-0">방금 전</span>
              </div>
              <p id="pushBannerBody" class="text-[11px] text-slate-300 mt-0.5 line-clamp-2 leading-snug">알림 내용</p>
            </div>
          </div>
        </button>

        <!-- 슬라이드 인 알림함 오버레이 (Notification Center) -->
        <div
          id="notifOverlay"
          role="dialog"
          aria-modal="true"
          aria-label="알림함"
          class="absolute inset-0 z-40 translate-x-full transition-transform duration-300 ease-toss flex flex-col bg-[#101012] overflow-hidden"
        >
          <div id="notifOverlayContent" class="flex-1 flex flex-col h-full overflow-hidden"></div>
        </div>

        <!-- 앱 내부 바텀시트 오버레이 (충전 / 복권 / 쇼핑 결제 / 미니게임 / 주문 / 해지 시트 등) -->
        <div
          id="bottomSheetOverlay"
          class="pointer-events-none absolute inset-0 z-50 flex flex-col justify-end bg-black/60 opacity-0 transition-opacity duration-250"
          onclick="handleOverlayBackdropClick(event)"
        >
          <div
            id="bottomSheetPanel"
            role="dialog"
            aria-modal="true"
            class="w-full rounded-t-[30px] bg-[#1C1C1F] p-5 pb-7 shadow-2xl translate-y-full transition-transform duration-300 ease-toss max-h-[85%] overflow-y-auto"
          >
            <div class="w-10 h-1 rounded-full bg-slate-500/40 mx-auto mb-4"></div>
            <div id="bottomSheetBody"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- [우측] 원칙 X-Ray 설계 해설 & Before/After 인스펙터 패널 -->
    <section id="inspectorPanel" class="lg:col-span-7 space-y-4"></section>
  </main>

  <script>
    /**
     * ============================================================================
     * 1. 초기 상태 정의 (모아(Moa) 오리지널 가상 데이터 100% 적용 · 다크모드 기본값)
     * ============================================================================
     */
    function createInitialState() {
      return {
        activeTab: 'home', // 'home' | 'benefits' | 'shopping' | 'invest' | 'all' | 'spending' | 'cards' | 'transfer' | 'settings'
        previousMainTab: 'home',
        xrayMode: true,
        highlightedPrincipleId: null,
        privacyMode: false,
        balance: 1845000,

    /**
     * ============================================================================
     * 3. 공통 포맷 · 테마 · 바텀시트 · 클립보드 · 토스트 · 모션 유틸리티
     * ============================================================================
     */
    function t(lightCls, darkCls) {
      return state.settings.darkMode ? darkCls : lightCls;
    }

    function formatWon(num) {
      const n = Math.round(Number(num) || 0);
      return `${n.toLocaleString('ko-KR')}원`;
    }

    function displayMoney(num, withSign = false) {
      if (state.privacyMode) return '••••••원';
      const n = Math.round(Number(num) || 0);
      if (withSign) {
        if (n > 0) return `+${n.toLocaleString('ko-KR')}원`;
        if (n < 0) return `-${Math.abs(n).toLocaleString('ko-KR')}원`;
      }
      return `${n.toLocaleString('ko-KR')}원`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getMonthlySpent() {
      return state.transactions
        .filter((tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체')
        .reduce((sum, tx) => sum + Math.abs(tx.amount), 0);
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg || '복사했어요.', 'brand');
      } catch (err) {
        console.error('클립보드 복사 오류:', err);
        showToast('복사에 실패했어요. 직접 선택해 복사해 주세요.', 'danger');
      }
    }

    function copyAccountNumber(account) {
      copyText(account, `계좌번호(${account})를 복사했어요.`);
    }

    let toastTimer = null;
    function showToast(message, tone = 'success') {
      try {
        const toast = document.getElementById('appToast');
        const textEl = document.getElementById('appToastText');
        const iconEl = document.getElementById('appToastIcon');
        if (!toast || !textEl || !iconEl) return;

        textEl.textContent = message;
        const dotColor =
          tone === 'danger' ? 'bg-danger' : tone === 'brand' ? 'bg-brand' : 'bg-success';
        iconEl.className = `w-2 h-2 rounded-full ${dotColor} shrink-0`;

        toast.classList.remove('opacity-0', 'translate-y-4', 'scale-95');
        toast.classList.add('opacity-100', 'translate-y-0', 'scale-100');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-4', 'scale-95');
          toast.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
        }, 2500);
      } catch (err) {
        console.error('토스트 표시 중 오류:', err);
      }
    }

    /**
     * 바텀시트 열기 / 닫기 유틸리티
     */
    function openSheet(htmlContent) {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      const body = document.getElementById('bottomSheetBody');
      if (!overlay || !panel || !body) return;

      panel.className =
        'w-full rounded-t-[30px] p-5 pb-7 shadow-2xl translate-y-full transition-transform duration-300 ease-toss max-h-[85%] overflow-y-auto ' +
        t('bg-white text-ink-primary', 'bg-[#1C1C1F] text-[#F2F4F6] border-t border-white/10');

      body.innerHTML = htmlContent;
      overlay.classList.remove('pointer-events-none', 'opacity-0');
      overlay.classList.add('pointer-events-auto', 'opacity-100');

      requestAnimationFrame(() => {
        panel.classList.remove('translate-y-full');
        panel.classList.add('translate-y-0');
      });
    }

    function closeSheet() {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      if (!overlay || !panel) return;

      panel.classList.add('translate-y-full');
      panel.classList.remove('translate-y-0');
      overlay.classList.add('pointer-events-none', 'opacity-0');
      overlay.classList.remove('pointer-events-auto', 'opacity-100');
    }

    function handleOverlayBackdropClick(e) {
      if (e.target && e.target.id === 'bottomSheetOverlay') {
        closeSheet();
      }
    }

    /**
     * 모션 & X-Ray 핀 유틸리티
     */
    function screenMotionCls() {
      if (state.motion.enterType === 'forward') return 'animate-slide-right';
      if (state.motion.enterType === 'back') return 'animate-slide-left';
      if (state.motion.enterType === 'screen') return 'animate-screen-in';
      return '';
    }

    function cardMotionCls() {
      return state.motion.enterType === 'screen' ? 'animate-card-in' : '';
    }

    function cardMotionAttr(index) {
      if (state.motion.enterType !== 'screen') return '';
      return `style="animation-delay: ${index * 45}ms"`;
    }

    function animateNumberEl(elId, fromVal, toVal, formatter, duration = 420) {
      const el = document.getElementById(elId);
      if (!el || state.privacyMode) return;
      const start = performance.now();
      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(fromVal + (toVal - fromVal) * eased);
        const targetEl = document.getElementById(elId);
        if (!targetEl) return;
        targetEl.textContent = formatter(current);
        if (progress < 1) {
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);
    }

    function xrayPin(principleId, label) {
      if (!state.xrayMode) return '';
      return `
        <button
          type="button"
          onclick="event.stopPropagation(); highlightPrinciple('${principleId}')"
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-400/20 border border-amber-400/50 text-amber-300 text-[10px] font-bold hover:bg-amber-400/30 active:scale-95 transition-all cursor-pointer shrink-0"
          title="클릭하여 우측 X-Ray 설계 해설 보기"
        >
          <span>🔬</span>
          <span>${escapeHtml(label)}</span>
        </button>
      `;
    }

    function highlightPrinciple(principleId) {
      state.highlightedPrincipleId = principleId;
      renderInspector();
      const cardEl = document.getElementById(`xray-card-${principleId}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      showToast('우측 X-Ray 패널에서 설계 원칙을 하이라이트했어요.', 'brand');
    }

    function toggleXrayMode() {
      state.xrayMode = !state.xrayMode;
      state.motion.enterType = 'none';
      renderAll();
      showToast(
        state.xrayMode ? '원칙 X-Ray 배지를 켰어요.' : '원칙 X-Ray 배지를 숨겼어요.',
        'brand'
      );
    }

    /**
     * 서브 화면(소비·카드·송금·설정)에서 이전 메인 탭으로 돌아가는 상단 내비게이션 바
     */
    function renderSubScreenBackBar(label) {
      const prevLabels = {
        home: '홈',
        benefits: '혜택',
        shopping: '쇼핑',
        invest: '증권',
        all: '전체',
      };
      const targetTab = state.previousMainTab || 'home';
      const targetName = prevLabels[targetTab] || '홈';
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const pillCls = t('bg-white/90 hover:bg-white text-ink-secondary shadow-xs', 'bg-[#1C1C1F] hover:bg-[#252529] text-[#B0B8C1] border border-white/5');

      return `
        <div class="pt-1 pb-1 flex items-center justify-between">
          <button
            type="button"
            onclick="switchTab('${targetTab}', 'back')"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full ${pillCls} text-xs font-bold active:scale-95 transition-all cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span>${targetName}으로</span>
          </button>
          <span class="text-[11px] font-semibold text-ink-muted">${escapeHtml(label)}</span>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 4. 실시간 알림함 & 상단 푸시 배너 시스템
     * ============================================================================
     */
    let pushBannerTimer = null;

    function getUnreadNotifCount() {
      return state.notifications.filter((n) => !n.read).length;
    }

    function pushNotification({ category, icon, tone = 'brand', title, body, actionTab = 'home', settingKey = null }) {
      try {
        const newNotif = {
          id: Date.now() + Math.floor(Math.random() * 1000),
          category,
          icon,
          tone,
          title,
          body,
          time: '방금 전',
          read: false,
          actionTab,
        };
        state.notifications.unshift(newNotif);
        updateNotifBadges();

        const shouldShowBanner = !settingKey || state.settings[settingKey];
        if (shouldShowBanner && !state.notifOpen) {
          showPushBanner(newNotif);
        }
        if (state.notifOpen) {
          renderNotifCenter();
        }
      } catch (err) {
        console.error('알림 생성 오류:', err);
      }
    }

    function showPushBanner(notif) {
      const banner = document.getElementById('pushBanner');
      const iconEl = document.getElementById('pushBannerIcon');
      const titleEl = document.getElementById('pushBannerTitle');
      const bodyEl = document.getElementById('pushBannerBody');
      if (!banner || !iconEl || !titleEl || !bodyEl) return;

      const toneCls =
        notif.tone === 'danger'
          ? 'bg-danger-soft text-danger'
          : notif.tone === 'success'
            ? 'bg-success-soft text-success'
            : 'bg-brand-soft text-brand';

      banner.className =
        'absolute left-3.5 right-3.5 top-11 z-40 text-left rounded-[22px] p-3.5 shadow-2xl border transition-all duration-300 ease-spring cursor-pointer backdrop-blur-md ' +
        t('bg-white/95 border-slate-200/80', 'bg-[#252529]/95 border-[#3A3A40]');

      iconEl.className = `w-9 h-9 rounded-2xl ${toneCls} flex items-center justify-center text-base shrink-0`;
      iconEl.textContent = notif.icon;
      titleEl.className = `text-xs font-bold truncate ${t('text-ink-primary', 'text-[#F2F4F6]')}`;
      titleEl.textContent = notif.title;
      bodyEl.className = `text-[11px] mt-0.5 line-clamp-2 leading-snug ${t('text-ink-secondary', 'text-[#B0B8C1]')}`;
      bodyEl.textContent = notif.body;

      requestAnimationFrame(() => {
        banner.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
        banner.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
      });

      clearTimeout(pushBannerTimer);
      pushBannerTimer = setTimeout(() => {
        banner.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }, 3400);
    }

    function updateNotifBadges() {
      const unread = getUnreadNotifCount();
      document.querySelectorAll('[data-notif-badge]').forEach((el) => {
        if (unread > 0) {
          el.textContent = unread > 9 ? '9+' : String(unread);
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    function openNotifCenter() {
      state.notifOpen = true;
      const overlay = document.getElementById('notifOverlay');
      const banner = document.getElementById('pushBanner');
      if (banner) {
        banner.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }
      renderNotifCenter();
      if (overlay) {
        overlay.className =
          'absolute inset-0 z-40 translate-x-full transition-transform duration-300 ease-toss flex flex-col overflow-hidden ' +
          t('bg-canvas', 'bg-[#101012]');
        requestAnimationFrame(() => {
          overlay.classList.remove('translate-x-full');
          overlay.classList.add('translate-x-0');
        });
      }
    }

    function closeNotifCenter() {
      state.notifOpen = false;
      const overlay = document.getElementById('notifOverlay');
      if (overlay) {
        overlay.classList.add('translate-x-full');
        overlay.classList.remove('translate-x-0');
      }
      updateNotifBadges();
    }

    function setNotifFilter(cat) {
      state.notifFilter = cat;
      renderNotifCenter();
    }

    function markAllNotifsRead() {
      state.notifications.forEach((n) => {
        n.read = true;
      });
      renderNotifCenter();
      updateNotifBadges();
      showToast('모든 알림을 읽음으로 표시했어요.', 'brand');
    }

    function deleteNotification(id, e) {
      if (e) e.stopPropagation();
      state.notifications = state.notifications.filter((n) => n.id !== id);
      renderNotifCenter();
      updateNotifBadges();
    }

    function handleNotifClick(id) {
      const target = state.notifications.find((n) => n.id === id);
      if (!target) return;
      target.read = true;
      updateNotifBadges();
      closeNotifCenter();
      if (target.actionTab) {
        switchTab(target.actionTab);
      }

    function sendDemoCardAlert() {
      closeNotifCenter();
      setTimeout(() => {
        pushNotification({
          category: '카드·결제',

          tone: 'brand',
          title: '모아 데일리 체크카드 승인',
          body: '모아 로스터리 강남점에서 5,600원이 결제되었어요. (280원 캐시백 예정)',
          actionTab: 'cards',

    function renderNotifCenter() {
      const container = document.getElementById('notifOverlayContent');
      if (!container) return;

      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#B0B8C1]');

    function executeTopUp(amount) {
      const prev = state.balance;
      state.balance += amount;
      state.transactions.unshift({
        id: Date.now(),
        title: '모아 통장 채우기 (한빛은행)',
        category: '이체',
        amount,
        time: '방금 전',
        emoji: '💧',
        memo: '연결 계좌 즉시 충전',
      });
      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('homeBalanceValue', prev, state.balance, formatWon, 450);
      pushNotification({
        category: '주식·송금',
        icon: '💧',
        tone: 'brand',
        title: `모아 통장에 ${formatWon(amount)}을 채웠어요`,
        body: `현재 모아 입출금 통장 잔액은 ${formatWon(state.balance)}이에요.`,
        actionTab: 'home',
        settingKey: 'txAlert',
      });
    }

    function addQuickGoalSavings(goalId, amount = 10000) {
      const goal = state.goals.find((g) => g.id === goalId);
      if (!goal) return;
      if (state.balance < amount) {
        showToast('모아 통장 잔액이 부족해요.', 'danger');
        return;
      }
      if (goal.saved >= goal.target) {
        showToast('이미 목표 금액을 100% 달성했어요! 🎉', 'brand');
        return;
      }

      const prevBalance = state.balance;
      const actualAdd = Math.min(amount, goal.target - goal.saved);
      state.balance -= actualAdd;
      goal.saved += actualAdd;

      state.transactions.unshift({
        id: Date.now(),
        title: `모으기 (${goal.title})`,
        category: '저축',
        amount: -actualAdd,
        time: '방금 전',
        emoji: goal.emoji,
        memo: '원탭 저축',
      });

      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('homeBalanceValue', prevBalance, state.balance, formatWon, 420);

      const reached = goal.saved >= goal.target;
      if (reached) {
        pushNotification({
          category: '보안·예산',
          icon: '🎉',
          tone: 'success',
          title: `"${goal.title}" 목표를 달성했어요!`,
          body: `목표 금액 ${formatWon(goal.target)}을 모두 모았어요. 정말 대단해요!`,
          actionTab: 'home',
          settingKey: 'txAlert',
        });
      }
      showToast(
        reached
          ? `🎉 "${goal.title}" 목표를 달성했어요!`
          : `${goal.title}에 ${formatWon(actualAdd)}을 모았어요.`
      );
    }

    /**
     * ============================================================================
     * 6. 화면 2: 소비·분석 (`spending`)

    function setSpendingCategory(cat) {
      state.spendingFilter.category = cat;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function setSpendingQuery(val) {
      state.spendingFilter.query = val;
      state.motion.enterType = 'none';
      renderAppContent();
      const input = document.getElementById('spendingSearchInput');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function resetSpendingFilter() {
      state.spendingFilter.query = '';
      state.spendingFilter.category = '전체';
      state.motion.enterType = 'none';
      renderAppContent();
      showToast('필터를 초기화해 전체 내역을 보여드려요.', 'brand');
    }

    function openBudgetSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const softBtn = t('bg-canvas text-ink-secondary hover:bg-slate-200/70', 'bg-[#252529] text-[#D1D6DB]');
      openSheet(`
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-bold ${textPrimary}">한 달 목표 예산 설정</h3>
            <p class="text-xs text-ink-muted mt-1">예산의 80%에 도달하면 미리 알림을 보내드려요.</p>
          </div>
          <div class="text-center py-2">
            <p id="budgetPreviewText" class="text-3xl font-extrabold text-brand [font-variant-numeric:tabular-nums]">${formatWon(state.monthlyBudget)}</p>
            <p class="text-xs text-ink-muted mt-1 [font-variant-numeric:tabular-nums]">현재 11월 지출: ${formatWon(getMonthlySpent())}</p>

          <input
            id="budgetRangeSlider"
            type="range"
            min="200000"
            max="2000000"
            step="50000"
            value="${state.monthlyBudget}"
            oninput="updateBudgetPreview(this.value)"
            class="w-full accent-brand cursor-pointer"
          />
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setBudgetPreset(400000)" class="py-2 rounded-xl ${softBtn} text-xs font-semibold cursor-pointer">40만</button>
            <button type="button" onclick="setBudgetPreset(600000)" class="py-2 rounded-xl ${softBtn} text-xs font-semibold cursor-pointer">60만</button>
            <button type="button" onclick="setBudgetPreset(800000)" class="py-2 rounded-xl ${softBtn} text-xs font-semibold cursor-pointer">80만</button>
            <button type="button" onclick="setBudgetPreset(1200000)" class="py-2 rounded-xl ${softBtn} text-xs font-semibold cursor-pointer">120만</button>
          </div>
          <button type="button" onclick="saveMonthlyBudget()" class="w-full py-3.5 rounded-2xl bg-brand hover:bg-brand-hover text-white text-sm font-bold cursor-pointer">
            목표 예산 저장하기
          </button>
        </div>
      `);
    }

    function updateBudgetPreview(val) {
      const el = document.getElementById('budgetPreviewText');
      if (el) el.textContent = formatWon(parseInt(val, 10) || 500000);
    }

    function setBudgetPreset(val) {
      const slider = document.getElementById('budgetRangeSlider');
      if (slider) slider.value = val;
      updateBudgetPreview(val);
    }

    function saveMonthlyBudget() {
      const val = parseInt(document.getElementById('budgetRangeSlider')?.value || state.monthlyBudget, 10);
      state.monthlyBudget = val;
      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      showToast(`이번 달 목표 예산을 ${formatWon(val)}으로 바꿨어요.`, 'brand');
      checkBudgetAlertThreshold();
    }

    function openAddExpenseSheet() {
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const inputCls = t('bg-canvas border-slate-200 text-ink-primary', 'bg-[#252529] border-[#35353A] text-white');
      openSheet(`
        <div class="space-y-4">
          <h3 class="text-lg font-bold ${textPrimary}">+ 새로운 지출 기록하기</h3>
          <div class="space-y-3">
            <div>
              <label class="text-xs font-semibold text-ink-muted block mb-1">사용처</label>
              <input id="newExpTitle" type="text" placeholder="예: 모아 베이커리 성수" class="w-full px-3.5 py-2.5 rounded-2xl border text-sm ${inputCls}" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-semibold text-ink-muted block mb-1">카테고리</label>

                  <option value="식비">🥗 식비</option>

                </select>
              </div>

                <input id="newExpAmount" type="number" value="15000" step="1000" class="w-full px-3.5 py-2.5 rounded-2xl border text-sm font-bold [font-variant-numeric:tabular-nums] ${inputCls}" />
              </div>
            </div>
          </div>
          <button type="button" onclick="saveNewExpense()" class="w-full py-3.5 rounded-2xl bg-brand hover:bg-brand-hover text-white text-sm font-bold cursor-pointer">
            지출 내역 추가하기
          </button>
        </div>
      `);
    }

    function saveNewExpense() {
      const title = (document.getElementById('newExpTitle')?.value || '').trim() || '모아 베이커리';
      const category = document.getElementById('newExpCat')?.value || '식비';
      const amount = Math.max(500, parseInt(document.getElementById('newExpAmount')?.value || '15000', 10));
      const emojiMap = { 식비: '🥗', 카페: '☕', 쇼핑: '🛍️', 교통: '🚕', 생활: '🛒' };

      state.balance = Math.max(0, state.balance - amount);
      state.transactions.unshift({
        id: Date.now(),
        title,
        category,
        amount: -amount,
        time: '방금 전',
        emoji: emojiMap[category] || '💳',
        memo: '직접 기록한 지출',
      });

      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      showToast(`${title} ${formatWon(amount)} 지출을 기록했어요.`);
      checkBudgetAlertThreshold();
    }

    function renderSpendingScreen() {
      const large = state.settings.largeText;
      const cardCls = t('bg-white shadow-card', 'bg-[#1C1C1F]');
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#B0B8C1]');
      const cAnim = cardMotionCls();

      const expenseTxs = state.transactions.filter(
        (tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체'
      );
      const totalSpent = getMonthlySpent();
      const remainBudget = Math.max(0, state.monthlyBudget - totalSpent);
      const dailyGuide = Math.round(remainBudget / 8);

      // 카테고리 집계
      const catSums = {};
      expenseTxs.forEach((tx) => {
        catSums[tx.category] = (catSums[tx.category] || 0) + Math.abs(tx.amount);
      });
      const sortedCats = Object.entries(catSums).sort((a, b) => b[1] - a[1]);
      const topCat = sortedCats[0] || null;

      const catColors = {
        생활: 'bg-brand',
        식비: 'bg-emerald-500',
        쇼핑: 'bg-purple-500',
        교통: 'bg-amber-500',
        구독: 'bg-rose-500',
        카페: 'bg-sky-400',
      };

      const stackedBarHtml = sortedCats
        .map(([cat, amt]) => {
          const pct = totalSpent > 0 ? Math.max(5, Math.round((amt / totalSpent) * 100)) : 0;
          const color = catColors[cat] || 'bg-slate-400';
          return `<div class="h-full ${color} transition-all duration-500" style="width: ${pct}%" title="${escapeHtml(cat)} ${formatWon(amt)}"></div>`;
        })
        .join('');

      const legendHtml = sortedCats
        .map(([cat, amt]) => {
          const pct = totalSpent > 0 ? Math.round((amt / totalSpent) * 100) : 0;
          const color = catColors[cat] || 'bg-slate-400';
          return `
            <div class="flex items-center justify-between py-1 text-xs">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${color}"></span>
                <span class="font-semibold ${textPrimary}">${escapeHtml(cat)}</span>
                <span class="text-ink-muted">${pct}%</span>
              </div>
              <span class="font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">${displayMoney(amt)}</span>
            </div>
          `;
        })
        .join('');

      const categories = ['전체', '식비', '카페', '생활', '교통', '쇼핑', '구독'];
      const q = state.spendingFilter.query.trim().toLowerCase();
      const filteredTxs = state.transactions.filter((tx) => {
        const matchCat = state.spendingFilter.category === '전체' || tx.category === state.spendingFilter.category;
        const matchQuery =
          !q ||
          tx.title.toLowerCase().includes(q) ||
          tx.category.toLowerCase().includes(q) ||
          (tx.memo && tx.memo.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      const txListHtml =
        filteredTxs.length > 0
          ? filteredTxs
              .map(
                (tx) => `
                  <button
                    type="button"
                    onclick="openTxReceiptSheet(${tx.id})"
                    class="w-full py-3 flex items-center justify-between gap-3 text-left active:opacity-75 transition-opacity cursor-pointer"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} flex items-center justify-center text-base shrink-0">
                        ${tx.emoji}
                      </div>
                      <div class="min-w-0">
                        <p class="text-[13px] font-bold ${textPrimary} truncate">${escapeHtml(tx.title)}</p>
                        <p class="text-[11px] text-ink-muted truncate">${escapeHtml(tx.category)} · ${escapeHtml(tx.time)}${tx.memo ? ` · ${escapeHtml(tx.memo)}` : ''}</p>
                      </div>
                    </div>
                    <span class="text-[13px] font-bold ${tx.amount > 0 ? 'text-brand' : textPrimary} [font-variant-numeric:tabular-nums] shrink-0">
                      ${displayMoney(tx.amount, true)}
                    </span>
                  </button>
                `
              )
              .join('')
          : `
            <div class="py-10 text-center space-y-3">
              <div class="w-11 h-11 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} mx-auto flex items-center justify-center text-lg">🔍</div>
              <div>
                <p class="text-sm font-bold ${textPrimary}">찾으시는 내역이 없어요</p>
                <p class="text-xs text-ink-muted mt-0.5">검색어나 카테고리 필터를 초기화해 볼까요?</p>
              </div>
              <button
                type="button"
                onclick="resetSpendingFilter()"
                class="px-4 py-2 rounded-xl bg-brand-soft text-brand text-xs font-bold active:scale-95 transition-all cursor-pointer"
              >
                필터 초기화하고 전체 보기
              </button>
            </div>
          `;

      return `
        <div class="px-5 pt-2 pb-8 space-y-4 ${screenMotionCls()}">
          ${renderSubScreenBackBar('소비 · 예산 분석')}

          <div class="flex items-center justify-between">

            <div class="mt-4 space-y-0.5">

    /**
     * ============================================================================
     * 7. 화면 3: 증권·투자 (`invest`) — 실시간 시세 틱 · 스크러빙 차트 · 간편 매수/매도
     * ============================================================================
     */
    function getInvestSummary() {
      let totalValue = 0;
      let totalCost = 0;
      state.invest.stocks.forEach((s) => {
        if (s.shares > 0) {
          totalValue += s.price * s.shares;
          totalCost += s.avgPrice * s.shares;
        }
      });
      const profit = totalValue - totalCost;
      const profitRate = totalCost > 0 ? (profit / totalCost) * 100 : 0;
      return { totalValue, totalCost, profit, profitRate };
    }

    function setInvestSegment(seg) {
      state.invest.segment = seg;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function selectStockDetail(stockId) {
      state.invest.selectedStockId = stockId;
      state.invest.scrubPrice = null;
      state.invest.scrubLabel = null;
      state.motion.enterType = 'forward';
      renderAll();
    }

    function closeStockDetail() {
      state.invest.selectedStockId = null;
      state.invest.scrubPrice = null;
      state.invest.scrubLabel = null;
      state.motion.enterType = 'back';
      renderAll();
    }

    function setStockTimeframe(tf) {
      state.invest.timeframe = tf;
      state.invest.scrubPrice = null;
      state.motion.enterType = 'none';
      renderAppContent();
    }

    function toggleStockWatch(stockId, e) {
      if (e) e.stopPropagation();
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      stock.watched = !stock.watched;
      state.motion.enterType = 'none';
      renderAppContent();
      showToast(
        stock.watched ? `${stock.name}을 관심 종목에 담았어요.` : `${stock.name}을 관심 종목에서 뺐어요.`,
        'brand'
      );
    }

    function handleChartScrub(event, stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const svg = event.currentTarget;
      const rect = svg.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const idx = Math.min(stock.history.length - 1, Math.floor(ratio * stock.history.length));
      const priceVal = stock.history[idx];
      const priceEl = document.getElementById('stockDetailLivePrice');
      const labelEl = document.getElementById('stockScrubBadge');
      if (priceEl) priceEl.textContent = formatWon(priceVal);
      if (labelEl) {
        labelEl.textContent = `${state.invest.timeframe} 구간 #${idx + 1} 시점 가격 탐색 중`;
        labelEl.classList.remove('hidden');
      }
    }

    function clearChartScrub(stockId) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      const priceEl = document.getElementById('stockDetailLivePrice');
      const labelEl = document.getElementById('stockScrubBadge');
      if (priceEl) priceEl.textContent = formatWon(stock.price);
      if (labelEl) labelEl.classList.add('hidden');
    }

    let orderQtyState = 1;
    function openStockOrderSheet(stockId, side = 'buy') {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = 1;
      const isBuy = side === 'buy';
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');

      openSheet(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded-full ${isBuy ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand'} text-[11px] font-bold mb-1">
                ${isBuy ? '빠른 구매 주문' : '빠른 판매 주문'}
              </span>
              <h3 class="text-lg font-bold ${textPrimary}">${escapeHtml(stock.name)} ${isBuy ? '사기' : '팔기'}</h3>
            </div>
            <span class="text-sm font-bold ${textPrimary} [font-variant-numeric:tabular-nums]">1주 ${formatWon(stock.price)}</span>
          </div>

          <div class="p-4 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} flex items-center justify-between">
            <span class="text-xs font-semibold text-ink-muted">주문 수량</span>
            <div class="flex items-center gap-3">
              <button type="button" onclick="adjustOrderQty('${stock.id}', -1)" class="w-8 h-8 rounded-xl ${t('bg-white shadow-xs', 'bg-[#1C1C1F]')} font-bold cursor-pointer">-</button>
              <span id="orderQtyText" class="text-base font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">1주</span>
              <button type="button" onclick="adjustOrderQty('${stock.id}', 1)" class="w-8 h-8 rounded-xl ${t('bg-white shadow-xs', 'bg-[#1C1C1F]')} font-bold cursor-pointer">+</button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs px-1">
            <span class="text-ink-muted">${isBuy ? '주문 가능 모아 통장 잔액' : '현재 보유 수량'}</span>
            <strong class="${textPrimary} [font-variant-numeric:tabular-nums]">
              ${isBuy ? formatWon(state.balance) : `${stock.shares}주`}
            </strong>
          </div>

          <button
            id="orderSubmitBtn"
            type="button"
            onclick="executeStockOrder('${stock.id}', '${side}')"
            class="w-full py-3.5 rounded-2xl ${isBuy ? 'bg-danger hover:bg-rose-600' : 'bg-brand hover:bg-brand-hover'} text-white text-sm font-bold active:scale-[0.98] transition-all cursor-pointer [font-variant-numeric:tabular-nums]"
          >
            총 ${formatWon(stock.price)} ${isBuy ? '구매하기' : '판매하기'}
          </button>
        </div>
      `);
    }

    function adjustOrderQty(stockId, delta) {
      const stock = state.invest.stocks.find((s) => s.id === stockId);
      if (!stock) return;
      orderQtyState = Math.max(1, Math.min(50, orderQtyState + delta));
      const qtyEl = document.getElementById('orderQtyText');
      const btnEl = document.getElementById('orderSubmitBtn');
      if (qtyEl) qtyEl.textContent = `${orderQtyState}주`;
      if (btnEl) {
        const isBuy = btnEl.textContent.includes('구매');
        btnEl.textContent = `총 ${formatWon(stock.price * orderQtyState)} ${isBuy ? '구매하기' : '판매하기'}`;
      }
    }

    function executeStockOrder(stockId, side) {
      try {
        const stock = state.invest.stocks.find((s) => s.id === stockId);
        if (!stock) return;
        const qty = orderQtyState;
        const total = stock.price * qty;
        const isBuy = side === 'buy';

        if (isBuy) {
          if (state.balance < total) {
            showToast('모아 통장 잔액이 부족해요.', 'danger');
            return;
          }
          const prevCost = stock.avgPrice * stock.shares;
          stock.shares += qty;
          stock.avgPrice = Math.round((prevCost + total) / stock.shares);
          state.balance -= total;
        } else {
          if (stock.shares < qty) {
            showToast('보유한 주식 수량보다 많이 팔 수 없어요.', 'danger');
            return;
          }
          stock.shares -= qty;
          if (stock.shares === 0) stock.avgPrice = 0;
          state.balance += total;
        }

        state.transactions.unshift({
          id: Date.now(),
          title: `모아 증권 (${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'})`,
          category: '투자',
          amount: isBuy ? -total : total,
          time: '방금 전',
          emoji: isBuy ? '📈' : '💰',
          memo: `1주당 ${formatWon(stock.price)} 체결`,
        });

        closeSheet();
        state.motion.enterType = 'none';
        renderAll();
        pushNotification({
          category: '주식·송금',
          icon: isBuy ? '📈' : '💰',
          tone: isBuy ? 'danger' : 'brand',
          title: `${stock.name} ${qty}주 ${isBuy ? '구매' : '판매'} 체결`,
          body: `총 ${formatWon(total)}에 체결되었어요. (1주 ${formatWon(stock.price)})`,
          actionTab: 'invest',
          settingKey: 'stockAlert',
        });
      } catch (err) {
        console.error('주식 주문 처리 오류:', err);
        showToast('주문 처리 중 문제가 생겼어요.', 'danger');
      }
    }

    function renderSparklineSvg(history, isUp, width = 64, height = 26) {
      const min = Math.min(...history);
      const max = Math.max(...history);
      const range = Math.max(1, max - min);
      const pts = history
        .map((v, i) => {
          const x = ((i / (history.length - 1)) * (width - 4) + 2).toFixed(1);
          const y = (height - 3 - ((v - min) / range) * (height - 6)).toFixed(1);
          return `${x},${y}`;
        })
        .join(' ');
      const stroke = isUp ? '#F04452' : '#3182F6';
      return `
        <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="overflow-visible shrink-0">
          <polyline fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}" />
        </svg>
      `;
    }

    function renderInvestScreen() {
      const large = state.settings.largeText;
      const cardCls = t('bg-white shadow-card', 'bg-[#1C1C1F]');
      const textPrimary = t('text-ink-primary', 'text-[#F2F4F6]');
      const textSecondary = t('text-ink-secondary', 'text-[#B0B8C1]');
      const dividerCls = t('divide-slate-100', 'divide-[#2A2A2E]');
      const cAnim = cardMotionCls();

      // 종목 상세 화면이 선택된 경우
      if (state.invest.selectedStockId) {
        const stock = state.invest.stocks.find((s) => s.id === state.invest.selectedStockId) || state.invest.stocks[0];
        const diff = stock.price - stock.prevClose;
        const rate = (diff / stock.prevClose) * 100;
        const isUp = diff >= 0;
        const strokeColor = isUp ? '#F04452' : '#3182F6';

        const min = Math.min(...stock.history);
        const max = Math.max(...stock.history);
        const range = Math.max(1, max - min);
        const pts = stock.history
          .map((v, i) => {
            const x = ((i / (stock.history.length - 1)) * 300 + 10).toFixed(1);
            const y = (128 - ((v - min) / range) * 100).toFixed(1);
            return `${x},${y}`;
          })
          .join(' ');

        return `
          <div class="px-5 pt-2 pb-8 space-y-4 ${screenMotionCls()}">
            <div class="flex items-center justify-between">
              <button
                type="button"
                onclick="closeStockDetail()"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full ${t('bg-white text-ink-secondary shadow-xs', 'bg-[#1C1C1F] text-[#B0B8C1]')} text-xs font-bold active:scale-95 transition-all cursor-pointer"
              >
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                <span>증권 목록</span>
              </button>
              <button
                type="button"
                onclick="toggleStockWatch('${stock.id}', event)"
                class="px-3 py-1.5 rounded-full ${stock.watched ? 'bg-danger-soft text-danger' : t('bg-white text-ink-muted', 'bg-[#1C1C1F] text-ink-muted')} text-xs font-bold cursor-pointer"
              >
                ${stock.watched ? '♥ 관심 등록됨' : '♡ 관심 추가'}
              </button>
            </div>

            <div class="${cardCls} rounded-[26px] p-5 space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} flex items-center justify-center text-lg">${stock.emoji}</div>
                  <div>
                    <p class="text-[11px] font-bold text-ink-muted">${escapeHtml(stock.code)} · ${escapeHtml(stock.sector)}</p>
                    <h2 class="text-lg font-extrabold ${textPrimary}">${escapeHtml(stock.name)}</h2>
                  </div>
                </div>
                ${xrayPin('invest-scrub', '스크러빙 차트')}
              </div>

              <div>
                <p id="stockDetailLivePrice" class="text-[28px] font-extrabold ${textPrimary} [font-variant-numeric:tabular-nums]">
                  ${formatWon(stock.price)}
                </p>
                <p class="text-xs font-bold ${isUp ? 'text-danger' : 'text-brand'} [font-variant-numeric:tabular-nums]">
                  어제보다 ${isUp ? '+' : ''}${formatWon(diff)} (${isUp ? '+' : ''}${rate.toFixed(2)}%)
                </p>
                <p id="stockScrubBadge" class="hidden mt-1 text-[11px] font-bold text-amber-400"></p>
              </div>

              <!-- SVG 인터랙티브 스크러빙 차트 -->
              <div class="pt-2">
                <svg
                  viewBox="0 0 320 145"
                  class="w-full h-36 overflow-visible cursor-crosshair select-none"
                  onmousemove="handleChartScrub(event, '${stock.id}')"
                  ontouchmove="handleChartScrub(event, '${stock.id}')"
                  onmouseleave="clearChartScrub('${stock.id}')"
                  ontouchend="clearChartScrub('${stock.id}')"
                >
                  <line x1="10" y1="28" x2="310" y2="28" stroke="currentColor" class="text-slate-500/15" stroke-dasharray="3 3" />
                  <line x1="10" y1="78" x2="310" y2="78" stroke="currentColor" class="text-slate-500/15" stroke-dasharray="3 3" />
                  <line x1="10" y1="128" x2="310" y2="128" stroke="currentColor" class="text-slate-500/15" stroke-dasharray="3 3" />
                  <polyline
                    fill="none"
                    stroke="${strokeColor}"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    points="${pts}"
                    class="animate-draw-line"
                    style="stroke-dasharray: 420;"
                  />
                </svg>
                <p class="text-[10px] text-center text-ink-muted mt-1">차트 위를 마우스나 손가락으로 좌우 드래그해 시점별 가격을 확인해 보세요</p>
              </div>

              <!-- 기간 탭 -->
              <div class="grid grid-cols-4 gap-1.5 p-1 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')}">
                ${['1일', '1주', '1달', '1년']
                  .map(
                    (tf) => `
                      <button
                        type="button"
                        onclick="setStockTimeframe('${tf}')"
                        class="py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                          state.invest.timeframe === tf
                            ? t('bg-white text-ink-primary shadow-xs', 'bg-[#1C1C1F] text-white')
                            : 'text-ink-muted'
                        }"
                      >
                        ${tf}
                      </button>
                    `
                  )
                  .join('')}
              </div>

              <!-- 내 보유 현황 -->
              <div class="p-3.5 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} flex items-center justify-between text-xs">
                <div>
                  <span class="text-ink-muted">내 보유 수량</span>
                  <p class="text-sm font-bold ${textPrimary} mt-0.5 [font-variant-numeric:tabular-nums]">${stock.shares}주 ${stock.shares > 0 ? `(평단 ${formatWon(stock.avgPrice)})` : ''}</p>
                </div>
                <div class="text-right">
                  <span class="text-ink-muted">평가 금액</span>
                  <p class="text-sm font-extrabold ${textPrimary} mt-0.5 [font-variant-numeric:tabular-nums]">${formatWon(stock.price * stock.shares)}</p>
                </div>
              </div>

              <!-- 매도 / 매수 버튼 -->
              <div class="grid grid-cols-2 gap-2.5">
                <button
                  type="button"
                  onclick="openStockOrderSheet('${stock.id}', 'sell')"
                  class="py-3.5 rounded-2xl bg-brand-soft text-brand font-bold text-xs active:scale-95 transition-all cursor-pointer"
                >
                  판매하기
                </button>
                <button
                  type="button"
                  onclick="openStockOrderSheet('${stock.id}', 'buy')"
                  class="py-3.5 rounded-2xl bg-danger hover:bg-rose-600 text-white font-bold text-xs active:scale-95 transition-all cursor-pointer shadow-lg shadow-danger/25"
                >
                  구매하기
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const summary = getInvestSummary();
      const segIndex = state.invest.segment === 'my' ? 0 : state.invest.segment === 'popular' ? 1 : 2;
      const visibleStocks = state.invest.stocks.filter((s) => {
        if (state.invest.segment === 'my') return s.shares > 0;
        if (state.invest.segment === 'watch') return s.watched;
        return true;
      });

      const stockRowsHtml =
        visibleStocks.length > 0
          ? visibleStocks
              .map((s) => {
                const diff = s.price - s.prevClose;
                const rate = (diff / s.prevClose) * 100;
                const isUp = diff >= 0;
                return `
                  <div
                    onclick="selectStockDetail('${s.id}')"
                    role="button"
                    tabindex="0"
                    class="py-3.5 px-2 -mx-2 rounded-2xl flex items-center justify-between gap-2 cursor-pointer active:scale-[0.99] transition-all ${s.lastFlash}"
                  >
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 rounded-2xl ${t('bg-canvas', 'bg-[#252529]')} flex items-center justify-center text-base shrink-0">
                        ${s.emoji}
                      </div>
                      <div class="min-w-0">

    /**

    function startRealtimeStockTicker() {
      setInterval(() => {
        if (!state || !state.invest || !state.invest.stocks) return;
        const idx = Math.floor(Math.random() * state.invest.stocks.length);
        const target = state.invest.stocks[idx];
        const deltaPct = (Math.random() - 0.46) * 0.018;
        const rawDelta = Math.round((target.price * deltaPct) / 100) * 100;
        const delta = rawDelta === 0 ? (Math.random() > 0.5 ? 200 : -200) : rawDelta;

        target.price = Math.max(5000, target.price + delta);
        target.history.push(target.price);
        if (target.history.length > 14) target.history.shift();
        target.lastFlash = delta > 0 ? 'animate-flash-up' : 'animate-flash-down';

        if (state.activeTab === 'invest' && !state.invest.selectedStockId) {
          state.motion.enterType = 'none';
          renderAppContent();
        }
      }, 2800);
    }

    function executeCardTestPay(merchant, category, amount, emoji, isOverseas, isOnline) {
      const card = getActiveCard();
      closeSheet();

      if (card.locked) {
        triggerCardShake();
        pushNotification({
          category: '보안·예산',
          icon: '🚫',
          tone: 'danger',
          title: '잠긴 카드 결제를 안전하게 막았어요',
          body: `${merchant} (${formatWon(amount)}) 승인 시도가 카드 잠금 상태로 차단되었어요.`,
          actionTab: 'cards',
          settingKey: 'cardAlert',
        });
        showToast('카드가 잠겨 있어 결제를 차단했어요.', 'danger');
        return;
      }

      if (isOverseas && card.overseasBlocked) {
        triggerCardShake();
        pushNotification({
          category: '보안·예산',
          icon: '🛡️',
          tone: 'danger',
          title: '해외 결제가 자동으로 차단되었어요',
          body: `${merchant} (${formatWon(amount)}) 결제 시도 — 해외 결제 차단 설정이 켜져 있어요.`,
          actionTab: 'cards',
          settingKey: 'cardAlert',
        });
        showToast('해외 결제 차단 설정으로 막았어요.', 'danger');
        return;
      }

      if (isOnline && !card.onlineAllowed) {
        triggerCardShake();
        pushNotification({
          category: '보안·예산',
          icon: '🛡️',
          tone: 'danger',
          title: '온라인 결제가 차단되었어요',
          body: `${merchant} (${formatWon(amount)}) — 온라인 결제 허용이 꺼져 있어요.`,
          actionTab: 'cards',
          settingKey: 'cardAlert',
        });
        showToast('온라인 결제가 꺼져 있어 차단했어요.', 'danger');
        return;
      }

      if (card.monthlySpent + amount > card.monthlyLimit) {
        triggerCardShake();
        pushNotification({
          category: '보안·예산',
          icon: '⚠️',
          tone: 'danger',
          title: '월 이용 한도를 초과해 차단되었어요',
          body: `${merchant} (${formatWon(amount)}) — 남은 한도는 ${formatWon(Math.max(0, card.monthlyLimit - card.monthlySpent))}이에요.`,
          actionTab: 'cards',
          settingKey: 'cardAlert',
        });
        showToast('설정한 월 카드 한도를 초과했어요.', 'danger');
        return;
      }

      if (card.type === '체크' && state.balance < amount) {
        showToast('연결된 모아 통장 잔액이 부족해요.', 'danger');
        return;
      }

      if (card.type === '체크') {
        state.balance -= amount;
      }
      card.monthlySpent += amount;
      const cashback = category === '카페' ? Math.round(amount * 0.05) : Math.round(amount * 0.01);
      card.cashbackEarned += cashback;

      state.transactions.unshift({
        id: Date.now(),
        title: merchant,
        category,
        amount: -amount,
        time: '방금 전',
        emoji,
        memo: `${card.name} 결제`,
      });

      state.motion.enterType = 'none';
      renderAll();

      pushNotification({
        category: '카드·결제',
        icon: emoji,
        tone: 'brand',
        title: `${card.name} 승인 (${formatWon(amount)})`,
        body: `${merchant}에서 결제되었어요. 예상 캐시백 +${formatWon(cashback)}`,
        actionTab: 'cards',
        settingKey: 'cardAlert',
      });

      checkBudgetAlertThreshold();
    }

    function triggerCardShake() {
      const cardEl = document.getElementById('activeCardVisual');
      if (!cardEl) return;
      cardEl.classList.remove('animate-shake');
      void cardEl.offsetWidth;
      cardEl.classList.add('animate-shake');

      const spent = getMonthlySpent();

            actionTab: 'spending',
            settingKey: 'budgetAlert',

        }, 700);
      }
    }
