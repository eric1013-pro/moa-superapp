<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>모아(Moa)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F2F4F6',
            'ink-primary': '#191F28',
            'ink-secondary': '#4E5968',
            'ink-muted': '#8B95A1',
            brand: '#3182F6',
            'brand-hover': '#1B64DA',
            'brand-soft': 'rgba(49, 130, 246, 0.14)',
            danger: '#F04452',
            'danger-soft': 'rgba(240, 68, 82, 0.14)',
            success: '#00C471',
            'success-soft': 'rgba(0, 196, 113, 0.14)',
            warning: '#FF9F0A',
          },
          boxShadow: {
            card: '0 2px 12px rgba(0, 0, 0, 0.04)',
            capsule: '0 14px 36px rgba(0, 0, 0, 0.52), 0 2px 10px rgba(0, 0, 0, 0.3)',
            'capsule-light': '0 12px 30px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06)',
          },
          transitionTimingFunction: {
            toss: 'cubic-bezier(0.22, 1, 0.36, 1)',
            spring: 'cubic-bezier(0.32, 1.38, 0.52, 1)',
            sheet: 'cubic-bezier(0.18, 0.98, 0.32, 1)',
          },
          keyframes: {
            screenIn: {
              '0%': { opacity: '0', transform: 'translate3d(0, 9px, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translate3d(26px, 0, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translate3d(-26px, 0, 0)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0)' },
            },
            cardIn: {
              '0%': { opacity: '0', transform: 'translate3d(0, 12px, 0) scale(0.986)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.75)' },
              '65%': { opacity: '1', transform: 'scale(1.06)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            digitPop: {
              '0%': { transform: 'scale(0.96)' },
              '55%': { transform: 'scale(1.035)' },
              '100%': { transform: 'scale(1)' },
            },
            navBounce: {
              '0%': { transform: 'scale(0.84)' },
              '55%': { transform: 'scale(1.13)' },
              '100%': { transform: 'scale(1)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translate3d(0, 0px, 0)' },
              '50%': { transform: 'translate3d(0, -6px, 0)' },
            },
            rewardFloat: {
              '0%': { opacity: '0', transform: 'translate3d(-50%, 16px, 0) scale(0.82)' },
              '22%': { opacity: '1', transform: 'translate3d(-50%, -6px, 0) scale(1.05)' },
              '75%': { opacity: '1', transform: 'translate3d(-50%, -26px, 0) scale(1)' },
              '100%': { opacity: '0', transform: 'translate3d(-50%, -44px, 0) scale(0.92)' },
            },
            drawLine: {
              '0%': { strokeDashoffset: '560' },
              '100%': { strokeDashoffset: '0' },
            },
            drawCheck: {
              '0%': { strokeDashoffset: '80' },
              '100%': { strokeDashoffset: '0' },
            },
            drawArc: {
              '0%': { strokeDashoffset: '252' },
              '100%': { strokeDashoffset: 'var(--arc-offset)' },
            },
            flashUp: {
              '0%': { backgroundColor: 'rgba(240, 68, 82, 0.18)' },
              '100%': { backgroundColor: 'transparent' },
            },
            flashDown: {
              '0%': { backgroundColor: 'rgba(49, 130, 246, 0.18)' },
              '100%': { backgroundColor: 'transparent' },
            },
            confettiBurst: {
              '0%': { opacity: '1', transform: 'translate(0, 0) scale(1)' },
              '100%': { opacity: '0', transform: 'translate(var(--tx), var(--ty)) scale(0.28) rotate(170deg)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '18%': { transform: 'translateX(-6px)' },
              '36%': { transform: 'translateX(6px)' },
              '54%': { transform: 'translateX(-4px)' },
              '72%': { transform: 'translateX(4px)' },
            },
            sonarRing: {
              '0%': { transform: 'scale(0.45)', opacity: '0.85' },
              '100%': { transform: 'scale(1.48)', opacity: '0' },
            },
            shimmerSweep: {
              '0%': { transform: 'translateX(-130%) skewX(-20deg)' },
              '100%': { transform: 'translateX(230%) skewX(-20deg)' },
            },
            carouselInNext: {
              '0%': { opacity: '0.45', transform: 'translate3d(20px, 0, 0) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
            carouselInPrev: {
              '0%': { opacity: '0.45', transform: 'translate3d(-20px, 0, 0) scale(0.985)' },
              '100%': { opacity: '1', transform: 'translate3d(0, 0, 0) scale(1)' },
            },
          },
          animation: {
            'screen-in': 'screenIn 0.27s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-right': 'slideInRight 0.31s cubic-bezier(0.22, 1, 0.36, 1) both',
            'slide-left': 'slideInLeft 0.31s cubic-bezier(0.22, 1, 0.36, 1) both',
            'card-in': 'cardIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both',
            'pop-in': 'popIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both',
            'digit-pop': 'digitPop 0.2s cubic-bezier(0.22, 1, 0.36, 1)',
            'nav-bounce': 'navBounce 0.36s cubic-bezier(0.32, 1.38, 0.52, 1)',
            'float-slow': 'floatSlow 3.4s ease-in-out infinite',
            'reward-float': 'rewardFloat 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards',
            'draw-line': 'drawLine 0.76s cubic-bezier(0.22, 1, 0.36, 1) both',
            'draw-check': 'drawCheck 0.42s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both',
            'draw-arc': 'drawArc 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards',
            'flash-up': 'flashUp 0.75s ease-out',
            'flash-down': 'flashDown 0.75s ease-out',
            'confetti': 'confettiBurst 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both',
            'shake': 'shake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both',
            'sonar': 'sonarRing 1.85s cubic-bezier(0.22, 1, 0.36, 1) infinite',
            'shimmer': 'shimmerSweep 2.9s ease-in-out infinite',
            'carousel-next': 'carouselInNext 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
            'carousel-prev': 'carouselInPrev 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #appContent {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    #appContent::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
    /* 네이티브 핀테크 촉각 누름 모션 */
    .tap-card {
      transition: transform 0.17s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.16s ease, opacity 0.16s ease;
    }
    .tap-card:active {
      transform: scale(0.978);
    }
    .tap-btn {
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.14s ease, opacity 0.14s ease;
    }
    .tap-btn:active {
      transform: scale(0.935);
    }
    .tap-row {
      transition: background-color 0.15s ease, transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tap-row:active {
      transform: scale(0.985);
    }
    /* 다크모드 계층형 서피스 */
    .dark-surface {
      background-color: #17171C;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.038);
    }
    .dark-subsurface {
      background-color: #23232A;
    }
    .sticky-header-dark {
      background: rgba(16, 16, 18, 0.82);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
    }
    .sticky-header-light {
      background: rgba(242, 244, 246, 0.84);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
    }
    .banner-collapsing {
      opacity: 0 !important;
      transform: scale(0.94) translateY(-6px) !important;
      max-height: 0 !important;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      overflow: hidden !important;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
    .bottom-fade-dark {
      background: linear-gradient(to top, #101012 24%, rgba(16, 16, 18, 0.86) 62%, rgba(16, 16, 18, 0) 100%);
    }
    .bottom-fade-light {
      background: linear-gradient(to top, #F2F4F6 24%, rgba(242, 244, 246, 0.86) 62%, rgba(242, 244, 246, 0) 100%);
    }
    .glass-pill-dark {
      background: rgba(26, 26, 32, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
    }
    .glass-pill-light {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
    }
    /* 토스 스타일 콤팩트 액션 필 버튼 */
    .toss-pill-dark {
      background-color: #2B2B34;
      color: #D5DAE0;
    }
    .toss-pill-dark:hover {
      background-color: #34343F;
    }
    .toss-pill-light {
      background-color: #F2F4F6;
      color: #4E5968;
    }
    .toss-pill-light:hover {
      background-color: #E5E8EB;
    }
  </style>
</head>
<body id="pageBody" class="bg-[#09090B] text-[#F2F4F6] font-sans antialiased selection:bg-brand selection:text-white">
  <!-- 순수 풀뷰포트 앱 컨테이너 (스마트폰 프레임·다이나믹 바·통신바 없음) -->
  <div
    id="appViewport"
    class="relative w-full max-w-[440px] mx-auto h-[100dvh] flex flex-col overflow-hidden bg-[#101012] sm:border-x sm:border-white/[0.06] transition-colors duration-300"
  >
    <!-- X-Ray 모드가 켜졌을 때만 표시되는 슬림 가이드 바 -->
    <div id="xrayMiniBar" class="hidden shrink-0 px-4 py-2 bg-amber-400/12 border-b border-amber-400/25 flex items-center justify-between gap-2 z-30 animate-screen-in">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
        <span class="text-[11px] font-bold text-amber-300 truncate">원칙 X-Ray 켜짐 · 화면 배지를 눌러 해설 보기</span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="openXraySheet()" class="px-2.5 py-1 rounded-full bg-amber-400 text-[#101012] text-[10px] font-extrabold tap-btn cursor-pointer">해설 보기</button>
        <button type="button" onclick="toggleXrayMode()" class="px-2 py-1 rounded-full bg-white/10 text-slate-300 text-[10px] font-bold tap-btn cursor-pointer">끄기</button>
      </div>
    </div>

    <!-- 메인 스크롤 컨텐츠 -->
    <main id="appContent" class="flex-1 overflow-y-auto overflow-x-hidden pb-28"></main>

    <!-- 플로팅 리워드 팝업 레이어 (+142원, +20원 등) -->
    <div id="floatingRewardLayer" class="pointer-events-none absolute inset-0 z-50 overflow-hidden"></div>

    <!-- 플로팅 캡슐 하단 스크롤 페이드 마스크 -->
    <div id="bottomFadeMask" class="pointer-events-none absolute bottom-0 left-0 right-0 h-28 z-20 bottom-fade-dark transition-opacity duration-300"></div>

    <!-- 플로팅 캡슐(Glassmorphic Pill) 하단 내비게이션 바 -->
    <nav
      id="floatingBottomNav"
      aria-label="하단 메인 내비게이션"
      class="absolute bottom-4 left-4 right-4 z-30 rounded-full p-1.5 glass-pill-dark shadow-capsule transition-all duration-300 ease-toss"
    >
      <div class="relative grid grid-cols-5 items-center">
        <!-- GPU 가속 슬라이딩 하이라이트 알약 -->
        <div
          id="navActivePill"
          class="pointer-events-none absolute top-0 bottom-0 left-0 w-1/5 rounded-full bg-white/[0.13] transition-all duration-300 ease-toss"
          style="transform: translate3d(0%, 0, 0);"
        ></div>

        <button id="nav-home" type="button" onclick="switchTab('home')" class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer">
          <span id="navIcon-home" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">홈</span>
        </button>

        <button id="nav-benefits" type="button" onclick="switchTab('benefits')" class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer">
          <span id="navIcon-benefits" class="flex items-center justify-center relative"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">혜택</span>
        </button>

        <button id="nav-shopping" type="button" onclick="switchTab('shopping')" class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer">
          <span id="navIcon-shopping" class="flex items-center justify-center relative"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">쇼핑</span>
        </button>

        <button id="nav-invest" type="button" onclick="switchTab('invest')" class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer">
          <span id="navIcon-invest" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">증권</span>
        </button>

        <button id="nav-all" type="button" onclick="switchTab('all')" class="relative z-10 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full tap-btn cursor-pointer">
          <span id="navIcon-all" class="flex items-center justify-center"></span>
          <span class="text-[10px] font-bold tracking-[-0.01em]">전체</span>
        </button>
      </div>
    </nav>

    <!-- 스프링 토스트 피드백 -->
    <div
      id="appToast"
      role="status"
      aria-live="polite"
      class="pointer-events-none absolute left-5 right-5 bottom-24 z-40 flex justify-center opacity-0 translate-y-4 scale-95 transition-all duration-300 ease-spring"
    >
      <div id="appToastBox" class="bg-[#27272F]/95 border border-white/10 text-white text-[13px] font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 max-w-full backdrop-blur-xl">
        <span id="appToastIcon" class="w-2 h-2 rounded-full bg-success shrink-0"></span>
        <span id="appToastText" class="truncate">알림 메시지</span>
      </div>
    </div>

    <!-- 실시간 상단 푸시 알림 배너 -->
    <button
      id="pushBanner"
      type="button"
      onclick="openNotifCenter()"
      aria-live="polite"
      class="absolute left-4 right-4 top-3.5 z-50 text-left rounded-[22px] p-3.5 shadow-2xl border opacity-0 -translate-y-7 pointer-events-none transition-all duration-350 ease-spring cursor-pointer bg-[#23232A]/95 border-white/12 backdrop-blur-xl"
    >
      <div class="flex items-start gap-3">
        <div id="pushBannerIcon" class="w-10 h-10 rounded-2xl bg-brand-soft text-brand flex items-center justify-center shrink-0"></div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <p id="pushBannerTitle" class="text-[13px] font-bold text-white truncate">모아 알림</p>
            <span class="text-[10px] font-semibold text-ink-muted shrink-0">방금 전</span>
          </div>
          <p id="pushBannerBody" class="text-[12px] text-slate-300 mt-0.5 line-clamp-2 leading-snug">알림 내용</p>
        </div>
      </div>
    </button>

    <!-- 슬라이드 인 알림함 -->
    <div
      id="notifOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="알림함"
      class="absolute inset-0 z-50 translate-x-full transition-transform duration-320 ease-toss flex flex-col bg-[#101012] overflow-hidden"
    >
      <div id="notifOverlayContent" class="flex-1 flex flex-col h-full overflow-hidden"></div>
    </div>

    <!-- 드래그-투-클로즈 지원 바텀시트 오버레이 -->
    <div
      id="bottomSheetOverlay"
      class="pointer-events-none absolute inset-0 z-50 flex flex-col justify-end bg-black/55 backdrop-blur-[2px] opacity-0 transition-opacity duration-250"
      onclick="handleOverlayBackdropClick(event)"
    >
      <div
        id="bottomSheetPanel"
        role="dialog"
        aria-modal="true"
        class="w-full rounded-t-[28px] bg-[#1C1C21] p-5 pb-8 shadow-2xl translate-y-full transition-transform duration-350 ease-sheet max-h-[86%] overflow-y-auto no-scrollbar"
      >
        <div
          id="bottomSheetHandle"
          ontouchstart="handleSheetDragStart(event)"
          ontouchmove="handleSheetDragMove(event)"
          ontouchend="handleSheetDragEnd(event)"
          class="w-full py-2 -mt-2 mb-3 flex justify-center cursor-grab active:cursor-grabbing touch-none"
        >
          <div class="w-10 h-1 rounded-full bg-slate-400/35"></div>
        </div>
        <div id="bottomSheetBody"></div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. 인라인 SVG 아이콘 & 오리지널 상품 아트워크 라이브러리
     * ============================================================================
     */
    const ICONS = {
      navHome: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M11.35 3.24a1.1 1.1 0 0 1 1.3 0l8 6.08c.22.17.35.43.35.71V19a2 2 0 0 1-2 2h-4.5a1 1 0 0 1-1-1v-4.25a1.5 1.5 0 0 0-3 0V20a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2v-8.97c0-.28.13-.54.35-.71l8-6.08Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3.5l9 7"/><path d="M5 9.5V19a1.5 1.5 0 0 0 1.5 1.5H10v-5a2 2 0 0 1 4 0v5h3.5A1.5 1.5 0 0 0 19 19V9.5"/></svg>`,
      navBenefits: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25 14.95 8.1l6.45.98-4.65 4.58 1.08 6.44L12 17.08 6.17 20.1l1.08-6.44L2.6 9.08l6.45-.98L12 2.25Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2.8 14.9 8.5 21.2 9.45 16.6 13.9 17.7 20.2 12 17.2 6.3 20.2 7.4 13.9 2.8 9.45 9.1 8.5 12 2.8"/></svg>`,
      navShopping: (active) => active
        ? `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6V5a5 5 0 0 1 10 0v1h2.2a1.8 1.8 0 0 1 1.79 1.63l1 11A2.5 2.5 0 0 1 19.5 21.5h-15A2.5 2.5 0 0 1 2.01 18.63l1-11A1.8 1.8 0 0 1 4.8 6H7Zm2 0h6V5a3 3 0 0 0-6 0v1Zm1 4.5a1 1 0 1 0-2 0 4 4 0 0 0 8 0 1 1 0 1 0-2 0 2 2 0 0 1-4 0Z"/></svg>`
        : `<svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.2 12.2A2 2 0 0 1 17.21 21H6.79a2 2 0 0 1-1.99-1.8L6 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>`,

    }

    function formatWon(num) {
      const n = Math.round(Number(num) || 0);
      return `${n.toLocaleString('ko-KR')}원`;
    }

    /**
     * 토스 스타일 실시간 한글 금액 읽기 (예: 50000 -> "오만 원", 1845000 -> "백팔십사만 오천 원")
     */
    function formatKoreanWonText(num) {
      const n = Math.floor(Number(num) || 0);
      if (n <= 0) return '';
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const smallUnits = ['', '십', '백', '천'];
      const bigUnits = ['', '만', '억'];

      function readChunk(chunk) {
        let str = '';
        const s = String(chunk).padStart(4, '0');
        for (let i = 0; i < 4; i++) {
          const d = parseInt(s[i], 10);
          if (d === 0) continue;
          const unitIdx = 3 - i;
          if (d === 1 && unitIdx > 0) str += smallUnits[unitIdx];
          else str += digits[d] + smallUnits[unitIdx];
        }
        return str;
      }

      const parts = [];
      let rem = n;
      let bigIdx = 0;
      while (rem > 0 && bigIdx < bigUnits.length) {
        const chunk = rem % 10000;
        if (chunk > 0) {
          const chunkText = readChunk(chunk);
          parts.unshift(chunkText + bigUnits[bigIdx]);
        }
        rem = Math.floor(rem / 10000);
        bigIdx++;
      }
      return parts.join(' ') + ' 원';
    }

    function displayMoney(num, withSign = false) {
      if (state.privacyMode) return '••••••원';
      const n = Math.round(Number(num) || 0);
      if (withSign) {
        if (n > 0) return `+${n.toLocaleString('ko-KR')}원`;
        if (n < 0) return `-${Math.abs(n).toLocaleString('ko-KR')}원`;
      }
      return `${n.toLocaleString('ko-KR')}원`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getIcon(key, fallbackKey = 'spark') {
      return ICONS[key] || ICONS[fallbackKey] || '';
    }

    function getMonthlySpent() {
      return state.transactions
        .filter((tx) => tx.amount < 0 && tx.category !== '저축' && tx.category !== '투자' && tx.category !== '이체')
        .reduce((sum, tx) => sum + Math.abs(tx.amount), 0);
    }

    function getTotalGoalSaved() {
      return state.goals.reduce((sum, g) => sum + g.saved, 0);
    }

    function formatCountdown(totalSec) {
      const s = Math.max(0, totalSec);
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg || '복사했어요.', 'brand');
      } catch (err) {
        showToast('복사에 실패했어요.', 'danger');
      }
    }

    function copyAccountNumber(account) {
      copyText(account, `계좌번호(${account})를 복사했어요.`);
    }

    /**
     * 플로팅 리워드 팝업 (+142원, +20원 등 위로 부드럽게 떠오르는 보상 연출)
     */
    function spawnFloatingReward(label, tone = 'brand') {
      const layer = document.getElementById('floatingRewardLayer');
      if (!layer) return;
      const el = document.createElement('div');
      const colorCls =
        tone === 'success'
          ? 'bg-emerald-500 text-white shadow-emerald-500/35'
          : 'bg-brand text-white shadow-brand/35';
      el.className = `absolute left-1/2 top-[34%] px-4 py-2 rounded-full font-extrabold text-sm shadow-xl ${colorCls} animate-reward-float [font-variant-numeric:tabular-nums]`;
      el.textContent = label;
      layer.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1300);
    }

    let toastTimer = null;
    function showToast(message, tone = 'success') {
      const toast = document.getElementById('appToast');
      const box = document.getElementById('appToastBox');
      const textEl = document.getElementById('appToastText');
      const iconEl = document.getElementById('appToastIcon');
      if (!toast || !textEl || !iconEl || !box) return;

      box.className =
        'text-[13px] font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 max-w-full backdrop-blur-xl border ' +
        t('bg-[#191F28]/92 border-black/10 text-white', 'bg-[#282830]/95 border-white/10 text-white');

      textEl.textContent = message;
      const dotColor = tone === 'danger' ? 'bg-danger' : tone === 'brand' ? 'bg-brand' : 'bg-success';
      iconEl.className = `w-2 h-2 rounded-full ${dotColor} shrink-0`;

      toast.classList.remove('opacity-0', 'translate-y-4', 'scale-95');
      toast.classList.add('opacity-100', 'translate-y-0', 'scale-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'scale-95');
        toast.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
      }, 2400);
    }

    /**
     * 바텀시트 열기 · 닫기 · 터치 드래그-투-클로즈 제스처
     */
    let sheetDragStartY = 0;
    let sheetDragDeltaY = 0;

    function handleSheetDragStart(e) {
      sheetDragStartY = e.touches ? e.touches[0].clientY : e.clientY;
      sheetDragDeltaY = 0;
      const panel = document.getElementById('bottomSheetPanel');
      if (panel) panel.style.transition = 'none';
    }

    function handleSheetDragMove(e) {
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;
      sheetDragDeltaY = Math.max(0, currentY - sheetDragStartY);
      const panel = document.getElementById('bottomSheetPanel');
      if (panel) panel.style.transform = `translate3d(0, ${sheetDragDeltaY}px, 0)`;
    }

    function handleSheetDragEnd() {
      const panel = document.getElementById('bottomSheetPanel');
      if (panel) panel.style.transition = '';
      if (sheetDragDeltaY > 95) {
        if (panel) panel.style.transform = '';
        closeSheet();
      } else if (panel) {
        panel.style.transform = '';
      }
      sheetDragDeltaY = 0;
    }

    function openSheet(htmlContent) {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      const body = document.getElementById('bottomSheetBody');
      if (!overlay || !panel || !body) return;

      panel.style.transform = '';
      panel.className =
        'w-full rounded-t-[28px] p-5 pb-8 shadow-2xl translate-y-full transition-transform duration-350 ease-sheet max-h-[86%] overflow-y-auto no-scrollbar ' +
        t('bg-white text-ink-primary', 'bg-[#1C1C21] text-[#F2F4F6] border-t border-white/[0.08]');

      body.innerHTML = htmlContent;
      overlay.classList.remove('pointer-events-none', 'opacity-0');
      overlay.classList.add('pointer-events-auto', 'opacity-100');

      requestAnimationFrame(() => {
        panel.classList.remove('translate-y-full');
        panel.classList.add('translate-y-0');
      });
    }

    function closeSheet() {
      const overlay = document.getElementById('bottomSheetOverlay');
      const panel = document.getElementById('bottomSheetPanel');
      if (!overlay || !panel) return;

      panel.style.transform = '';
      panel.classList.add('translate-y-full');
      panel.classList.remove('translate-y-0');
      overlay.classList.add('pointer-events-none', 'opacity-0');
      overlay.classList.remove('pointer-events-auto', 'opacity-100');
    }

    function handleOverlayBackdropClick(e) {
      if (e.target && e.target.id === 'bottomSheetOverlay') closeSheet();
    }

    function screenMotionCls() {
      if (state.motion.enterType === 'forward') return 'animate-slide-right';
      if (state.motion.enterType === 'back') return 'animate-slide-left';
      if (state.motion.enterType === 'screen') return 'animate-screen-in';
      return '';
    }

    function cardMotionCls() {
      return state.motion.enterType === 'screen' ? 'animate-card-in' : '';
    }

    function cardMotionAttr(index) {
      if (state.motion.enterType !== 'screen') return '';
      return `style="animation-delay: ${index * 34}ms"`;
    }

    function animateNumberEl(elId, fromVal, toVal, formatter, duration = 420) {
      const el = document.getElementById(elId);
      if (!el || state.privacyMode) return;
      const start = performance.now();
      function frame(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(fromVal + (toVal - fromVal) * eased);
        const targetEl = document.getElementById(elId);
        if (!targetEl) return;
        targetEl.textContent = formatter(current);
        if (progress < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    /**
     * ============================================================================
     * 5. 실시간 알림함 & 상단 푸시 배너
     * ============================================================================
     */
    let pushBannerTimer = null;

    function getUnreadNotifCount() {
      return state.notifications.filter((n) => !n.read).length;
    }

    function pushNotification({ category, iconKey = 'bell', tone = 'brand', title, body, actionTab = 'home', settingKey = null }) {
      const newNotif = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        category, iconKey, tone, title, body, time: '방금 전', read: false, actionTab,
      };
      state.notifications.unshift(newNotif);
      updateNotifBadges();

      const shouldShowBanner = !settingKey || state.settings[settingKey];
      if (shouldShowBanner && !state.notifOpen) showPushBanner(newNotif);
      if (state.notifOpen) renderNotifCenter();
    }

    function showPushBanner(notif) {
      const banner = document.getElementById('pushBanner');
      const iconEl = document.getElementById('pushBannerIcon');
      const titleEl = document.getElementById('pushBannerTitle');
      const bodyEl = document.getElementById('pushBannerBody');
      if (!banner || !iconEl || !titleEl || !bodyEl) return;

      const toneCls = notif.tone === 'danger' ? 'bg-danger-soft text-danger' : notif.tone === 'success' ? 'bg-success-soft text-success' : 'bg-brand-soft text-brand';
      banner.className = 'absolute left-4 right-4 top-3.5 z-50 text-left rounded-[22px] p-3.5 shadow-2xl border transition-all duration-350 ease-spring cursor-pointer backdrop-blur-xl ' + t('bg-white/95 border-slate-200/90', 'bg-[#23232A]/95 border-white/12');
      iconEl.className = `w-10 h-10 rounded-2xl ${toneCls} flex items-center justify-center shrink-0`;
      iconEl.innerHTML = getIcon(notif.iconKey, 'bell');
      titleEl.className = `text-[13px] font-bold truncate ${t('text-ink-primary', 'text-[#F2F4F6]')}`;
      titleEl.textContent = notif.title;
      bodyEl.className = `text-[12px] mt-0.5 line-clamp-2 leading-snug ${t('text-ink-secondary', 'text-[#B0B8C1]')}`;
      bodyEl.textContent = notif.body;

      requestAnimationFrame(() => {
        banner.classList.remove('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
      });

      clearTimeout(pushBannerTimer);
      pushBannerTimer = setTimeout(() => {
        banner.classList.add('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }, 3300);
    }

    function updateNotifBadges() {
      const unread = getUnreadNotifCount();
      document.querySelectorAll('[data-notif-badge]').forEach((el) => {
        if (unread > 0) {
          el.textContent = unread > 9 ? '9+' : String(unread);
          el.classList.remove('hidden');
        } else el.classList.add('hidden');
      });
    }

    function openNotifCenter() {
      state.notifOpen = true;
      const overlay = document.getElementById('notifOverlay');
      const banner = document.getElementById('pushBanner');
      if (banner) {
        banner.classList.add('opacity-0', '-translate-y-7', 'pointer-events-none');
        banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      }
      renderNotifCenter();
      if (overlay) {
        overlay.className = 'absolute inset-0 z-50 translate-x-full transition-transform duration-320 ease-toss flex flex-col overflow-hidden ' + t('bg-canvas', 'bg-[#101012]');
        requestAnimationFrame(() => {
          overlay.classList.remove('translate-x-full');
          overlay.classList.add('translate-x-0');
        });
      }
    }

    function closeNotifCenter() {
      state.notifOpen = false;
      const overlay = document.getElementById('notifOverlay');
      if (overlay) {
        overlay.classList.add('translate-x-full');
        overlay.classList.remove('translate-x-0');
      }
      updateNotifBadges();
    }

    function setNotifFilter(cat) {
      state.notifFilter = cat;
      renderNotifCenter();
    }

    function markAllNotifsRead() {
      state.notifications.forEach((n) => { n.read = true; });
      renderNotifCenter();
      updateNotifBadges();
      showToast('모든 알림을 읽음으로 표시했어요.', 'brand');
    }

    function deleteNotification(id, e) {
      if (e) e.stopPropagation();
      state.notifications = state.notifications.filter((n) => n.id !== id);
      renderNotifCenter();
      updateNotifBadges();
    }

    function handleNotifClick(id) {
      const target = state.notifications.find((n) => n.id === id);
      if (!target) return;
      target.read = true;
      updateNotifBadges();
      closeNotifCenter();
      if (target.actionTab) switchTab(target.actionTab);
    }

      closeNotifCenter();

    function renderNotifCenter() {

            </div>
          </div>
          <div class="flex items-center gap-1.5">
            ${unreadCount > 0 ? `<button type="button" onclick="markAllNotifsRead()" class="px-2.5 py-1.5 rounded-xl bg-brand-soft text-brand text-[11px] font-bold tap-btn cursor-pointer">모두 읽음</button>` : ''}
            <button type="button" onclick="closeNotifCenter(); switchTab('settings')" class="px-2.5 py-1.5 rounded-xl ${subSurface()} ${textSecondary} text-[11px] font-bold tap-btn cursor-pointer">설정</button>

          ${filters.map((cat) => `<button type="button" onclick="setNotifFilter('${cat}')" class="px-3.5 py-1.5 rounded-full text-[11.5px] font-bold shrink-0 tap-btn cursor-pointer ${state.notifFilter === cat ? t('bg-ink-primary text-white', 'bg-white text-[#101012]') : `${cardSurface()} ${textSecondary}`}">${cat}</button>`).join('')}
        </div>
        <div class="flex-1 overflow-y-auto px-5 pb-6 space-y-2.5 no-scrollbar">${listHtml}</div>
        <div class="p-4 ${t('bg-white border-t border-slate-100', 'bg-[#151519] border-t border-white/[0.06]')} shrink-0">
          <button type="button" onclick="sendDemoCardAlert()" class="w-full py-3.5 rounded-2xl bg-brand-soft text-brand text-xs font-extrabold tap-btn cursor-pointer">실시간 푸시 알림 배너 테스트하기</button>
        </div>
      `;

      const prev = state.balance;
      state.balance += amount;
      state.transactions.unshift({
        id: Date.now(),
        title: '모아 통장 채우기 (한빛은행)',
        category: '이체',
        amount,
        time: '방금 전',
        iconKey: 'wallet',
        tone: 'bg-brand-soft text-brand',
        memo: '연결 계좌 즉시 충전',
      });
      closeSheet();
      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('homeBalanceValue', prev, state.balance, formatWon, 450);
      spawnFloatingReward(`+${formatWon(amount)}`, 'brand');
      pushNotification({
        category: '주식·송금', iconKey: 'wallet', tone: 'brand',
        title: `모아 통장에 ${formatWon(amount)}을 채웠어요`,
        body: `현재 모아 입출금 통장 잔액은 ${formatWon(state.balance)}이에요.`,
        actionTab: 'home', settingKey: 'txAlert',
      });
    }

    function addQuickGoalSavings(goalId, amount = 10000) {
      const goal = state.goals.find((g) => g.id === goalId);
      if (!goal) return;
      if (state.balance < amount) { showToast('모아 통장 잔액이 부족해요.', 'danger'); return; }
      if (goal.saved >= goal.target) { showToast('이미 목표 금액을 100% 달성했어요.', 'brand'); return; }

      const prevBalance = state.balance;
      const actualAdd = Math.min(amount, goal.target - goal.saved);
      state.balance -= actualAdd;
      goal.saved += actualAdd;

      state.transactions.unshift({
        id: Date.now(), title: `모으기 (${goal.title})`, category: '저축', amount: -actualAdd,
        time: '방금 전', iconKey: goal.iconKey, tone: goal.tone, memo: '원탭 저축',
      });

      state.motion.enterType = 'none';
      renderAll();
      animateNumberEl('homeBalanceValue', prevBalance, state.balance, formatWon, 420);
      spawnFloatingReward(`+${formatWon(actualAdd)} 모으기`, 'success');

      const reached = goal.saved >= goal.target;
      if (reached) {
        pushNotification({ category: '보안·예산', iconKey: 'spark', tone: 'success', title: `"${goal.title}" 목표 달성!`, body: `목표 금액 ${formatWon(goal.target)}을 모두 모았어요.`, actionTab: 'home', settingKey: 'txAlert' });
      }
      showToast(reached ? `"${goal.title}" 목표를 100% 달성했어요!` : `${goal.title}에 ${formatWon(actualAdd)}을 모았어요.`);
    }
